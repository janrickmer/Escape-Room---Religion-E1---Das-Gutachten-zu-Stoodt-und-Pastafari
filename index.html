/* ---------- Gestufte Hinweise ----------
   Stufe 0–2: Hinweise, die mit jedem Fehlversuch konkreter werden.
   Stufe 3 (nach drei Fehlversuchen): die komplette Lösung. */
const HINT_MAX_LEVEL = 3;

function hintLevel(idx) {
  return Math.min(state.attempts[idx], HINT_MAX_LEVEL);
}
function hintButtonLabel(idx) {
  const lv = hintLevel(idx);
  if (lv >= HINT_MAX_LEVEL) return 'Lösung anzeigen';
  return lv === 0 ? 'Hinweis anzeigen' : `Hinweis anzeigen · Stufe ${lv + 1}`;
}
function hintTitle(idx) {
  const lv = hintLevel(idx);
  if (lv >= HINT_MAX_LEVEL) return 'Lösung · nach drei Fehlversuchen';
  const fails = state.attempts[idx];
  return `Hinweis · Stufe ${lv + 1} von 4` + (fails === 0 ? '' : ` · nach ${fails} Fehlversuch${fails === 1 ? '' : 'en'}`);
}
function hintBodyHTML(idx) {
  const lv = hintLevel(idx);
  if (lv >= HINT_MAX_LEVEL) return SOLUTIONS[idx]();
  return HINTS[idx][lv];
}
function renderHintBox(idx) {
  const label = document.getElementById('hintLabel');
  const body = document.getElementById('hintBody');
  if (!label || !body) return;
  label.textContent = hintTitle(idx);
  body.innerHTML = hintBodyHTML(idx);
  state.hintMax[idx] = Math.max(state.hintMax[idx], hintLevel(idx));
}
window.showHint = (idx) => {
  const h = document.getElementById('hintBox');
  if (!h) return;
  renderHintBox(idx);
  h.classList.add('show');
  h.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
};
// Nach einem Fehlversuch: Button-Beschriftung und (falls geöffnet) Inhalt der Hinweisbox aktualisieren.
function refreshHint(idx) {
  const btn = document.getElementById('hintBtn');
  if (btn) btn.textContent = hintButtonLabel(idx);
  const h = document.getElementById('hintBox');
  if (h && h.classList.contains('show')) {
    renderHintBox(idx);
    h.classList.remove('pulse'); void h.offsetWidth; h.classList.add('pulse');
  }
}

function showStatus(type, label, msg) {
  const box = document.getElementById('statusBox');

  box.innerHTML = `<div class="status status-${type} show"><span class="label">${label}</span>${msg}</div>`;
  box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

/* ============================================================
   GENERISCHE RÄTSELKOMPONENTEN
   (Zuordnung in Felder, Multiple-Choice, Lückentext mit freier
    Eingabe, Fragen mit eindeutiger Antwort, Fall-Zuweisung)
   ============================================================ */

const roomLocked = [false, false, false, false, false, false];

function foldUmlauts(s) {
  return s.replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss');
}
function normalizeAnswer(s) {
  return String(s || '').trim().toLowerCase()
    .replace(/[„"“”‚‘’']/g, '')
    .replace(/[.!?]+$/g, '')
    .replace(',', '.')
    .replace(/\s+/g, ' ')
    .trim();
}
function answerMatches(rawVal, row) {
  const val = normalizeAnswer(rawVal);
  if (!val) return false;
  const accepts = (row.accepts || [row.answer]).map(a => normalizeAnswer(a));
  if (accepts.includes(val) || accepts.map(foldUmlauts).includes(foldUmlauts(val))) return true;
  if (row.type === 'number') {
    const num = parseFloat(val.replace(',', '.'));
    const target = parseFloat(String(row.answer).replace(',', '.'));
    if (!isNaN(num) && !isNaN(target) && Math.abs(num - target) <= (row.tolerance || 0)) return true;
  }
  return false;
}

/* ---------- Zuordnung in Felder (Bucket-Sort) ---------- */
const bucketState = {};   // key -> { assign: {cardId: bucketId}, selected: cardId|null, roomIdx }

function renderBucketSort(key, puzzle, roomIdx, poolLabel) {
  bucketState[key] = { assign: {}, selected: null, roomIdx };
  const cards = shuffle(puzzle.cards).map(c => `
    <button class="sort-card" id="${key}-card-${c.id}" onclick="selectBucketCard(event, '${key}', '${c.id}')">${c.text}</button>
  `).join('');
  const buckets = puzzle.buckets.map(b => `
    <div class="bucket" id="${key}-bucket-${b.id}" onclick="placeBucketCard('${key}', '${b.id}')">
      <div class="bucket-label">${b.label}</div>
      <div class="bucket-desc">${b.desc}</div>
      <div class="bucket-items" id="${key}-items-${b.id}"></div>
    </div>
  `).join('');
  const cls = puzzle.buckets.length === 3 ? 'bucket-area triple' : 'bucket-area';
  return `
    <div class="cards-pool" id="${key}-pool">
      <div class="cards-pool-label">${poolLabel}</div>
      ${cards}
    </div>
    <div class="${cls}">${buckets}</div>
  `;
}

window.selectBucketCard = (event, key, id) => {
  const st = bucketState[key];
  if (!st || roomLocked[st.roomIdx]) return;
  if (st.assign[id]) {
    // Karte liegt bereits in einem Feld
    if (st.selected) return;                     // Klick soll zum Feld durchreichen
    if (event) event.stopPropagation();
    delete st.assign[id];
    const card = document.getElementById(`${key}-card-${id}`);
    card.classList.remove('placed', 'correct', 'incorrect');
    document.getElementById(`${key}-pool`).appendChild(card);
    return;
  }
  if (event) event.stopPropagation();
  document.querySelectorAll(`#${key}-pool .sort-card.selected`).forEach(c => c.classList.remove('selected'));
  document.getElementById(`${key}-card-${id}`).classList.add('selected');
  st.selected = id;
  document.querySelectorAll(`[id^="${key}-bucket-"]`).forEach(b => b.classList.add('target'));
};

window.placeBucketCard = (key, bucketId) => {
  const st = bucketState[key];
  if (!st || roomLocked[st.roomIdx] || !st.selected) return;
  st.assign[st.selected] = bucketId;
  const card = document.getElementById(`${key}-card-${st.selected}`);
  card.classList.remove('selected');
  card.classList.add('placed');
  document.getElementById(`${key}-items-${bucketId}`).appendChild(card);
  st.selected = null;
  document.querySelectorAll(`[id^="${key}-bucket-"]`).forEach(b => b.classList.remove('target'));
};

function evaluateBuckets(key, puzzle, itemPrefix) {
  const st = bucketState[key];
  const placed = Object.keys(st.assign).length;
  if (placed < puzzle.cards.length) return { complete: false, missing: puzzle.cards.length - placed, errors: [], wrongIds: [] };
  const labels = {};
  puzzle.buckets.forEach(b => labels[b.id] = b.label);
  const errors = [], wrongIds = [];
  puzzle.cards.forEach(c => {
    const card = document.getElementById(`${key}-card-${c.id}`);
    card.classList.remove('correct', 'incorrect');
    if (st.assign[c.id] === c.bucket) {
      card.classList.add('correct');
    } else {
      card.classList.add('incorrect');
      wrongIds.push(c.id);
      errors.push({ kind: 'falsch_einsortiert', item: (itemPrefix || '') + c.text, wrongAnswer: labels[st.assign[c.id]] || '(unbekannt)', correctAnswer: labels[c.bucket], explanation: c.expl });
    }
  });
  return { complete: true, errors, wrongIds };
}

function resetWrongCards(key, wrongIds) {
  const st = bucketState[key];
  wrongIds.forEach(id => {
    delete st.assign[id];
    const card = document.getElementById(`${key}-card-${id}`);
    if (!card) return;
    card.classList.remove('placed', 'correct', 'incorrect');
    document.getElementById(`${key}-pool`).appendChild(card);
  });
}

/* ---------- Multiple-Choice (eine richtige Antwort) ---------- */
const mcState = {};   // mcId -> selected option id

function renderMC(mc, roomIdx) {
  mcState[mc.id] = null;
  mc._roomIdx = roomIdx;
  const opts = shuffle(mc.options).map(o => `
    <button class="mc-option" id="${mc.id}-opt-${o.id}" onclick="selectMC('${mc.id}', '${o.id}')"><span class="radio"></span><span>${o.text}</span></button>
  `).join('');
  return `
    <div class="mc-block" id="${mc.id}-block">
      <div class="mc-question">${mc.question}</div>
      <div class="mc-options">${opts}</div>
    </div>
  `;
}

const MC_REGISTRY = {};
function registerMC(mc) { MC_REGISTRY[mc.id] = mc; }

window.selectMC = (mcId, optId) => {
  const mc = MC_REGISTRY[mcId];
  if (!mc || roomLocked[mc._roomIdx]) return;
  mcState[mcId] = optId;
  document.querySelectorAll(`#${mcId}-block .mc-option`).forEach(b => b.classList.remove('selected', 'incorrect'));
  document.getElementById(`${mcId}-opt-${optId}`).classList.add('selected');
};

function evaluateMC(mc) {
  const sel = mcState[mc.id];
  if (!sel) return { answered: false, correct: false, error: null };
  const btn = document.getElementById(`${mc.id}-opt-${sel}`);
  btn.classList.remove('selected');
  if (sel === mc.correct) {
    btn.classList.add('correct');
    return { answered: true, correct: true, error: null };
  }
  btn.classList.add('incorrect');
  const wrongText = mc.options.find(o => o.id === sel).text;
  const rightText = mc.options.find(o => o.id === mc.correct).text;
  return { answered: true, correct: false, error: { kind: 'falsche_wahl', item: mc.question, wrongAnswer: wrongText, correctAnswer: rightText, explanation: mc.explanation } };
}

function resetMC(mc) {
  mcState[mc.id] = null;
  document.querySelectorAll(`#${mc.id}-block .mc-option`).forEach(b => b.classList.remove('selected', 'incorrect'));
}

/* ---------- Lückentext mit freier Eingabe ---------- */
function renderClozeProse(key, puzzle) {
  let html = puzzle.prose;
  puzzle.blanks.forEach(b => {
    html = html.replace('{{' + b.id + '}}',
      `<input type="text" class="cloze-input" id="${key}-${b.id}" placeholder="…" autocomplete="off" spellcheck="false" autocapitalize="off">`);
  });
  return `<div class="card" style="margin-top:4px;"><p class="cloze-prose">${html}</p></div>`;
}

function evaluateClozeProse(key, puzzle, itemPrefix) {
  const errors = [];
  let complete = true, allCorrect = true;
  puzzle.blanks.forEach(b => {
    const inp = document.getElementById(`${key}-${b.id}`);
    inp.classList.remove('correct', 'incorrect');
    if (!normalizeAnswer(inp.value)) { complete = false; return; }
    if (answerMatches(inp.value, b)) {
      inp.classList.add('correct');
    } else {
      inp.classList.add('incorrect');
      allCorrect = false;
      errors.push({ kind: 'falsche_eingabe', item: (itemPrefix || 'Lücke: ') + b.label, wrongAnswer: inp.value, correctAnswer: b.answer });
    }
  });
  return { complete, allCorrect, errors };
}

function lockClozeInputs(key, puzzle) {
  puzzle.blanks.forEach(b => { const el = document.getElementById(`${key}-${b.id}`); if (el) el.disabled = true; });
}

/* ---------- Fragen mit eindeutiger Antwort (Text-/Zahlenfeld) ---------- */
function renderQRows(key, rows) {
  return `<div class="cloze-grid">${rows.map(r => `
    <div class="cloze-row">
      <div class="cloze-text">${r.before}${r.after ? ' ' + r.after : ''}</div>
      <input type="text" class="cloze-input" id="${key}-${r.id}" placeholder="${r.type === 'number' ? 'Zahl' : 'Antwort'}" autocomplete="off" spellcheck="false" ${r.type === 'number' ? 'inputmode="numeric"' : ''}>
    </div>
  `).join('')}</div>`;
}

function evaluateQRows(key, rows) {
  const errors = [];
  let complete = true, allCorrect = true;
  rows.forEach(r => {
    const inp = document.getElementById(`${key}-${r.id}`);
    inp.classList.remove('correct', 'incorrect');
    if (!normalizeAnswer(inp.value)) { complete = false; return; }
    if (answerMatches(inp.value, r)) {
      inp.classList.add('correct');
    } else {
      inp.classList.add('incorrect');
      allCorrect = false;
      errors.push({ kind: 'falsche_eingabe', item: r.before, wrongAnswer: inp.value, correctAnswer: r.answer });
    }
  });
  return { complete, allCorrect, errors };
}

function lockQRows(key, rows) {
  rows.forEach(r => { const el = document.getElementById(`${key}-${r.id}`); if (el) el.disabled = true; });
}

/* ---------- Fall-Zuweisung (Fall -> Funktion per Auswahlfeld) ---------- */
function renderAssign(key, cases, options) {
  const opts = shuffle(options);
  const optHtml = '<option value="">— Funktion wählen —</option>' + opts.map(o => `<option value="${o.id}">${o.label}</option>`).join('');
  return `<div class="assign-list">${shuffle(cases).map(c => `
    <div class="assign-row" id="${key}-row-${c.id}">
      <div class="assign-text">${c.text}</div>
      <select class="assign-select" id="${key}-sel-${c.id}">${optHtml}</select>
    </div>
  `).join('')}</div>`;
}

function evaluateAssign(key, cases, labelMap) {
  const errors = [], wrongIds = [];
  let complete = true;
  cases.forEach(c => {
    const sel = document.getElementById(`${key}-sel-${c.id}`);
    const row = document.getElementById(`${key}-row-${c.id}`);
    row.classList.remove('correct', 'incorrect');
    if (!sel.value) { complete = false; return; }
    if (sel.value === c.answer) {
      row.classList.add('correct');
    } else {
      row.classList.add('incorrect');
      wrongIds.push(c.id);
      errors.push({ kind: 'falsche_zuweisung', item: c.text, wrongAnswer: labelMap[sel.value] || '(unbekannt)', correctAnswer: labelMap[c.answer], explanation: c.expl });
    }
  });
  return { complete, errors, wrongIds };
}

function resetAssign(key, wrongIds) {
  wrongIds.forEach(id => {
    const sel = document.getElementById(`${key}-sel-${id}`);
    const row = document.getElementById(`${key}-row-${id}`);
    if (sel) sel.value = '';
    if (row) row.classList.remove('incorrect');
  });
}
function lockAssign(key, cases) {
  cases.forEach(c => { const el = document.getElementById(`${key}-sel-${c.id}`); if (el) el.disabled = true; });
}


/* ============================================================
   GESTUFTE HINWEISE (Stufe 1–4) UND LÖSUNGEN (Stufe 5)
   Die Lösungen werden automatisch aus den Rätseldaten erzeugt,
   damit Hinweis und Rätsel nie auseinanderlaufen.
   ============================================================ */

function solBuckets(puzzle) {
  return puzzle.buckets.map(b =>
    `<p><strong>${b.label}:</strong></p><ul>${puzzle.cards.filter(c => c.bucket === b.id).map(c => `<li>${c.text}</li>`).join('')}</ul>`
  ).join('');
}
function solMC(mc) {
  const right = mc.options.find(o => o.id === mc.correct).text;
  return `<p><em>${mc.question}</em><br>→ <span class="sol">${right}</span></p>`;
}
function solCloze(puzzle) {
  let html = puzzle.prose;
  puzzle.blanks.forEach(b => { html = html.replace('{{' + b.id + '}}', `<span class="sol">${b.answer}</span>`); });
  return `<p>${html}</p>`;
}
function solRows(rows) {
  return `<ul>${rows.map(r => `<li>${r.before} → <span class="sol">${r.answer}</span></li>`).join('')}</ul>`;
}
function solAssign(cases, labelMap) {
  return `<ul>${cases.map(c => `<li>${c.text} → <span class="sol">${labelMap[c.answer]}</span></li>`).join('')}</ul>`;
}
const solPart = (n, title) => `<p><strong>Teil ${n} – ${title}</strong></p>`;

const SOLUTIONS = [
  () => solPart(1, 'Zuordnung') + solBuckets(PUZZLE_R1) + solPart(2, 'Kontrollfrage') + solMC(PUZZLE_R1.mc1) + solPart(3, 'Kontrollfrage') + solMC(PUZZLE_R1.mc2),
  () => solPart(1, 'Lückentext') + solCloze(PUZZLE_R2) + solPart(2, 'Fallbeispiele') + solBuckets(PUZZLE_R2),
  () => solPart(1, 'Fälle und Funktionen') + solAssign(PUZZLE_R3.cases, FUNK_LABEL) + solPart(2, 'Kontrollfrage') + solMC(PUZZLE_R3.mc1) + solPart(3, 'Fachbegriff') + solRows([PUZZLE_R3.textQ]),
  () => solPart(1, 'Faktenblatt') + solCloze(PUZZLE_R4) + solPart(2, 'Detailfragen') + solRows(PUZZLE_R4.rows),
  () => solPart(1, 'Argumente') + solBuckets(PUZZLE_R5) + solPart(2, 'Kontrollfrage') + solMC(PUZZLE_R5.mc1) + solPart(3, 'Jahreszahlen') + solRows(PUZZLE_R5.rows),

];

  if (!b.complete) { showStatus('warning', 'Noch nicht fertig', `Teil 1: Es liegen noch ${b.missing} Argumente im Pool. Ordne sie alle zu.`); return; }
  const m = evaluateMC(PUZZLE_R5.mc1);
  if (!m.answered) { showStatus('warning', 'Noch nicht fertig', 'Teil 2: Bitte beantworte die Kontrollfrage.'); return; }
  const q = evaluateQRows('r5q', PUZZLE_R5.rows);
  if (!q.complete) { showStatus('warning', 'Noch nicht fertig', 'Teil 3: Bitte trage beide Jahreszahlen ein.'); return; }
  const errors = [...b.errors]; if (m.error) errors.push(m.error); errors.push(...q.errors);
  recordAttempt(4, { errors });
  if (errors.length === 0) {
    roomLocked[4] = true;
    lockQRows('r5q', PUZZLE_R5.rows);
    showStatus('success', 'Prüfvermerk 5 abgezeichnet', 'Beide Seiten sauber getrennt, der Religionsbegriff des Gerichts erkannt. Die fünfte Ziffer rastet ein.');
    setTimeout(() => triggerReveal(4), 900);
  } else {
    showStatus('warning', 'Noch nicht alles stimmt', 'Rot markierte Argumente wandern gleich zurück in den Pool, eine rot markierte Antwort wird zurückgesetzt; rot markierte Zahlenfelder kannst du direkt korrigieren.');
    refreshHint(4);
    setTimeout(() => { resetWrongCards('r5', b.wrongIds); if (m.error) resetMC(PUZZLE_R5.mc1); }, 3500);
  }
};

  document.getElementById('revealLetter').textContent = CODE_WORD[roomIdx];

  progBox.innerHTML = '';
  for (let i = 0; i < 6; i++) {
    const span = document.createElement('span');
    span.className = 'reveal-progress-letter' + (state.solved[i] ? ' lit' : '');
    span.textContent = state.solved[i] ? CODE_WORD[i] : '·';
    progBox.appendChild(span);
  }

  const btn = document.getElementById('revealContinue');
  const isLast = roomIdx === 5;

}

/* ============================================================
   PDF 2 — Reflexions-Datei (dynamisch erzeugt)
   ============================================================ */
function generateReflexionPdf() {
  const doc = new PdfDoc();
  const W = doc.pageW, H = doc.pageH, M = doc.margin; const CW = W - 2 * M;
  const PRIMARY = [21, 95, 148], ACCENT = [59, 157, 221], MUTE = [108, 120, 136], TEXT = [25, 25, 25], LINE = [205, 205, 205];

  function header() {
    doc.startPage();
    doc.rect(0, H - 72, W, 72, PRIMARY);
    doc.text('Reflexion — Das Gutachten', M, H - 38, 18, true, [255, 255, 255]);
    doc.text('Escape-Room „Das Gutachten" · Bearbeite die Aufgaben in eigenen Worten', M, H - 58, 9, false, [207, 230, 247]);
    return H - 72 - 22;
  }
  function ensure(y, need) { if (y - need < 70) { doc.endPage(); return header(); } return y; }

  let y = header();
  const bH = 58;
  doc.rect(M, y - bH, CW, bH, [244, 248, 252]);
  doc.rect(M, y - bH, 3, bH, ACCENT);
  doc.text('NAME', M + 14, y - 15, 8, true, ACCENT);
  doc.text(state.firstName + ' ' + state.lastName, M + 14, y - 30, 12.5, true, PRIMARY);
  doc.text('GEBURTSDATUM', M + 260, y - 15, 8, true, ACCENT);
  doc.text(state.birthDate, M + 260, y - 30, 11, false, TEXT);
  doc.text('ABGESCHLOSSEN AM', M + 380, y - 15, 8, true, ACCENT);
  doc.text(fmtDateTime(state.completedAt), M + 380, y - 30, 9.5, false, TEXT);
  y -= bH + 18;

  y = doc.paragraph('Diese Reflexion vertieft die Inhalte aus den Bibliotheksräumen. Beantworte die folgenden Aufgaben in eigenen Worten – stichpunktartig oder in ganzen Sätzen.',
    M, y, CW, 10.5, false, TEXT, 14);
  y -= 8;

  for (let i = 0; i < REFLECT_TASKS.length; i++) {
    const isLast = i === REFLECT_TASKS.length - 1;
    const isSecondLast = i === REFLECT_TASKS.length - 2;
    y = ensure(y, (isLast || isSecondLast) ? 70 : 120);
    doc.text('Aufgabe ' + (i + 1), M, y, 11, true, ACCENT);
    y -= 15;
    y = doc.paragraph(REFLECT_TASKS[i], M, y, CW, 11, true, TEXT, 15);
    y -= 8;
    if (isLast || isSecondLast) {
      doc.rect(M, y - 12, 12, 12, null, MUTE);
      doc.text('erledigt', M + 20, y - 10, 9.5, false, MUTE);
      y -= 26;
    } else {
      for (let l = 0; l < 4; l++) { y -= 20; doc.line(M, y, M + CW, y, LINE, 0.5); }
      y -= 14;
    }
  }

  y = ensure(y, 30);
  doc.line(M, y, M + CW, y, LINE, 0.4); y -= 14;
  doc.text('Copyright Jan-Rickmer Feindt', M, y, 8.5, false, MUTE);
  doc.endPage();
  return doc.toBase64();
}
/* ============================================================
   DOWNLOAD-HELFER
   ============================================================ */
function translit(s) {
  return (s || '').replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue')
    .replace(/Ä/g, 'Ae').replace(/Ö/g, 'Oe').replace(/Ü/g, 'Ue').replace(/ß/g, 'ss')
    .replace(/[^a-zA-Z0-9-]/g, '');
}
function downloadPdfBase64(b64, filename) {
  const binary = atob(b64); const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  const blob = new Blob([bytes], { type: 'application/pdf' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a'); link.href = url; link.download = filename;
  document.body.appendChild(link); link.click(); document.body.removeChild(link);
  setTimeout(() => URL.revokeObjectURL(url), 1200);
}

/* ============================================================
   DIGITALES ARBEITSBLATT IM FEIDITOR („Arena")
   Der eingebettete Feiditor (neue Version mit Rich-Text, Rot-Anteil,
   Batch-Ansicht und Rekonstruktion per PDF-Upload) wird per
   document.write in einem neuen Tab geöffnet und startet automatisch
   mit den Aufgaben dieses Escape-Rooms.
   ============================================================ */
window.openFeiditor = () => {
  try {
    const tplEl = document.getElementById('feiditor-src');
    if (!tplEl) { alert('Der Feiditor konnte nicht geladen werden.'); return; }
    // Eingebetteten Feiditor-Quelltext holen und die escapten Script-End-Tags wiederherstellen
    let html = tplEl.textContent.replace(/<\\\/script>/gi, '<\/script>');
    // Escape-Room-Daten in den Feiditor injizieren: Name, die sechs Aufgaben, die roten Felder
    // und alle Daten für die Übersichts-Seiten der kombinierten PDF
    const data = {
      firstName: state.firstName,
      lastName:  state.lastName,
      birthDate: state.birthDate,
      code:      state.code,
      tasks:     REFLECT_TASKS.slice(0, 6),
      redFields: RED_FIELDS,
      overview:  {
        firstName:     state.firstName,
        lastName:      state.lastName,
        birthDate:     state.birthDate,
        code:          state.code,
        completedAt:   fmtDateTime(state.completedAt),
        attempts:      state.attempts,
        mistakes:      state.mistakes,
        hintMax:       state.hintMax,
        roomLabels:    ROOM_LABELS,
        solutionNotes: SOLUTION_NOTES,
        subtitle:      PDF_SUBLINE
      }
    };
    const inject = '<script>window.__ESCAPE_DATA__=' + JSON.stringify(data).replace(/</g, '\\u003c') + ';<\/script>';
    // Direkt nach dem öffnenden <head> einfügen (erstes Vorkommen = echter Dokument-Head;
    // ein </head> käme auch in JS-Strings des Feiditors vor und wäre kein sicherer Anker)
    if (html.indexOf('<head>') !== -1) html = html.replace('<head>', '<head>\n' + inject);
    else html = inject + html;
    // Per document.write öffnen, damit der sichere Kontext (crypto.subtle) erhalten bleibt.
    // Ein Blob-URL würde den secure context verlieren -> Verschlüsselung schlägt fehl.
    // window.open steht synchron im Klick-Handler (kein await davor).
    const win = window.open('', '_blank');
    if (!win) { alert('Bitte erlaube Pop-ups für diese Seite, damit sich die Arena (der Feiditor) öffnen kann.'); return; }
    win.document.open();
    win.document.write(html);
    win.document.close();
  } catch (e) { console.error(e); alert('Die Arena (der Feiditor) konnte nicht geöffnet werden: ' + e.message); }
};

window.downloadOverviewPDF = () => {
  try {
    const b64 = generateMistakesPdf();
    const clean = (s) => (s || '').trim().replace(/\s+/g, '-').replace(/[\/\\:*?"<>|]+/g, '');
    const vn = clean(state.firstName) || 'Vorname';
    const nn = clean(state.lastName) || 'Nachname';
    const filename = `Escape-Room-Überblick_von_${vn}_${nn}.pdf`;
    const binary = atob(b64);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    // Als generischer Binärstrom (octet-stream) statt application/pdf: So kann kein Browser die Datei
    // inline anzeigen – auch Firefox/Chrome mit „PDF im Browser öffnen" müssen sie speichern. Der Name
    // (.pdf) kommt über das download-Attribut; die Datei selbst ist eine ganz normale PDF.
    const blob = new Blob([bytes], { type: 'application/octet-stream' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url; link.download = filename; link.rel = 'noopener'; link.style.display = 'none';
    document.body.appendChild(link);
    link.click();   // synchron im Klick-Handler -> gilt als vom Nutzer ausgelöst; kein window.open, kein neuer Tab
    // Link und Object-URL erst verzögert entfernen: manche Browser brechen den Download sonst ab
    setTimeout(() => { try { document.body.removeChild(link); } catch (e) {} URL.revokeObjectURL(url); }, 5000);
  } catch (e) {
    console.error('Overview PDF generation failed:', e);
    alert('Konnte die Datei „Escape-Room-Überblick" nicht erzeugen: ' + e.message);
  }
};

window.restartGame = () => {
  state = {
    screen: 'name',
    firstName: '',
    lastName: '',
    birthDate: '',
    code: '',
    solved: [false, false, false, false, false, false],
    letters: ['_', '_', '_', '_', '_', '_'],
    mistakes: [null, null, null, null, null, null],
    attempts: [0, 0, 0, 0, 0, 0],
    hintMax: [-1, -1, -1, -1, -1, -1],
    completedAt: null,
  };
  window.state = state;
  for (let i = 0; i < 6; i++) roomLocked[i] = false;

  window.scrollTo({ top: 0, behavior: 'smooth' });
};

    case 4: renderRoom4(); break;

    case 6: renderRoom6(); break;

};
