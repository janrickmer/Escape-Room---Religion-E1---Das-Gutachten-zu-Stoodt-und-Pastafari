<script>
/* Videos erst nach Klick laden: YouTube-Rahmen tragen ihre Adresse in data-yt-src und zeigen bis zum Klick einen
   Hinweis (srcdoc). Erst „Video laden“ stellt eine Verbindung zu YouTube her (siehe Impressum & Datenschutz). */
(function(){
  function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function prep(f){
    var u=f.getAttribute('data-yt-src');
    if(!u||f.hasAttribute('srcdoc')) return;
    var go=u+(u.indexOf('?')<0?'?':'&')+'autoplay=1';
    var t=f.getAttribute('title')||'';
    if(/^YouTube video player$/i.test(t)) t='';
    f.setAttribute('srcdoc','<!doctype html><html lang="de"><head><meta charset="utf-8"><style>'
      +'html,body{margin:0;height:100%}body{display:flex;align-items:center;justify-content:center;background:#1d1d1f;color:#f2f2f2;'
      +'font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center}'
      +'.b{max-width:30em;padding:12px 16px}.t{font-weight:600;margin:0 0 10px}'
      +'a{display:inline-block;padding:10px 20px;border-radius:999px;background:#fff;color:#111;font-weight:700;text-decoration:none}'
      +'a:hover,a:focus{background:#ffd75e}p.n{margin:10px 0 0;font-size:12.5px;opacity:.8}'
      +'@media (max-height:210px){body{font-size:12px}.t{display:none}.b{padding:6px 10px}a{padding:7px 14px}p.n{margin-top:6px;font-size:11px;line-height:1.3}}</style></head><body><div class="b">'
      +(t?'<p class="t">'+esc(t)+'</p>':'')
      +'<a href="'+esc(go)+'">&#9654; Video von YouTube laden</a>'
      +'<p class="n">Erst nach diesem Klick wird das Video von YouTube (Google) geladen. Dabei erhält Google unter anderem deine IP-Adresse und kann Cookies setzen; Daten können in die USA gelangen.</p>'
      +'</div></body></html>');
  }
  function scan(n){
    if(n.nodeType!==1) return;
    if(n.tagName==='IFRAME') prep(n);
    else if(n.querySelectorAll){ var l=n.querySelectorAll('iframe[data-yt-src]'); for(var i=0;i<l.length;i++) prep(l[i]); }
  }
  new MutationObserver(function(ms){ ms.forEach(function(m){ m.addedNodes.forEach(scan); }); })
    .observe(document.documentElement,{childList:true,subtree:true});
})();
</script>
<style>
/* ============================================================
   DAS GUTACHTEN — Escape Room
   Ev. Religion · E-Phase · E1 · Funktionen von Religion (Stoodt)
   ============================================================ */

:root {
  --c-bg:           #ffffff;
  --c-bg-soft:      #f4f8fc;
  --c-bg-card:      #ffffff;
  --c-bg-tint:      #e6f2fb;
  --c-text:         #1b2733;
  --c-text-mute:    #55677a;
  --c-text-dim:     #8a99a8;
  --c-blue:         #3b9ddd;
  --c-blue-deep:    #1d7bbf;
  --c-blue-dark:    #155f94;
  --c-blue-soft:    #cfe6f7;
  --c-success:      #2c8a58;
  --c-success-bg:   #e6f5ec;
  --c-error:        #cf4f3a;
  --c-error-bg:     #fbe9e5;
  --c-warn:         #c98a1c;
  --c-warn-bg:      #fff5e0;
  --c-border:       #cddced;
  --c-border-soft:  #e3ebf3;

  --font-display: 'Manrope', 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-body:    'Manrope', 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-serif:   'Source Serif 4', 'Iowan Old Style', Georgia, 'Times New Roman', serif;
  --font-mono:    'JetBrains Mono', 'Menlo', 'Consolas', monospace;

  --shadow-soft:   0 2px 10px rgba(27, 39, 51, 0.06);
  --shadow-card:   0 6px 24px rgba(27, 39, 51, 0.07), 0 1px 3px rgba(27, 39, 51, 0.05);
  --radius:        10px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  background: var(--c-bg);
  color: var(--c-text);
  font-family: var(--font-body);
  font-weight: 400;
  line-height: 1.6;
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ============================================================
   LAYOUT
   ============================================================ */

.app { min-height: 100vh; display: flex; flex-direction: column; }

.topbar {
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(255, 255, 255, 0.92);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--c-border-soft);
  padding: 12px 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
}

.topbar-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 15px;
  letter-spacing: -0.01em;
  color: var(--c-blue-dark);
}

.topbar-brand .stars-icon { width: 24px; height: 24px; fill: none; stroke: var(--c-blue); stroke-width: 1.8; }

.topbar-progress { display: flex; gap: 7px; align-items: center; flex-wrap: wrap; }

.seal {
  width: 30px; height: 30px;
  border-radius: 50%;
  border: 1.5px solid var(--c-border);
  background: #fff;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-mono);
  font-size: 11px; font-weight: 700;
  color: var(--c-text-dim);
  transition: all 0.35s ease;
  position: relative;
}
.seal.active { border-color: var(--c-blue); color: var(--c-blue-deep); box-shadow: 0 0 0 4px var(--c-bg-tint); }
.seal.solved {
  background: var(--c-blue);
  border-color: var(--c-blue);
  color: #fff;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 13px;
}
.seal.library { width: 10px; height: 10px; border-radius: 2px; border-color: var(--c-border); background: #fff; }
.seal.library.active { border-color: var(--c-blue); background: var(--c-blue-soft); box-shadow: none; }
.seal.library.visited { border-color: var(--c-blue-soft); background: var(--c-blue-soft); }

.main { flex: 1; display: flex; align-items: flex-start; justify-content: center; padding: 52px 24px 80px; }

.site-footer {
  text-align: center;
  font-size: 11px;
  color: var(--c-text-dim);
  padding: 18px 12px 24px;
  border-top: 1px solid var(--c-border-soft);
  font-family: var(--font-mono);
  letter-spacing: 0.04em;
}

.screen { width: 100%; max-width: 900px; animation: screenIn 0.45s ease both; }
@keyframes screenIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
@media (prefers-reduced-motion: reduce) { .screen { animation: none; } }

/* ============================================================
   TYPOGRAPHY
   ============================================================ */

h1, h2, h3 { font-family: var(--font-display); font-weight: 700; line-height: 1.15; color: var(--c-text); letter-spacing: -0.02em; }

.kicker {
  font-family: var(--font-mono);
  font-size: 11px; font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--c-blue-deep);
  margin-bottom: 16px;
  display: flex; align-items: center; gap: 12px;
}
.kicker::before { content: ''; display: inline-block; width: 26px; height: 2px; background: var(--c-blue); border-radius: 2px; }

.title-mega { font-size: clamp(40px, 6.5vw, 68px); font-weight: 800; line-height: 1.02; margin-bottom: 22px; letter-spacing: -0.035em; }
.title-mega em { font-style: normal; font-weight: 500; color: var(--c-blue-deep); }

.lede { font-family: var(--font-serif); font-size: clamp(18px, 2vw, 21px); font-weight: 400; line-height: 1.55; color: var(--c-text-mute); max-width: 62ch; margin-bottom: 30px; }

p { margin-bottom: 16px; }
p.body-lg { font-size: 17px; line-height: 1.7; }
.text-mute { color: var(--c-text-mute); }
.font-mono { font-family: var(--font-mono); }
.center { text-align: center; }
.spacer-sm { height: 12px; }
.spacer-md { height: 28px; }

/* ============================================================
   COMPONENTS
   ============================================================ */

.card {
  background: var(--c-bg-card);
  border: 1px solid var(--c-border-soft);
  border-radius: var(--radius);
  padding: 32px 36px;
  margin-bottom: 22px;
  box-shadow: var(--shadow-card);
  position: relative;
}
@media (max-width: 600px) { .card { padding: 22px 20px; } }

.card-accent { position: relative; overflow: hidden; }
.card-accent::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--c-blue); }

.briefing { font-family: var(--font-serif); font-style: italic; font-size: 18px; line-height: 1.7; color: var(--c-text); padding-left: 14px; }
.briefing .speaker {
  display: block;
  font-family: var(--font-mono);
  font-style: normal;
  font-size: 10.5px; font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--c-blue-deep);
  margin-bottom: 8px;
}

/* Buttons */
.btn {
  display: inline-flex; align-items: center; gap: 10px;
  padding: 13px 24px;
  border: none;
  border-radius: 8px;
  font-family: var(--font-body);
  font-size: 14px; font-weight: 700;
  letter-spacing: 0.01em;
  cursor: pointer;
  transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
  text-decoration: none;
}
.btn:focus-visible, .hint-btn:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--c-blue-soft); outline-offset: 2px; }
.btn-primary { background: var(--c-blue); color: #fff; }
.btn-primary:hover { background: var(--c-blue-deep); transform: translateY(-1px); }
.btn-ghost { background: #fff; color: var(--c-blue-dark); border: 1px solid var(--c-border); }
.btn-ghost:hover { border-color: var(--c-blue); color: var(--c-blue-deep); background: var(--c-bg-soft); }
.btn-arrow::after { content: '→'; font-family: var(--font-mono); font-size: 16px; }
.btn-row { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 22px; }

.muted-list { list-style: none; padding: 0; }
.muted-list li { margin: 6px 0 6px 18px; font-size: 14px; position: relative; color: var(--c-text); }
.muted-list li::before { content: ''; position: absolute; left: -18px; top: 9px; width: 7px; height: 7px; border-radius: 50%; background: var(--c-blue-soft); }

/* Intro grid */
.intro-grid { display: grid; grid-template-columns: 1fr; gap: 22px; margin-bottom: 8px; }
@media (min-width: 900px) { .intro-grid { grid-template-columns: 1.6fr 1fr; align-items: start; } }
.intro-meta { background: var(--c-bg-soft); border: 1px solid var(--c-border-soft); border-radius: var(--radius); padding: 24px 26px; }
.intro-meta dt { font-family: var(--font-mono); font-size: 10.5px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--c-blue-deep); margin-top: 16px; }
.intro-meta dt:first-child { margin-top: 0; }
.intro-meta dd { font-size: 14.5px; color: var(--c-text); margin-top: 3px; line-height: 1.5; }

/* Room header — Aktenreiter */
.room-header { display: flex; align-items: center; gap: 18px; margin-bottom: 20px; }
.room-number {
  font-family: var(--font-mono);
  font-size: 15px; font-weight: 700;
  color: var(--c-blue-deep);
  background: var(--c-bg-tint);
  border: 1px solid var(--c-blue-soft);
  border-radius: 8px;
  padding: 12px 14px;
  min-width: 64px;
  text-align: center;
  letter-spacing: 0.06em;
}
.room-meta { display: flex; flex-direction: column; }
.room-location { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--c-text-dim); margin-bottom: 4px; }
.room-name { font-family: var(--font-display); font-size: clamp(24px, 3.4vw, 34px); font-weight: 800; letter-spacing: -0.025em; line-height: 1.1; }

.task-label { color: var(--c-blue-deep); font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; }

/* Status + hint */
.status {
  padding: 14px 18px;
  border-radius: 8px;
  margin: 18px 0 8px;
  font-size: 14.5px;
  line-height: 1.55;
  border: 1px solid transparent;
  opacity: 0; transform: translateY(-4px);
  transition: opacity 0.25s ease, transform 0.25s ease;
}
.status.show { opacity: 1; transform: translateY(0); }
.status-info    { background: var(--c-bg-tint);    border-color: var(--c-blue-soft); color: var(--c-blue-dark); }
.status-warning { background: var(--c-warn-bg);    border-color: #f1d9a3;            color: #6b4a08; }
.status-success { background: var(--c-success-bg); border-color: #bfe3cd;            color: #17603a; }
.status .label { display: block; font-family: var(--font-mono); font-size: 10.5px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 4px; }

.hint-box { display: none; padding: 14px 18px; border-radius: 8px; background: var(--c-bg-soft); border: 1px dashed var(--c-border); font-size: 14.5px; line-height: 1.6; margin: 14px 0 6px; color: var(--c-text); }
.hint-box.show { display: block; }
.hint-box p { margin: 0 0 8px; }
.hint-box p:last-child { margin-bottom: 0; }
.hint-box ul { margin: 4px 0 10px 20px; padding: 0; }
.hint-box li { margin: 2px 0; }
.hint-box .sol { color: var(--c-blue-dark); background: var(--c-bg-tint); padding: 0 4px; border-radius: 4px; }
.hint-box .hint-foot { margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--c-border); font-size: 12.5px; color: var(--c-text-dim); }
.hint-box.pulse { animation: hintPulse 0.9s ease; }
@keyframes hintPulse { 0% { box-shadow: 0 0 0 0 var(--c-blue-soft); } 60% { box-shadow: 0 0 0 6px rgba(207, 230, 247, 0); } 100% { box-shadow: none; } }
.hint-box .label { display: block; font-family: var(--font-mono); font-size: 10.5px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--c-blue-deep); margin-bottom: 4px; }
.hint-btn { background: none; border: none; color: var(--c-text-mute); font-family: var(--font-body); font-size: 13.5px; font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; padding: 8px 4px; }
.hint-btn:hover { color: var(--c-blue-deep); }

/* Part headings inside puzzle rooms */
.part-head { font-size: 16px; font-weight: 700; margin: 26px 0 10px; display: flex; align-items: center; gap: 10px; }
.part-head .part-tag { font-family: var(--font-mono); font-size: 10.5px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--c-blue-deep); background: var(--c-bg-tint); padding: 3px 8px; border-radius: 4px; }
.part-sub { font-size: 14.5px; color: var(--c-text-mute); margin: -4px 0 12px; }

/* ============================================================
   PUZZLE COMPONENTS
   ============================================================ */

/* Multiple choice (single select) */
.mc-block { border: 1px solid var(--c-border-soft); border-radius: var(--radius); padding: 18px 20px; margin: 10px 0 14px; background: #fff; }
.mc-question { font-size: 15.5px; font-weight: 600; margin-bottom: 12px; line-height: 1.5; }
.mc-options { display: grid; gap: 8px; }
.mc-option {
  display: flex; align-items: flex-start; gap: 12px;
  width: 100%; text-align: left;
  padding: 12px 14px;
  border: 1.5px solid var(--c-border);
  border-radius: 8px;
  background: #fff;
  font-family: var(--font-body);
  font-size: 14.5px; line-height: 1.5;
  color: var(--c-text);
  cursor: pointer;
  transition: border-color 0.15s ease, background 0.15s ease;
}
.mc-option:hover { border-color: var(--c-blue); background: var(--c-bg-soft); }
.mc-option .radio { flex: 0 0 auto; width: 18px; height: 18px; margin-top: 2px; border-radius: 50%; border: 2px solid var(--c-border); position: relative; }
.mc-option.selected { border-color: var(--c-blue); background: var(--c-bg-tint); }
.mc-option.selected .radio { border-color: var(--c-blue); }
.mc-option.selected .radio::after { content: ''; position: absolute; inset: 3px; border-radius: 50%; background: var(--c-blue); }
.mc-option.correct { border-color: var(--c-success); background: var(--c-success-bg); }
.mc-option.correct .radio { border-color: var(--c-success); }
.mc-option.correct .radio::after { content: ''; position: absolute; inset: 3px; border-radius: 50%; background: var(--c-success); }
.mc-option.incorrect { border-color: var(--c-error); background: var(--c-error-bg); }
.mc-option.incorrect .radio { border-color: var(--c-error); }
.mc-option.incorrect .radio::after { content: ''; position: absolute; inset: 3px; border-radius: 50%; background: var(--c-error); }

/* Bucket sort */
.cards-pool { border: 1.5px dashed var(--c-border); border-radius: var(--radius); padding: 16px 16px 10px; margin: 16px 0; min-height: 70px; display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start; background: var(--c-bg-soft); }
.cards-pool-label { width: 100%; font-family: var(--font-mono); font-size: 10.5px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--c-text-dim); margin-bottom: 4px; }
.sort-card {
  padding: 10px 14px;
  border: 1.5px solid var(--c-border);
  border-radius: 8px;
  background: #fff;
  font-family: var(--font-body);
  font-size: 14px; line-height: 1.45;
  color: var(--c-text);
  text-align: left;
  cursor: pointer;
  transition: border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
  margin: 0 0 6px 0;
}
.sort-card:hover { border-color: var(--c-blue); }
.sort-card.selected { border-color: var(--c-blue); background: var(--c-bg-tint); box-shadow: 0 0 0 3px var(--c-blue-soft); }
.sort-card.placed { width: 100%; }
.sort-card.correct { border-color: var(--c-success); background: var(--c-success-bg); }
.sort-card.incorrect { border-color: var(--c-error); background: var(--c-error-bg); }

.bucket-area { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin: 10px 0 8px; }
.bucket-area.triple { grid-template-columns: repeat(3, 1fr); }
@media (max-width: 720px) { .bucket-area, .bucket-area.triple { grid-template-columns: 1fr; } }
.bucket {
  border: 1.5px solid var(--c-border);
  border-radius: var(--radius);
  padding: 16px 14px 10px;
  min-height: 150px;
  background: #fff;
  cursor: pointer;
  transition: border-color 0.15s ease, background 0.15s ease;
}
.bucket.target { border-color: var(--c-blue); background: var(--c-bg-tint); border-style: dashed; }
.bucket-label { font-family: var(--font-display); font-weight: 800; font-size: 15.5px; color: var(--c-blue-dark); }
.bucket-desc { font-size: 13px; color: var(--c-text-mute); margin: 2px 0 10px; line-height: 1.45; }
.bucket-items { display: flex; flex-direction: column; gap: 6px; }

/* Assignment (case -> function) */
.assign-list { display: flex; flex-direction: column; gap: 10px; margin: 12px 0 6px; }
.assign-row { display: grid; grid-template-columns: 1fr 260px; gap: 12px; align-items: center; border: 1.5px solid var(--c-border-soft); border-radius: var(--radius); padding: 12px 14px; background: #fff; }
@media (max-width: 700px) { .assign-row { grid-template-columns: 1fr; } }
.assign-text { font-size: 14.5px; line-height: 1.5; }
.assign-select {
  width: 100%;
  padding: 10px 12px;
  border: 1.5px solid var(--c-border);
  border-radius: 8px;
  background: #fff;
  font-family: var(--font-body);
  font-size: 14px;
  color: var(--c-text);
}
.assign-row.correct { border-color: var(--c-success); background: var(--c-success-bg); }
.assign-row.incorrect { border-color: var(--c-error); background: var(--c-error-bg); }

/* Cloze (free text) */
.cloze-prose { font-family: var(--font-serif); font-size: 17px; line-height: 2.1; color: var(--c-text); }
.cloze-input {
  display: inline-block;
  min-width: 150px;
  padding: 5px 10px;
  margin: 0 3px;
  border: none;
  border-bottom: 2px solid var(--c-blue);
  border-radius: 4px 4px 0 0;
  background: var(--c-bg-tint);
  font-family: var(--font-body);
  font-size: 15px; font-weight: 600;
  color: var(--c-blue-dark);
  text-align: center;
  vertical-align: baseline;
}
.cloze-input:focus { outline: none; background: #dbeefb; }
.cloze-input.correct { border-bottom-color: var(--c-success); background: var(--c-success-bg); color: #17603a; }
.cloze-input.incorrect { border-bottom-color: var(--c-error); background: var(--c-error-bg); color: #8f2f22; }

.cloze-grid { display: grid; gap: 10px; margin: 12px 0 6px; }
.cloze-row { display: grid; grid-template-columns: 1fr 200px; gap: 12px; align-items: center; border: 1.5px solid var(--c-border-soft); border-radius: var(--radius); padding: 12px 14px; background: #fff; }
@media (max-width: 640px) { .cloze-row { grid-template-columns: 1fr; } }
.cloze-text { font-size: 14.5px; line-height: 1.5; }
.cloze-row .cloze-input { width: 100%; min-width: 0; margin: 0; }

/* Matching (pairs) */
.matching-board { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 12px 0 8px; }
@media (max-width: 640px) { .matching-board { grid-template-columns: 1fr; } }
.match-col-label { font-family: var(--font-mono); font-size: 10.5px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--c-text-dim); margin-bottom: 8px; }
.match-card {
  display: flex; align-items: flex-start; gap: 12px;
  width: 100%; text-align: left;
  padding: 12px 14px; margin-bottom: 8px;
  border: 1.5px solid var(--c-border);
  border-radius: 8px;
  background: #fff;
  font-family: var(--font-body);
  font-size: 14px; line-height: 1.45;
  color: var(--c-text);
  cursor: pointer;
  transition: border-color 0.15s ease, background 0.15s ease;
}
.match-card:hover { border-color: var(--c-blue); }
.match-card .match-marker { flex: 0 0 auto; width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--c-border); display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 11.5px; font-weight: 700; color: var(--c-text-dim); }
.match-card.selected { border-color: var(--c-blue); background: var(--c-bg-tint); }
.match-card.paired { border-color: var(--c-blue-soft); background: var(--c-bg-soft); }
.match-card.paired .match-marker { background: var(--c-blue); border-color: var(--c-blue); color: #fff; }
.match-card.correct-pair { border-color: var(--c-success); background: var(--c-success-bg); }
.match-card.correct-pair .match-marker { background: var(--c-success); border-color: var(--c-success); color: #fff; }
.match-card.wrong-pair { border-color: var(--c-error); background: var(--c-error-bg); }
.match-card.wrong-pair .match-marker { background: var(--c-error); border-color: var(--c-error); color: #fff; }
.match-strong { font-weight: 700; color: var(--c-blue-dark); }

/* Video */
.video-wrap { position: relative; width: 100%; padding-top: 56.25%; border-radius: var(--radius); overflow: hidden; background: var(--c-bg-soft); border: 1px solid var(--c-border-soft); margin: 8px 0 12px; }
.video-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.intro-video { max-width: 720px; margin: 4px 0 22px; }
.btn.btn-small { padding: 7px 12px; font-size: 13px; }
.intro-video .video-wrap { margin-top: 0; }
.fallback-line { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; font-size: 13.5px; color: var(--c-text-mute); margin-bottom: 26px; }

/* ============================================================
   LIBRARY ROOMS
   ============================================================ */

.library-banner { display: flex; gap: 14px; align-items: flex-start; background: var(--c-bg-tint); border: 1px solid var(--c-blue-soft); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 26px; }
.library-banner-icon { flex: 0 0 auto; width: 26px; height: 26px; color: var(--c-blue-deep); margin-top: 2px; }
.library-banner-text { font-size: 14px; line-height: 1.55; color: var(--c-blue-dark); }
.library-banner-text strong { font-weight: 800; }
.library-banner-text .warn { display: block; margin-top: 6px; font-weight: 700; color: #8f5b0a; }

.lib-section { margin-bottom: 30px; }
.lib-section-title { font-family: var(--font-display); font-size: 21px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 10px; color: var(--c-text); padding-left: 12px; border-left: 4px solid var(--c-blue); line-height: 1.25; }
.lib-section-lede { font-size: 15px; color: var(--c-text-mute); margin-bottom: 10px; }
.lib-section p { font-family: var(--font-serif); font-size: 17px; line-height: 1.72; color: var(--c-text); margin-bottom: 12px; max-width: 74ch; }
.lib-section p strong { font-weight: 600; color: var(--c-blue-dark); }
.lib-section p em { font-style: italic; }

.lib-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin: 12px 0 6px; }
.lib-grid.triple { grid-template-columns: repeat(3, 1fr); }
@media (max-width: 720px) { .lib-grid, .lib-grid.triple { grid-template-columns: 1fr; } }
.lib-card { background: var(--c-bg-soft); border: 1px solid var(--c-border-soft); border-radius: var(--radius); padding: 16px 18px; }
.lib-card.teal { background: var(--c-bg-tint); border-color: var(--c-blue-soft); }
.lib-card.muted { background: #fff; }
.lib-card-sub { font-family: var(--font-mono); font-size: 10.5px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--c-blue-deep); margin-bottom: 4px; }
.lib-card-title { font-family: var(--font-display); font-size: 16.5px; font-weight: 800; margin-bottom: 6px; letter-spacing: -0.01em; }
.lib-card-body { font-size: 14px; line-height: 1.55; color: var(--c-text); }
.lib-card-body strong { color: var(--c-blue-dark); }

.lib-table { width: 100%; border-collapse: collapse; margin: 10px 0 8px; font-size: 14.5px; }
.lib-table th { text-align: left; font-family: var(--font-mono); font-size: 10.5px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--c-blue-deep); padding: 8px 12px; border-bottom: 2px solid var(--c-blue-soft); background: var(--c-bg-tint); }
.lib-table td { padding: 11px 12px; border-bottom: 1px solid var(--c-border-soft); vertical-align: top; line-height: 1.5; }
.lib-table td:first-child { font-weight: 700; color: var(--c-blue-dark); width: 30%; }
.lib-table tr:nth-child(even) td { background: var(--c-bg-soft); }

.lib-bullets { list-style: none; padding: 0; margin: 8px 0 8px; }
.lib-bullets li { position: relative; padding-left: 22px; margin: 7px 0; font-size: 15px; line-height: 1.55; }
.lib-bullets li::before { content: ''; position: absolute; left: 4px; top: 10px; width: 8px; height: 8px; border-radius: 2px; background: var(--c-blue); }
.lib-bullets li strong { color: var(--c-blue-dark); }

.lib-quote { font-family: var(--font-serif); font-style: italic; font-size: 18px; line-height: 1.6; color: var(--c-blue-dark); border-left: 4px solid var(--c-blue-soft); padding: 6px 0 6px 18px; margin: 12px 0 8px; max-width: 70ch; }

.lib-note { background: var(--c-warn-bg); border: 1px solid #f1d9a3; border-radius: var(--radius); padding: 14px 18px; margin: 12px 0 6px; font-size: 14.5px; line-height: 1.6; }
.lib-note strong { color: #6b4a08; }

.lib-warning-bar { display: flex; gap: 14px; align-items: center; background: var(--c-warn-bg); border: 1px solid #f1d9a3; border-radius: var(--radius); padding: 14px 18px; margin-top: 8px; }
.lib-warning-bar .icon { flex: 0 0 auto; width: 24px; height: 24px; color: #b8791a; }
.lib-warning-bar .text { font-size: 14px; line-height: 1.5; color: #4d3708; }
.lib-warning-bar .text strong { font-weight: 800; }

/* ============================================================
   LETTER REVEAL OVERLAY
   ============================================================ */

.reveal-overlay { position: fixed; inset: 0; z-index: 200; background: rgba(255, 255, 255, 0.94); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
.reveal-overlay.show { opacity: 1; pointer-events: auto; }
.reveal-inner { text-align: center; padding: 32px; max-width: 520px; }
.reveal-letter { display: inline-flex; align-items: center; justify-content: center; width: 150px; height: 150px; border-radius: 50%; background: var(--c-blue); color: #fff; font-family: var(--font-display); font-size: 84px; font-weight: 800; box-shadow: 0 16px 40px rgba(59, 157, 221, 0.35); animation: letterReveal 0.6s cubic-bezier(0.16, 1, 0.3, 1) both; }
@keyframes letterReveal { from { transform: scale(0.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.reveal-caption { margin-top: 22px; font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--c-blue-deep); }
.reveal-progress { display: flex; justify-content: center; gap: 10px; margin-top: 18px; }
.reveal-progress-letter { width: 40px; height: 44px; border-radius: 8px; border: 1.5px solid var(--c-border); display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-size: 20px; font-weight: 800; color: var(--c-text-dim); background: #fff; }
.reveal-progress-letter.lit { border-color: var(--c-blue); background: var(--c-bg-tint); color: var(--c-blue-dark); }
.reveal-next { margin-top: 26px; }
@media (prefers-reduced-motion: reduce) { .reveal-letter { animation: none; } }

/* ============================================================
   ZWISCHENSTAND-SEITE (nach dem letzten Rätselraum, vor dem Finale)
   ============================================================ */

.mid-hero { text-align: center; margin-bottom: 18px; }
.mid-hero .section-title { font-size: clamp(26px, 3.6vw, 34px); margin-bottom: 2px; }
.mid-hero .lede { font-size: 18px; }
.mid-steps { display: flex; justify-content: center; align-items: center; gap: 10px; flex-wrap: wrap; margin: 12px 0 0; }
.mid-step { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; border: 1.5px solid var(--c-border); background: var(--c-bg-card); font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 700; color: var(--c-text-mute); }
.mid-step.done { border-color: var(--c-success); background: var(--c-success-bg); color: var(--c-success); }
.mid-step.next { border-color: var(--c-blue); background: var(--c-bg-tint); color: var(--c-blue-dark); }
.code-badge { display: inline-flex; align-items: baseline; gap: 10px; padding: 5px 14px; border-radius: 12px; background: var(--c-bg-card); border: 1.5px solid var(--c-border); box-shadow: var(--shadow-soft); font-family: var(--font-display); font-size: 20px; font-weight: 800; letter-spacing: 0.14em; color: var(--c-blue-dark); }
.code-badge small { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--c-text-mute); font-weight: 700; }
.pause-card { margin-top: 18px; padding: 20px 22px; border: 2px dashed var(--c-border); border-radius: 14px; background: var(--c-bg-soft); }
.pause-card h3 { font-size: 18px; margin-bottom: 8px; }
.pause-card p { font-size: 14px; color: var(--c-text-mute); line-height: 1.55; margin: 0 0 14px; }
.pause-card .msg { margin: 10px 0 0; color: #17603a; }
.pause-card .msg.is-err { color: #8f2f22; }
.save-lead { margin: 22px 0 0; font-size: 13.5px; color: var(--c-text-mute); }
[data-save-slot] .save-bar { margin-top: 8px; padding-top: 0; border-top: 0; }
.pause-btn { display: inline-flex; align-items: center; gap: 10px; background: var(--c-bg-card); color: var(--c-blue-dark); border: 2px solid var(--c-blue); border-radius: 12px; padding: 13px 20px; font-family: var(--font-body); font-size: 15px; font-weight: 700; text-align: left; cursor: pointer; transition: all .2s ease; }
.pause-btn:hover { background: var(--c-bg-tint); transform: translateY(-1px); }
.pause-btn svg { width: 20px; height: 20px; flex: none; }
.readmore { display: flex; align-items: center; gap: 14px; margin: 40px 0 16px; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 700; color: var(--c-text-mute); }
.readmore::before, .readmore::after { content: ''; flex: 1; height: 1px; background: var(--c-border); }
.code-box { display: inline-block; margin-top: 18px; padding: 16px 26px; background: var(--c-bg-tint); border: 1px solid var(--c-blue-soft); border-radius: var(--radius); }
.code-box .code-label { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--c-blue-deep); }
.code-box .code-value { font-family: var(--font-mono); font-size: 30px; font-weight: 700; color: var(--c-blue-dark); letter-spacing: 0.06em; margin-top: 4px; }

/* ---- Arena: das große Finale im Feiditor-Feibeitsblatt (dunkel, dramatisch – bewusst unabhängig vom hellen Farbschema) ---- */
.arena{ background:radial-gradient(120% 90% at 50% 0%, #17223a 0%, #0b1220 55%, #070c16 100%); color:#e9eef7; border-radius:14px; padding:26px 28px 26px; margin-top:22px; box-shadow:0 18px 50px rgba(0,0,0,.45); border:1px solid rgba(255,255,255,.06); }
.arena-kicker{ font-family:var(--font-mono); font-size:11px; letter-spacing:.28em; text-transform:uppercase; color:#d6b25e; font-weight:600; text-align:center; }
.arena h2{ font-family:var(--font-display); font-size:26px; font-weight:700; color:#fff; text-align:center; margin:6px 0 14px; letter-spacing:.01em; }
.arena p{ max-width:620px; margin:0 auto 22px; text-align:center; font-size:15px; line-height:1.6; color:#b9c4d8; }
/* Video und YouTube-Link in der Arena: hell auf dunklem Grund */
.arena .video-wrap{ max-width:760px; margin:0 auto 10px; background:#05080f; border-color:rgba(255,255,255,.1); }
.arena .fallback-line{ justify-content:center; max-width:760px; margin:0 auto 22px; color:#7f8cab; }
.arena .fallback-line .btn-ghost{ background:transparent; color:#f0cf78; border-color:rgba(240,207,120,.5); }
.arena .fallback-line .btn-ghost:hover{ background:rgba(240,207,120,.12); color:#f6dc96; border-color:#f0cf78; }
.arena-gate{ display:block; width:100%; max-width:760px; margin:0 auto; padding:0; border:0; background:transparent; cursor:pointer; position:relative; border-radius:12px; overflow:hidden; outline:none; }
.arena-gate svg{ display:block; width:100%; height:auto; }
.arena-gate .gate-glow{ opacity:0; transition:opacity .4s ease; }
.arena-gate:hover .gate-glow, .arena-gate:focus-visible .gate-glow{ opacity:1; }
.arena-gate .gate-field{ transition:filter .3s ease; }
.arena-gate:hover .gate-field{ filter:brightness(1.2); }
.arena-gate:focus-visible{ box-shadow:0 0 0 3px #d6b25e; }
/* Button im Gang: sitzt unten über dem Bild, der ganze Gang ist klickbar */
.arena-enter{ position:absolute; left:50%; bottom:22px; transform:translateX(-50%); display:inline-flex; align-items:center; gap:10px; background:linear-gradient(135deg,#f0cf78,#d6b25e); color:#1a1305; font-family:var(--font-body); font-size:15.5px; font-weight:800; padding:14px 26px; border-radius:999px; box-shadow:0 8px 24px rgba(0,0,0,.55); white-space:nowrap; pointer-events:none; transition:transform .2s ease, box-shadow .2s ease; }
.arena-gate:hover .arena-enter, .arena-gate:focus-visible .arena-enter{ transform:translateX(-50%) translateY(-3px); box-shadow:0 12px 30px rgba(0,0,0,.6); }
.arena .gate-hint{ max-width:760px; margin:16px auto 0; text-align:center; font-size:12.5px; line-height:1.55; color:#7f8cab; }
.arena-enter svg{ width:18px; height:18px; flex:none; }
/* Gesperrtes Tor: grau, ohne Leuchten */
.arena-gate[aria-disabled="true"]{ cursor:not-allowed; filter:grayscale(1); opacity:.65; }
.arena-gate[aria-disabled="true"]:hover .gate-glow, .arena-gate[aria-disabled="true"]:focus-visible .gate-glow{ opacity:0; }
.arena-gate[aria-disabled="true"]:hover .gate-field{ filter:none; }
.arena-gate[aria-disabled="true"]:hover .arena-enter, .arena-gate[aria-disabled="true"]:focus-visible .arena-enter{ transform:translateX(-50%); box-shadow:0 8px 24px rgba(0,0,0,.55); }
/* Vorbereitung vor dem Tor: helle Karte auf dunklem Grund */
.arena .prep{ max-width:760px; margin:0 auto 22px; padding:20px 22px; background:var(--c-bg-card); color:var(--c-text); border-radius:var(--radius); text-align:left; }
.arena .prep h3{ font-size:18px; margin-bottom:10px; color:var(--c-text); }
.arena .prep ol{ padding-left:1.3em; display:grid; gap:14px; }
.arena .prep li{ font-size:14.5px; line-height:1.55; color:var(--c-text); }
.arena .prep li::marker{ font-weight:700; color:var(--c-blue-deep); }
.arena .prep .btn-row{ margin-top:10px; }
.arena .prep p{ max-width:none; margin:10px 0 0; text-align:left; font-size:14px; }
/* Sperrhinweis und Speicher-Knopf im gesperrten Finale */
.gate-locked{ display:grid; grid-template-columns:auto minmax(0,1fr); gap:12px; align-items:start; max-width:760px; margin:0 auto 12px; padding:14px 16px; background:var(--c-warn-bg); border:1px solid #f1d9a3; border-radius:var(--radius); color:#6b4a08; font-weight:600; font-size:14.5px; line-height:1.5; text-align:left; }
.arena p.gate-locked{ color:#6b4a08; text-align:left; max-width:760px; margin:0 auto 12px; font-size:14.5px; line-height:1.5; }   /* schlägt .arena p */
.gate-locked svg{ width:22px; height:22px; margin-top:1px; flex:none; }
.gate-locked:focus{ outline:3px solid #d6b25e; outline-offset:3px; }
.gate-save{ display:flex; justify-content:center; margin:0 auto 22px; }
.arena .save-btn{ background:transparent; color:#f0cf78; border-color:rgba(240,207,120,.5); }
.arena .save-btn:hover{ background:rgba(240,207,120,.12); color:#f6dc96; border-color:#f0cf78; }
/* Meldungen unter den Knöpfen (PDF, Tunnel) */
.msg{ margin-top:10px; font-size:14px; font-weight:600; line-height:1.45; color:#17603a; }
.msg:empty{ display:none; }
.msg.is-err{ padding:10px 14px; background:var(--c-error-bg); border-left:3px solid var(--c-error); border-radius:6px; color:#8f2f22; }
.arena .msg{ max-width:760px; margin:12px auto 0; text-align:center; color:#f6dc96; }
.arena .msg.is-err{ color:#8f2f22; }
.arena .prep .msg{ margin:10px 0 0; text-align:left; color:#17603a; }
.arena .prep .msg.is-err{ color:#8f2f22; }
@media (max-width:600px){ .arena{ padding:26px 16px 22px; } .arena h2{ font-size:24px; } .arena-enter{ white-space:normal; text-align:center; width:max-content; max-width:92%; font-size:13px; line-height:1.25; padding:10px 16px; bottom:12px; gap:6px; } }

.gutachten { font-family: var(--font-serif); font-size: 16.5px; line-height: 1.7; background: var(--c-bg-soft); border: 1px solid var(--c-border-soft); border-radius: var(--radius); padding: 26px 30px; }
.gutachten .gutachten-head { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--c-blue-deep); margin-bottom: 10px; }
.gutachten .empty-field { display: block; margin-top: 10px; padding: 14px 16px; border: 2px dashed var(--c-blue-soft); border-radius: 8px; color: var(--c-text-dim); font-family: var(--font-body); font-size: 14px; }

/* Inputs (name screen) */
.field-label { display: block; font-family: var(--font-mono); font-size: 10.5px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--c-blue-deep); margin-bottom: 6px; }
.field-input { width: 100%; padding: 12px 14px; background: #fff; border: 1.5px solid var(--c-border); border-radius: 8px; color: var(--c-text); font-family: var(--font-body); font-size: 15px; }
.field-input:focus { outline: none; border-color: var(--c-blue); box-shadow: 0 0 0 3px var(--c-blue-soft); }
.field-error { display: block; margin-top: 14px; padding: 10px 14px; background: var(--c-error-bg); border-left: 3px solid var(--c-error); color: #8f2f22; font-size: 13.5px; border-radius: 6px; }
.field-error:empty { display: none; }
.start-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.start-fields + .start-fields { margin-top: 16px; }
@media (max-width: 520px) { .start-fields { grid-template-columns: 1fr; } }
.sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

/* ---------- Zwischenstand speichern / laden ---------- */
.save-bar { display: flex; justify-content: flex-start; margin-top: 44px; padding-top: 18px; border-top: 1px dashed var(--c-border); }
.save-btn { display: inline-flex; align-items: center; gap: 9px; padding: 10px 18px; background: #fff; color: var(--c-blue-dark); border: 1px solid var(--c-border); border-radius: 8px; font-family: var(--font-body); font-size: 13.5px; font-weight: 700; cursor: pointer; transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease; }
.save-btn:hover { border-color: var(--c-blue); color: var(--c-blue-deep); background: var(--c-bg-soft); }
.save-btn svg { width: 18px; height: 18px; flex: none; }
.save-load-field { display: flex; align-items: center; gap: 14px; width: 100%; max-width: 640px; margin-top: 8px; padding: 16px 20px; background: var(--c-bg-soft); border: 1.5px dashed var(--c-border); border-radius: var(--radius); color: var(--c-text); font-family: var(--font-body); font-size: 15px; font-weight: 700; text-align: left; cursor: pointer; transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease; }
.save-load-field:hover { border-color: var(--c-blue); color: var(--c-blue-dark); background: var(--c-bg-tint); }
.save-load-field svg { width: 24px; height: 24px; flex: none; color: var(--c-blue-deep); }
.save-drop { position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 28px 18px; border: 1.5px dashed var(--c-border); border-radius: var(--radius); background: var(--c-bg-soft); color: var(--c-text-mute); text-align: center; font-size: 14.5px; line-height: 1.5; cursor: pointer; transition: background 0.2s ease, border-color 0.2s ease; }
.save-drop:hover, .save-drop.drag, .save-drop:focus-within { border-color: var(--c-blue); background: var(--c-bg-tint); }
.save-drop svg { width: 30px; height: 30px; color: var(--c-blue); }
.save-drop strong { color: var(--c-blue-dark); }
.save-drop input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.input-error { display: none; margin-top: 14px; padding: 10px 14px; background: var(--c-error-bg); border-left: 3px solid var(--c-error); color: #8f2f22; font-size: 13.5px; border-radius: 6px; }
.save-toast { position: fixed; left: 50%; bottom: 22px; z-index: 2000; max-width: calc(100vw - 32px); width: max-content; padding: 12px 18px; background: var(--c-text); color: #fff; border-radius: var(--radius); box-shadow: var(--shadow-card); font-family: var(--font-body); font-size: 14px; font-weight: 600; line-height: 1.45; opacity: 0; transform: translate(-50%, 16px); transition: opacity 0.25s ease, transform 0.25s ease; pointer-events: none; }
.save-toast.show { opacity: 1; transform: translate(-50%, 0); }
.resume-pdf { margin-top: 16px; font-size: 13.5px; line-height: 1.55; color: var(--c-text-mute); }

/* ---------- Rückfrage vor dem Tunnel ---------- */
dialog { width: min(440px, calc(100vw - 32px)); max-width: none; max-height: calc(100dvh - 32px); margin: auto; padding: 26px 28px; overflow: auto; border: 1px solid var(--c-border-soft); border-radius: 14px; background: var(--c-bg-card); color: var(--c-text); box-shadow: var(--shadow-card); }
dialog::backdrop { background: rgba(27, 39, 51, 0.55); }
dialog h2 { font-size: 20px; margin-bottom: 10px; }
dialog p { font-size: 14.5px; line-height: 1.55; color: var(--c-text-mute); }
.dlg-actions { display: grid; gap: 10px; margin-top: 20px; }
.dlg-actions .btn { justify-content: center; }
@media (max-width: 380px) { dialog { padding: 18px; } }

</style>

<script>
/* ============================================================
   GAME STATE & DATA
   ============================================================ */

const CODE_WORD = 'STOODT';
const FULL_CODE = 'STOODT';

// interner Übermittlungscode
const MAGIC = 15;
function computeCode(birthDigits) {
  const n = parseInt(birthDigits, 10);
  return String(n * 1104 + MAGIC);
}

const FEIBEITSBLATT_URL = 'https://feibeitsblatt.janrickmer.de/';
const FEIBEITSBLATT_CODE = '';                       // Code des Escape-Blattes im Feibeitsblatt (6 Zeichen ohne Bindestrich); leer = Finale gesperrt
const ESCAPE_ROOM = { id: 'religion-e1-gutachten-stoodt-pastafari', name: 'Das Gutachten', url: 'https://escape-room-e1rel-stoodt.janrickmer.de/' };
// Testhaken: nur wenn vor dem Laden window.__FF_TEST__ gesetzt ist (automatische Tests, nie produktiv)
const FF_TEST = (window.__FF_TEST__ && typeof window.__FF_TEST__ === 'object') ? window.__FF_TEST__ : null;
const FB_URL  = (FF_TEST && typeof FF_TEST.feibeitsblattUrl === 'string') ? FF_TEST.feibeitsblattUrl : FEIBEITSBLATT_URL;
const FB_CODE = (c => { c = String(c || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); return c.length === 6 ? c : ''; })(
  (FF_TEST && typeof FF_TEST.code === 'string') ? FF_TEST.code : FEIBEITSBLATT_CODE);

// Fisher-Yates – echte Zufallsreihenfolge für alle Antwortoptionen
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

const ROOMS = [
  {
    id: 1,
    location: 'Arbeitszimmer Hagedorn · Ordner I',
    name: 'Der Streitfall und die Grundfrage',
    letter: 'S',
    briefing: `<span class="speaker">Prüfvermerk 1 · Notiz der Professorin</span>
      "Bevor irgendjemand über die Nudelmesse urteilt, muss die Grundfrage sauber geklärt sein: Mit welchem Religionsbegriff prüfen wir eigentlich? Sortiere die Definitionen aus meinem Ordner – und beantworte die beiden Kontrollfragen. Erst dann rastet die erste Ziffer des Tresors ein."`,
    task: 'Löse <strong>alle drei Teile</strong>: Ordne die sechs Aussagen dem passenden Religionsbegriff zu (Teil 1) und beantworte die beiden Kontrollfragen (Teil 2 und 3). Anschließend „Prüfen".',
    type: 'buckets+mc',
  },
  {
    id: 2,
    location: 'Arbeitszimmer Hagedorn · Ordner II',
    name: 'Der Mensch in Not und Sinnsuche',
    letter: 'T',
    briefing: `<span class="speaker">Prüfvermerk 2 · Notiz der Professorin</span>
      "Die ersten drei Funktionen nach Stoodt betreffen das Innenleben des Menschen: seine Angst, seine Sinnsuche, sein Schicksal. Wer sie verwechselt, prüft später falsch. Fülle den Vermerk aus und sortiere die Fallbeispiele."`,
    task: 'Löse <strong>beide Teile</strong>: Fülle die Lücken im Prüfvermerk selbst aus (Teil 1) und ordne die sechs Fallbeispiele der passenden Funktion zu (Teil 2). Anschließend „Prüfen".',
    type: 'cloze+buckets',
  },
  {
    id: 3,
    location: 'Arbeitszimmer Hagedorn · Ordner III',
    name: 'Handeln und Gemeinschaft',
    letter: 'O',
    briefing: `<span class="speaker">Prüfvermerk 3 · Notiz der Professorin</span>
      "Jetzt sind alle sechs Funktionen auf dem Tisch. Ein Gutachten taugt nur, wenn man sie in echten Fällen sicher erkennt – auch die drei aus Ordner II. Weise jedem Fall die passende Funktion zu."`,
    task: 'Löse <strong>alle drei Teile</strong>: Weise jedem der sechs Fälle eine der sechs Funktionen zu (Teil 1), beantworte die Kontrollfrage (Teil 2) und trage den gesuchten Fachbegriff ein (Teil 3). Anschließend „Prüfen".',
    type: 'assign+mc+text',
  },
  {
    id: 4,
    location: 'Arbeitszimmer Hagedorn · Ordner IV',
    name: 'Der Kläger: die Pastafari',
    letter: 'O',
    briefing: `<span class="speaker">Prüfvermerk 4 · Notiz der Professorin</span>
      "Man kann nur prüfen, was man kennt. Wer sind die Pastafari, woher kommen sie, was tun sie? Vervollständige das Faktenblatt – und beantworte die drei Detailfragen aus der Akte."`,
    task: 'Löse <strong>beide Teile</strong>: Fülle die Lücken im Faktenblatt selbst aus (Teil 1) und beantworte die drei Detailfragen (Teil 2). Anschließend „Prüfen".',
    type: 'cloze+text',
  },
  {
    id: 5,
    location: 'Arbeitszimmer Hagedorn · Ordner V',
    name: 'Die Gerichtsakte',
    letter: 'D',
    briefing: `<span class="speaker">Prüfvermerk 5 · Notiz der Professorin</span>
      "Zwei Seiten, zwei Argumentationen. Ein Gutachten muss beide sauber auseinanderhalten – und erkennen, mit welchem Religionsbegriff das Gericht eigentlich gearbeitet hat."`,
    task: 'Löse <strong>alle drei Teile</strong>: Ordne die sechs Argumente der richtigen Seite zu (Teil 1), beantworte die Kontrollfrage (Teil 2) und trage die beiden Jahreszahlen ein (Teil 3). Anschließend „Prüfen".',
    type: 'buckets+mc+numbers',
  },
  {
    id: 6,
    location: 'Arbeitszimmer Hagedorn · Ordner VI',
    name: 'Der Prüfbogen',
    letter: 'T',
    briefing: `<span class="speaker">Schlussvermerk · Notiz der Professorin</span>
      "Letzter Ordner. Übertrage die Befunde meines Prüfbogens zu den Pastafari korrekt, beantworte die beiden Schlussfragen und trage den Namen ein, auf dem das ganze Gutachten beruht. Dann öffnet sich der Tresor."`,
    task: 'Löse <strong>alle drei Teile</strong>: Ordne die sechs Funktionen dem Befund zu, den der Prüfbogen <strong>für die Pastafari</strong> festhält (Teil 1), beantworte die beiden Schlussfragen – eine zum Vergleichsfall Fußballfanclub, eine zu den Pastafari (Teil 2) – und trage den gesuchten Namen ein (Teil 3). Anschließend „Prüfen".',
    type: 'buckets+mc+text',
  },
];

// ===== Namen der sechs Funktionen (einheitlich im ganzen Escape-Room) =====
const FUNKTIONEN = [
  { id: 'angst', label: 'Angstbewältigung' },
  { id: 'welt',  label: 'Weltdeutung / Sinnstiftung' },
  { id: 'kont',  label: 'Kontingenzbewältigung' },
  { id: 'hand',  label: 'Handlungsführung' },
  { id: 'gem',   label: 'Gemeinschaftsbildung / soziale Integration' },
  { id: 'eman',  label: 'Weltdistanzierung / Emanzipation' },
];
const FUNK_LABEL = {};
FUNKTIONEN.forEach(f => FUNK_LABEL[f.id] = f.label);

// ===== Puzzle data =====

/* Raum 1 · Ordner I */
const PUZZLE_R1 = {
  buckets: [
    { id: 'sub', label: 'Substanzieller Religionsbegriff', desc: 'Fragt: Was ist Religion ihrem Kern nach?' },
    { id: 'fun', label: 'Funktionaler Religionsbegriff',   desc: 'Fragt: Was leistet Religion für Menschen und Gesellschaft?' },
  ],
  cards: [
    { id: 'c1', text: 'Religion ist der Glaube an Gott, Götter oder eine höhere Macht.', bucket: 'sub', expl: 'Hier wird Religion über ihren Inhalt bestimmt – den Bezug auf eine höhere Macht. Das ist substanziell.' },
    { id: 'c2', text: 'Religion ist alles, was Menschen hilft, mit der Angst vor dem Tod umzugehen.', bucket: 'fun', expl: 'Hier zählt nur, was Religion bewirkt (Angstbewältigung) – nicht, woran geglaubt wird. Das ist funktional.' },
    { id: 'c3', text: 'Religion ist die Beziehung des Menschen zu etwas Heiligem, das über die sichtbare Welt hinausgeht.', bucket: 'sub', expl: 'Der Bezug auf das Heilige und Transzendente beschreibt den Wesenskern – substanziell.' },

// Personendaten und Eingaben kommen nur so (oder per textContent) ins DOM
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
// Eingaben: Unicode normalisieren, Steuerzeichen entfernen, Leerraum zusammenfassen
function cleanInput(s) {
  return String(s == null ? '' : s).normalize('NFC').replace(/[\u0000-\u001F\u007F-\u009F]/g, '').replace(/\s+/g, ' ').trim();
}
const normKlasse = v => String(v || '').replace(/[\s.]+/g, '');
// Einstellige Tage und Monate ergänzen: „4.5.2010“ → „04.05.2010“
function padBirth(v) {
  const m = /^(\d{1,2})\.(\d{1,2})\.(\d{4})$/.exec(v);
  return m ? m[1].padStart(2, '0') + '.' + m[2].padStart(2, '0') + '.' + m[3] : v;
}
// Lässt sich der Text in der Überblick-PDF (WinAnsi) darstellen? Zeichen ohne Entsprechung würden dort zu „?“.
function pdfPrintable(s) {
  const q = (String(s).match(/\?/g) || []).length;
  return encodeWinAnsi(s).filter(b => b === 0x3F).length === q;
}

  const bytes=[];

    if (stroke) cmd += `${stroke[0]/255} ${stroke[1]/255} ${stroke[2]/255} RG\n`;
    cmd += `${x} ${y} ${w} ${h} re\n`;
    if (fill && stroke) cmd += 'B';
    else if (fill) cmd += 'f';
    else if (stroke) cmd += 'S';

  }

      if (pdfStringWidth(test, fontSize, isBold) <= width) line = test;
      else { if (line) out.push(line); line = word; }

/* ============================================================
   DATENSATZ FÜR DAS FEIDITOR-FEIBEITSBLATT (Schnittstelle v1)
   ============================================================ */
function fbEscapeHash(str) { // cyrb53-Variante wie saveHash, 64 Bit als 16 Hex-Zeichen
  let h1 = 0xdeadbeef ^ str.length, h2 = 0x41c6ce57 ^ str.length;
  for (let i = 0; i < str.length; i++) { const ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (h2 >>> 0).toString(16).padStart(8, '0') + (h1 >>> 0).toString(16).padStart(8, '0');
}
function cleanLine(s, max) { return String(s == null ? '' : s).normalize('NFC').replace(/[\u0000-\u001F\u007F]+/g, ' ').replace(/\s+/g, ' ').trim().slice(0, max); }
function cleanText(s, max) { return String(s == null ? '' : s).normalize('NFC').replace(/\r\n?/g, '\n').replace(/[\u0000-\u0009\u000B-\u001F\u007F]+/g, ' ').slice(0, max); }
// Ein gespeichertes Fehlerobjekt (kind, item, wrongAnswer, correctAnswer, explanation) in Textform – derselbe Wortlaut
// wie die erste Zeile dieses Fehlers in der Überblick-PDF; unbekannte Arten fallen auf item zurück.
function errorToRecord(e) {
  const o = { item: cleanLine(e.kind === 'falsch_einsortiert' ? '„' + e.item + '“' : e.item, 2000) };
  const wrong = cleanLine(e.wrongAnswer, 2000), right = cleanLine(e.correctAnswer, 2000), note = cleanLine(e.explanation, 2000);
  if (wrong) o.wrong = wrong;
  if (right) o.right = right;
  if (note) o.note = note;
  return o;
}
function buildEscapeRecord() {
  const iso = d => { const x = new Date(d); return isNaN(x) ? '' : x.toISOString(); };
  const data = {
    code: FB_CODE,
    room: { id: ESCAPE_ROOM.id, name: ESCAPE_ROOM.name, url: ESCAPE_ROOM.url },
    person: { vorname: cleanLine(state.firstName, 60), nachname: cleanLine(state.lastName, 60),
              geburtsdatum: state.birthDate, klasse: state.klasse },
    confirm: String(state.code),
    word: CODE_WORD,
    completedAt: iso(state.completedAt || new Date()),
    stations: ROOM_LABELS.map((label, i) => ({ label, attempts: state.attempts[i],
      errors: ((state.mistakes[i] && state.mistakes[i].errors) || []).filter(e => e && typeof e === 'object').slice(0, 30).map(errorToRecord) })),
    notes: SOLUTION_NOTES.map(n => ({ label: n.room, text: cleanText(n.text, 4000) })),
    resumes: (state.resumeLog || []).slice(-20).map(r => ({ place: cleanLine(r.place, 2000), savedAt: iso(r.savedAt), loadedAt: iso(r.loadedAt) })),
  };
  const d = JSON.stringify(data);
  return { kind: 'feibeitsblatt-escape', v: 1, d, s: fbEscapeHash('FbEscape|v1|' + d) };
}
function b64url(str) {
  const bytes = new TextEncoder().encode(str); let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

function translit(s) {
  return (s || '').replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue')
    .replace(/Ä/g, 'Ae').replace(/Ö/g, 'Oe').replace(/Ü/g, 'Ue').replace(/ß/g, 'ss')
    .replace(/[^a-zA-Z0-9-]/g, '');
}
function overviewFileName() {
  const d = new Date(), two = n => String(n).padStart(2, '0');
  return `Ueberblick-Escape-Room-${translit(ESCAPE_ROOM.name)}-${two(d.getDate())}-${two(d.getMonth() + 1)}-${d.getFullYear()}.pdf`;
}
window.downloadOverviewPDF = () => {
  try {
    const bin = generateMistakesPdf();
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i) & 0xFF;
    // application/octet-stream statt application/pdf: Der Browser SPEICHERT die Datei, statt sie anzuzeigen.
    const blob = new Blob([bytes], { type: 'application/octet-stream' });
    const url = URL.createObjectURL(blob);
    // Unsichtbarer Link, synchron im Klick-Handler ausgelöst – kein window.open, alles bleibt in diesem Tab.
    const link = document.createElement('a');
    link.href = url; link.download = overviewFileName(); link.style.display = 'none';
    document.body.appendChild(link);
    link.click();
    // Object-URL lange gültig lassen: iOS liest den Blob erst, wenn der Download-Dialog bestätigt ist.
    setTimeout(() => { try { document.body.removeChild(link); } catch (_) {} URL.revokeObjectURL(url); }, 60000);
    state.pdfDownloaded = true;
    return true;
  } catch (e) { console.error(e); return false; }
};

/* ---------- Gestufte Hinweise ----------
   Stufe 0–2: Hinweise, die mit jedem Fehlversuch konkreter werden.
   Stufe 3 (nach drei Fehlversuchen): die komplette Lösung. */
const HINT_MAX_LEVEL = 3;

function hintLevel(idx) {
  return Math.min(state.attempts[idx], HINT_MAX_LEVEL);
}
function hintButtonLabel(idx) {
  const lv = hintLevel(idx);
  if (lv >= HINT_MAX_LEVEL) return 'Lösung anzeigen';
  return lv === 0 ? 'Hinweis anzeigen' : `Hinweis anzeigen · Stufe ${lv + 1}`;
}
function hintTitle(idx) {
  const lv = hintLevel(idx);
  if (lv >= HINT_MAX_LEVEL) return 'Lösung · nach drei Fehlversuchen';
  const fails = state.attempts[idx];
  return `Hinweis · Stufe ${lv + 1} von 4` + (fails === 0 ? '' : ` · nach ${fails} Fehlversuch${fails === 1 ? '' : 'en'}`);
}
function hintBodyHTML(idx) {
  const lv = hintLevel(idx);
  if (lv >= HINT_MAX_LEVEL) return SOLUTIONS[idx]();
  return HINTS[idx][lv];
}
function renderHintBox(idx) {
  const label = document.getElementById('hintLabel');
  const body = document.getElementById('hintBody');
  if (!label || !body) return;
  label.textContent = hintTitle(idx);
  body.innerHTML = hintBodyHTML(idx);
  state.hintMax[idx] = Math.max(state.hintMax[idx], hintLevel(idx));
}
window.showHint = (idx) => {
  const h = document.getElementById('hintBox');
  if (!h) return;
  renderHintBox(idx);
  h.classList.add('show');
  h.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
};
// Nach einem Fehlversuch: Button-Beschriftung und (falls geöffnet) Inhalt der Hinweisbox aktualisieren.
function refreshHint(idx) {
  const btn = document.getElementById('hintBtn');
  if (btn) btn.textContent = hintButtonLabel(idx);
  const h = document.getElementById('hintBox');
  if (h && h.classList.contains('show')) {
    renderHintBox(idx);
    h.classList.remove('pulse'); void h.offsetWidth; h.classList.add('pulse');
  }
}

function showStatus(type, label, msg) {
  const box = document.getElementById('statusBox');
  if (!box) return;
  box.innerHTML = `<div class="status status-${type} show"><span class="label">${label}</span>${msg}</div>`;
  box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function partHead(tag, title, sub) {
  return `<div class="part-head"><span class="part-tag">${tag}</span>${title}</div>` + (sub ? `<p class="part-sub">${sub}</p>` : '');
}

    .replace(/[„"“”‚‘’']/g, '')
    .replace(/[.!?]+$/g, '')
    .replace(',', '.')
    .replace(/\s+/g, ' ')
    .trim();
}
function answerMatches(rawVal, row) {
  const val = normalizeAnswer(rawVal);
  if (!val) return false;
  const accepts = (row.accepts || [row.answer]).map(a => normalizeAnswer(a));
  if (accepts.includes(val) || accepts.map(foldUmlauts).includes(foldUmlauts(val))) return true;
  if (row.type === 'number') {
    const num = parseFloat(val.replace(',', '.'));
    const target = parseFloat(String(row.answer).replace(',', '.'));
    if (!isNaN(num) && !isNaN(target) && Math.abs(num - target) <= (row.tolerance || 0)) return true;
  }
  return false;
}

/* ---------- Zuordnung in Felder (Bucket-Sort) ---------- */
const bucketState = {};   // key -> { assign: {cardId: bucketId}, selected: cardId|null, roomIdx }

function renderBucketSort(key, puzzle, roomIdx, poolLabel) {
  bucketState[key] = { assign: {}, selected: null, roomIdx };
  const cards = shuffle(puzzle.cards).map(c => `
    <button class="sort-card" id="${key}-card-${c.id}" onclick="selectBucketCard(event, '${key}', '${c.id}')">${c.text}</button>
  `).join('');
  const buckets = puzzle.buckets.map(b => `
    <div class="bucket" id="${key}-bucket-${b.id}" onclick="placeBucketCard('${key}', '${b.id}')">
      <div class="bucket-label">${b.label}</div>
      <div class="bucket-desc">${b.desc}</div>
      <div class="bucket-items" id="${key}-items-${b.id}"></div>
    </div>
  `).join('');
  const cls = puzzle.buckets.length === 3 ? 'bucket-area triple' : 'bucket-area';
  return `
    <div class="cards-pool" id="${key}-pool">
      <div class="cards-pool-label">${poolLabel}</div>
      ${cards}
    </div>
    <div class="${cls}">${buckets}</div>
  `;
}

window.selectBucketCard = (event, key, id) => {
  const st = bucketState[key];
  if (!st || roomLocked[st.roomIdx]) return;
  if (st.assign[id]) {
    // Karte liegt bereits in einem Feld
    if (st.selected) return;                     // Klick soll zum Feld durchreichen
    if (event) event.stopPropagation();
    delete st.assign[id];
    const card = document.getElementById(`${key}-card-${id}`);
    card.classList.remove('placed', 'correct', 'incorrect');
    document.getElementById(`${key}-pool`).appendChild(card);
    return;
  }
  if (event) event.stopPropagation();
  document.querySelectorAll(`#${key}-pool .sort-card.selected`).forEach(c => c.classList.remove('selected'));
  document.getElementById(`${key}-card-${id}`).classList.add('selected');
  st.selected = id;
  document.querySelectorAll(`[id^="${key}-bucket-"]`).forEach(b => b.classList.add('target'));
};

window.placeBucketCard = (key, bucketId) => {
  const st = bucketState[key];
  if (!st || roomLocked[st.roomIdx] || !st.selected) return;
  st.assign[st.selected] = bucketId;
  const card = document.getElementById(`${key}-card-${st.selected}`);
  card.classList.remove('selected');
  card.classList.add('placed');
  document.getElementById(`${key}-items-${bucketId}`).appendChild(card);
  st.selected = null;
  document.querySelectorAll(`[id^="${key}-bucket-"]`).forEach(b => b.classList.remove('target'));
};

function evaluateBuckets(key, puzzle, itemPrefix) {
  const st = bucketState[key];
  const placed = Object.keys(st.assign).length;
  if (placed < puzzle.cards.length) return { complete: false, missing: puzzle.cards.length - placed, errors: [], wrongIds: [] };
  const labels = {};
  puzzle.buckets.forEach(b => labels[b.id] = b.label);
  const errors = [], wrongIds = [];
  puzzle.cards.forEach(c => {
    const card = document.getElementById(`${key}-card-${c.id}`);
    card.classList.remove('correct', 'incorrect');
    if (st.assign[c.id] === c.bucket) {
      card.classList.add('correct');
    } else {
      card.classList.add('incorrect');
      wrongIds.push(c.id);
      errors.push({ kind: 'falsch_einsortiert', item: (itemPrefix || '') + c.text, wrongAnswer: labels[st.assign[c.id]] || '(unbekannt)', correctAnswer: labels[c.bucket], explanation: c.expl });
    }
  });
  return { complete: true, errors, wrongIds };
}

function resetWrongCards(key, wrongIds) {
  const st = bucketState[key];
  wrongIds.forEach(id => {
    delete st.assign[id];
    const card = document.getElementById(`${key}-card-${id}`);
    if (!card) return;
    card.classList.remove('placed', 'correct', 'incorrect');
    document.getElementById(`${key}-pool`).appendChild(card);
  });
}

/* ---------- Multiple-Choice (eine richtige Antwort) ---------- */
const mcState = {};   // mcId -> selected option id

function renderMC(mc, roomIdx) {
  mcState[mc.id] = null;
  mc._roomIdx = roomIdx;
  const opts = shuffle(mc.options).map(o => `
    <button class="mc-option" id="${mc.id}-opt-${o.id}" onclick="selectMC('${mc.id}', '${o.id}')"><span class="radio"></span><span>${o.text}</span></button>
  `).join('');
  return `
    <div class="mc-block" id="${mc.id}-block">
      <div class="mc-question">${mc.question}</div>
      <div class="mc-options">${opts}</div>
    </div>
  `;
}

const MC_REGISTRY = {};
function registerMC(mc) { MC_REGISTRY[mc.id] = mc; }

window.selectMC = (mcId, optId) => {
  const mc = MC_REGISTRY[mcId];
  if (!mc || roomLocked[mc._roomIdx]) return;
  mcState[mcId] = optId;
  document.querySelectorAll(`#${mcId}-block .mc-option`).forEach(b => b.classList.remove('selected', 'incorrect'));
  document.getElementById(`${mcId}-opt-${optId}`).classList.add('selected');
};

function evaluateMC(mc) {
  const sel = mcState[mc.id];
  if (!sel) return { answered: false, correct: false, error: null };
  const btn = document.getElementById(`${mc.id}-opt-${sel}`);
  btn.classList.remove('selected');
  if (sel === mc.correct) {
    btn.classList.add('correct');
    return { answered: true, correct: true, error: null };
  }
  btn.classList.add('incorrect');
  const wrongText = mc.options.find(o => o.id === sel).text;
  const rightText = mc.options.find(o => o.id === mc.correct).text;
  return { answered: true, correct: false, error: { kind: 'falsche_wahl', item: mc.question, wrongAnswer: wrongText, correctAnswer: rightText, explanation: mc.explanation } };
}

function resetMC(mc) {
  mcState[mc.id] = null;
  document.querySelectorAll(`#${mc.id}-block .mc-option`).forEach(b => b.classList.remove('selected', 'incorrect'));
}

/* ---------- Lückentext mit freier Eingabe ---------- */
function renderClozeProse(key, puzzle) {
  let html = puzzle.prose;
  puzzle.blanks.forEach(b => {
    html = html.replace('{{' + b.id + '}}',
      `<input type="text" class="cloze-input" id="${key}-${b.id}" placeholder="…" autocomplete="off" spellcheck="false" autocapitalize="off">`);
  });
  return `<div class="card" style="margin-top:4px;"><p class="cloze-prose">${html}</p></div>`;
}

function evaluateClozeProse(key, puzzle, itemPrefix) {
  const errors = [];
  let complete = true, allCorrect = true;
  puzzle.blanks.forEach(b => {
    const inp = document.getElementById(`${key}-${b.id}`);
    inp.classList.remove('correct', 'incorrect');
    if (!normalizeAnswer(inp.value)) { complete = false; return; }
    if (answerMatches(inp.value, b)) {
      inp.classList.add('correct');
    } else {
      inp.classList.add('incorrect');
      allCorrect = false;
      errors.push({ kind: 'falsche_eingabe', item: (itemPrefix || 'Lücke: ') + b.label, wrongAnswer: inp.value, correctAnswer: b.answer });
    }
  });
  return { complete, allCorrect, errors };
}

function lockClozeInputs(key, puzzle) {
  puzzle.blanks.forEach(b => { const el = document.getElementById(`${key}-${b.id}`); if (el) el.disabled = true; });
}

/* ---------- Fragen mit eindeutiger Antwort (Text-/Zahlenfeld) ---------- */
function renderQRows(key, rows) {
  return `<div class="cloze-grid">${rows.map(r => `
    <div class="cloze-row">
      <div class="cloze-text">${r.before}${r.after ? ' ' + r.after : ''}</div>
      <input type="text" class="cloze-input" id="${key}-${r.id}" placeholder="${r.type === 'number' ? 'Zahl' : 'Antwort'}" autocomplete="off" spellcheck="false" ${r.type === 'number' ? 'inputmode="numeric"' : ''}>
    </div>
  `).join('')}</div>`;
}

function evaluateQRows(key, rows) {
  const errors = [];
  let complete = true, allCorrect = true;
  rows.forEach(r => {
    const inp = document.getElementById(`${key}-${r.id}`);
    inp.classList.remove('correct', 'incorrect');
    if (!normalizeAnswer(inp.value)) { complete = false; return; }
    if (answerMatches(inp.value, r)) {
      inp.classList.add('correct');
    } else {
      inp.classList.add('incorrect');
      allCorrect = false;
      errors.push({ kind: 'falsche_eingabe', item: r.before, wrongAnswer: inp.value, correctAnswer: r.answer });
    }
  });
  return { complete, allCorrect, errors };
}

function lockQRows(key, rows) {
  rows.forEach(r => { const el = document.getElementById(`${key}-${r.id}`); if (el) el.disabled = true; });
}

/* ---------- Fall-Zuweisung (Fall -> Funktion per Auswahlfeld) ---------- */
function renderAssign(key, cases, options) {
  const opts = shuffle(options);
  const optHtml = '<option value="">— Funktion wählen —</option>' + opts.map(o => `<option value="${o.id}">${o.label}</option>`).join('');
  return `<div class="assign-list">${shuffle(cases).map(c => `
    <div class="assign-row" id="${key}-row-${c.id}">
      <div class="assign-text">${c.text}</div>
      <select class="assign-select" id="${key}-sel-${c.id}">${optHtml}</select>
    </div>
  `).join('')}</div>`;
}

function evaluateAssign(key, cases, labelMap) {
  const errors = [], wrongIds = [];
  let complete = true;
  cases.forEach(c => {
    const sel = document.getElementById(`${key}-sel-${c.id}`);
    const row = document.getElementById(`${key}-row-${c.id}`);
    row.classList.remove('correct', 'incorrect');
    if (!sel.value) { complete = false; return; }
    if (sel.value === c.answer) {
      row.classList.add('correct');
    } else {
      row.classList.add('incorrect');
      wrongIds.push(c.id);
      errors.push({ kind: 'falsche_zuweisung', item: c.text, wrongAnswer: labelMap[sel.value] || '(unbekannt)', correctAnswer: labelMap[c.answer], explanation: c.expl });
    }
  });
  return { complete, errors, wrongIds };
}

function resetAssign(key, wrongIds) {
  wrongIds.forEach(id => {
    const sel = document.getElementById(`${key}-sel-${id}`);
    const row = document.getElementById(`${key}-row-${id}`);
    if (sel) sel.value = '';
    if (row) row.classList.remove('incorrect');
  });
}
function lockAssign(key, cases) {
  cases.forEach(c => { const el = document.getElementById(`${key}-sel-${c.id}`); if (el) el.disabled = true; });
}

/* ============================================================
   LETTER REVEAL & PROGRESSION
   ============================================================ */

function triggerReveal(roomIdx) {
  state.solved[roomIdx] = true;
  state.letters[roomIdx] = CODE_WORD[roomIdx];

  const overlay = document.getElementById('revealOverlay');
  document.getElementById('revealLetter').textContent = CODE_WORD[roomIdx];
  document.getElementById('revealCaption').textContent = `Buchstabe ${roomIdx + 1} von 6 freigeschaltet`;

  const progBox = document.getElementById('revealProgress');
  progBox.innerHTML = '';
  for (let i = 0; i < 6; i++) {
    const span = document.createElement('span');
    span.className = 'reveal-progress-letter' + (state.solved[i] ? ' lit' : '');
    span.textContent = state.solved[i] ? CODE_WORD[i] : '·';
    progBox.appendChild(span);
  }

  const btn = document.getElementById('revealContinue');
  const isLast = roomIdx === 5;
  btn.textContent = isLast ? 'Tresor öffnen' : 'Nächsten Ordner öffnen';
  btn.onclick = () => {
    overlay.classList.remove('show');
    setTimeout(() => {
      if (isLast) renderFinal();
      else goLibrary(roomIdx + 2);
    }, 300);
  };
  overlay.classList.add('show');
}

/* ============================================================
   ZWISCHENSTAND ALS DATEI SPEICHERN / AUS DATEI LADEN
   Die Datei (.txt) enthält oben einen lesbaren Hinweistext und
   darunter einen codierten Datenblock mit Prüfsumme. Veränderte,
   beschädigte oder fremde Dateien werden beim Laden abgelehnt.
   Jedes Laden wird in state.resumeLog vermerkt und erscheint am
   Ende der Überblick-PDF (für die Lehrkraft).
   ============================================================ */
const SAVE_FORMAT = 2;   // 2: mit Klasse (Dateien der Fassung 1 werden abgelehnt)
const SAVE_SALT   = 'Zwischenstand|Escape-Room|v1';
const SAVE_BEGIN  = '-----BEGIN ZWISCHENSTAND-----';
const SAVE_END    = '-----END ZWISCHENSTAND-----';
const SAVE_ICON   = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>';
const LOAD_ICON   = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>';

function saveHash(str){ // cyrb53-Variante, 64 Bit als 16 Hex-Zeichen
  let h1=0xdeadbeef^str.length, h2=0x41c6ce57^str.length;
  for(let i=0;i<str.length;i++){ const ch=str.charCodeAt(i); h1=Math.imul(h1^ch,2654435761); h2=Math.imul(h2^ch,1597334677); }
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (h2>>>0).toString(16).padStart(8,'0')+(h1>>>0).toString(16).padStart(8,'0');
}
function saveScramble(bytes){ // symmetrisch: dieselbe Funktion codiert und decodiert
  let s=parseInt(saveHash(SAVE_SALT).slice(0,8),16)>>>0;
  const out=new Uint8Array(bytes.length);
  for(let i=0;i<bytes.length;i++){
    s=(s+0x6D2B79F5)>>>0; let t=s;
    t=Math.imul(t^(t>>>15),t|1); t^=t+Math.imul(t^(t>>>7),t|61);
    out[i]=bytes[i]^((t^(t>>>14))&0xFF);
  }
  return out;
}
function saveEncode(data){
  const json=JSON.stringify(data);
  const wrap=JSON.stringify({ f:SAVE_FORMAT, id:SAVE_ROOM_ID, s:saveHash(SAVE_SALT+'|'+SAVE_ROOM_ID+'|'+json), d:json });
  const bytes=saveScramble(new TextEncoder().encode(wrap));
  let bin=''; for(let i=0;i<bytes.length;i+=0x8000) bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));
  return btoa(bin).replace(/.{1,76}/g,'$&\r\n').trim();
}
function saveDecode(text){ // wirft Error mit schülergerechter Meldung
  const newer='Diese Zwischenstand-Datei stammt aus einer neueren Version des Escape-Rooms. Bitte lade die Seite neu und versuche es noch einmal.';
  const m=/-----BEGIN ZWISCHENSTAND(?: V(\d+))?-----/.exec(text);   // künftige Formate tragen ihre Nummer im Marker
  const b=m?text.indexOf(SAVE_END,m.index):-1;
  if(!m||b<0) throw new Error('Das ist keine Zwischenstand-Datei. Bitte wähle die Datei „Zwischenstand zum Escape-Room '+SAVE_GAME_TITLE+' vom … von …“ aus.');
  if(m[1]&&+m[1]>SAVE_FORMAT) throw new Error(newer);
  const broken='Diese Zwischenstand-Datei wurde verändert oder ist beschädigt und kann nicht geladen werden.';
  let wrap;
  try{
    const bin=atob(text.slice(m.index+m[0].length,b).replace(/[^A-Za-z0-9+/=]/g,''));
    const bytes=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    wrap=JSON.parse(new TextDecoder('utf-8',{fatal:true}).decode(saveScramble(bytes)));
  }catch(e){ throw new Error(broken); }
  if(!wrap||typeof wrap.d!=='string'||typeof wrap.id!=='string'||wrap.s!==saveHash(SAVE_SALT+'|'+wrap.id+'|'+wrap.d)) throw new Error(broken);
  let data; try{ data=JSON.parse(wrap.d); }catch(e){ throw new Error(broken); }
  if(wrap.id!==SAVE_ROOM_ID) throw new Error('Diese Zwischenstand-Datei gehört zu einem anderen Escape-Room'+(data&&data.game?' („'+data.game+'“)':'')+'. Bitte öffne den passenden Escape-Room.');
  if(wrap.f<SAVE_FORMAT) throw new Error('Diese Zwischenstand-Datei stammt aus einer älteren Fassung des Escape-Rooms (noch ohne Klasse) und kann nicht mehr geladen werden. Bitte beginne den Escape-Room neu und gib dabei deine Klasse an.');
  if(wrap.f>SAVE_FORMAT) throw new Error(newer);
  if(!data||typeof data!=='object'||!data.state||typeof data.state!=='object'||typeof data.screen!=='string') throw new Error(broken);
  return data;
}

function saveTwo(n){ return String(n).padStart(2,'0'); }
function saveFmtDate(d){ d=new Date(d); return saveTwo(d.getDate())+'.'+saveTwo(d.getMonth()+1)+'.'+d.getFullYear(); }
function saveFmtDateTime(d){ d=new Date(d); if(isNaN(d)) return '–'; return saveFmtDate(d)+' um '+saveTwo(d.getHours())+':'+saveTwo(d.getMinutes())+' Uhr'; }
function saveStudentName(){ return ((state.firstName||'')+' '+(state.lastName||'')).trim(); }
function saveFileName(d){
  const clean=s=>String(s||'').replace(/[\\/:*?"<>|\u0000-\u001F]+/g,' ').replace(/\s+/g,' ').trim();
  return clean('Zwischenstand zum Escape-Room '+SAVE_GAME_TITLE+' vom '+saveFmtDate(d)+' von '+(saveStudentName()||'Unbekannt'))+'.txt';
}

function showSaveToast(msg,isError){

/* ---------- Speichern ---------- */
window.saveProgress=()=>{
  try{
    const now=new Date();
    const target=saveResumeTarget(state.screen);
    const snap=JSON.parse(JSON.stringify(state));
    snap.screen=target;
    const data={ v:SAVE_FORMAT, game:SAVE_GAME_TITLE, savedAt:now.toISOString(), screen:target, place:saveScreenLabel(target), state:snap, extra:saveCollectExtra() };
    const name=saveStudentName()||'Unbekannt';
    const NL='\r\n';
    const text='\uFEFF'
      +'Zwischenstand zum Escape-Room „'+SAVE_GAME_TITLE+'“'+NL
      +'Name: '+name+NL
      +'Gespeichert am '+saveFmtDateTime(now)+' ('+data.place+')'+NL+NL
      +'So geht es weiter: Öffne den Escape-Room und klicke auf der Startseite ganz unten auf'+NL
      +'„Zwischenstand aus Datei laden und weiterspielen“. Lade dann diese Datei hoch.'+NL
      +'Bitte verändere diese Datei nicht – sonst kann sie nicht mehr geladen werden.'+NL+NL
      +SAVE_BEGIN+NL+saveEncode(data)+NL+SAVE_END+NL;
    const filename=saveFileName(now);
    // application/octet-stream: Der Browser speichert die Datei, statt sie nur anzuzeigen.
    const url=URL.createObjectURL(new Blob([text],{type:'application/octet-stream'}));
    const link=document.createElement('a');
    link.href=url; link.download=filename; link.style.display='none';
    document.body.appendChild(link); link.click();
    // Object-URL lange gültig lassen: iOS liest den Blob erst, wenn der Download-Dialog bestätigt ist.
    setTimeout(()=>{ try{ document.body.removeChild(link); }catch(_){} URL.revokeObjectURL(url); },60000);
    showSaveToast('Zwischenstand gespeichert. Du findest die Datei in deinem Download-Ordner.');
  }catch(e){ console.error(e); showSaveToast('Der Zwischenstand konnte nicht gespeichert werden. Bitte versuche es noch einmal.',true); }
};
