<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EU-Klimagipfel · Escape-Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,800;1,9..144,400&family=IBM+Plex+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   EU-KLIMAGIPFEL — Escape Room
   PoWi E2.3 · Sitzung 2 · Selbsterarbeitung
   ============================================================ */

:root {
  --c-bg-deep:      #060c1a;
  --c-bg-mid:       #0a1428;
  --c-bg-card:      #0f1f3a;
  --c-bg-card-hi:   #16294a;
  --c-text:         #f4efe6;
  --c-text-mute:    #a8b3c7;
  --c-text-dim:     #6b7790;
  --c-gold:         #d4af37;
  --c-gold-bright:  #ffd700;
  --c-gold-glow:    #fcbb28;
  --c-teal:         #2fb8a0;
  --c-teal-deep:    #1a6e62;
  --c-blue:         #4f8edb;
  --c-success:      #5fb47a;
  --c-success-bg:   rgba(95, 180, 122, 0.15);
  --c-error:        #e07856;
  --c-error-bg:     rgba(224, 120, 86, 0.15);
  --c-border:       rgba(212, 175, 55, 0.25);
  --c-border-soft:  rgba(244, 239, 230, 0.08);

  --font-display: 'Fraunces', 'Cormorant Garamond', Georgia, serif;
  --font-body:    'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono:    'JetBrains Mono', 'Menlo', 'Courier New', monospace;

  --shadow-soft:   0 4px 24px rgba(0, 0, 0, 0.35);
  --shadow-card:   0 8px 40px rgba(0, 0, 0, 0.55), 0 2px 8px rgba(0, 0, 0, 0.3);
  --shadow-glow:   0 0 40px rgba(212, 175, 55, 0.3);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  background: var(--c-bg-deep);
  color: var(--c-text);
  font-family: var(--font-body);
  font-weight: 400;
  line-height: 1.6;
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* Animated background — subtle aurora effect */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  z-index: -2;
  background:
    radial-gradient(ellipse at 15% 20%, rgba(47, 184, 160, 0.08) 0%, transparent 50%),
    radial-gradient(ellipse at 85% 80%, rgba(212, 175, 55, 0.07) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 100%, rgba(79, 142, 219, 0.05) 0%, transparent 60%),
    linear-gradient(180deg, var(--c-bg-deep) 0%, var(--c-bg-mid) 100%);
  pointer-events: none;
}

body::after {
  content: '';
  position: fixed;
  inset: 0;
  z-index: -1;
  background-image:
    radial-gradient(circle at 1px 1px, rgba(244, 239, 230, 0.03) 1px, transparent 0);
  background-size: 40px 40px;
  pointer-events: none;
}

/* ============================================================
   LAYOUT
   ============================================================ */

.app {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(6, 12, 26, 0.85);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--c-border-soft);
  padding: 14px 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
}

.topbar-brand {
  display: flex;
  align-items: center;
  gap: 12px;
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 15px;
  letter-spacing: 0.02em;
  color: var(--c-gold);
}

.topbar-brand .stars-icon {
  width: 26px;
  height: 26px;
  fill: var(--c-gold);
}

.topbar-progress {
  display: flex;
  gap: 8px;
  align-items: center;
}

.seal {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: 1.5px solid var(--c-border-soft);
  background: transparent;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  color: var(--c-text-dim);
  transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
}

.seal.active {
  border-color: var(--c-gold);
  color: var(--c-gold);
  box-shadow: 0 0 12px rgba(212, 175, 55, 0.4);
}

.seal.solved {
  background: var(--c-gold);
  border-color: var(--c-gold);
  color: var(--c-bg-deep);
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 13px;
  transform: rotate(-3deg);
}

.seal.solved::after {
  content: '';
  position: absolute;
  inset: -3px;
  border-radius: 50%;
  border: 1px solid var(--c-gold);
  opacity: 0.4;
}

.main {
  flex: 1;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 60px 24px 80px;
}

.site-footer {
  text-align: center;
  font-size: 11px;
  color: var(--c-text-dim);
  padding: 18px 12px 24px;
  border-top: 1px solid var(--c-border-soft);
  font-family: var(--font-mono);
  letter-spacing: 0.04em;
}

.screen {
  width: 100%;
  max-width: 900px;
  animation: screenIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
}

@keyframes screenIn {
  from { opacity: 0; transform: translateY(24px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ============================================================
   TYPOGRAPHY
   ============================================================ */

h1, h2, h3 {
  font-family: var(--font-display);
  font-weight: 600;
  line-height: 1.15;
  color: var(--c-text);
  letter-spacing: -0.02em;
}

.kicker {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--c-gold);
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.kicker::before {
  content: '';
  display: inline-block;
  width: 28px;
  height: 1px;
  background: var(--c-gold);
}

.title-mega {
  font-size: clamp(48px, 8vw, 84px);
  font-weight: 800;
  line-height: 0.95;
  margin-bottom: 24px;
  letter-spacing: -0.04em;
}

.title-mega em {
  font-style: italic;
  font-weight: 400;
  color: var(--c-gold);
}

.lede {
  font-family: var(--font-display);
  font-size: clamp(18px, 2vw, 22px);
  font-weight: 400;
  line-height: 1.5;
  color: var(--c-text-mute);
  max-width: 60ch;
  margin-bottom: 32px;
}

.section-title {
  font-size: clamp(32px, 4vw, 48px);
  font-weight: 700;
  margin-bottom: 8px;
}

.section-subtitle {
  font-family: var(--font-body);
  font-size: 14px;
  font-weight: 500;
  color: var(--c-text-mute);
  letter-spacing: 0.05em;
  text-transform: uppercase;
  margin-bottom: 32px;
}

p { margin-bottom: 16px; }
p.body-lg { font-size: 17px; line-height: 1.7; }

/* ============================================================
   COMPONENTS
   ============================================================ */

.card {
  background: linear-gradient(165deg, var(--c-bg-card) 0%, var(--c-bg-card-hi) 100%);
  border: 1px solid var(--c-border-soft);
  border-radius: 4px;
  padding: 36px 40px;
  margin-bottom: 24px;
  box-shadow: var(--shadow-card);
  position: relative;
}

.card-accent {
  position: relative;
}

.card-accent::before {
  content: '';
  position: absolute;
  left: 0;
  top: 24px;
  bottom: 24px;
  width: 3px;
  background: var(--c-gold);
}

.briefing {
  font-family: var(--font-display);
  font-style: italic;
  font-size: 18px;
  line-height: 1.7;
  color: var(--c-text);
  padding-left: 20px;
}

.briefing .speaker {
  display: block;
  font-family: var(--font-mono);
  font-style: normal;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--c-gold);
  margin-bottom: 8px;
}

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 14px 28px;
  border: none;
  border-radius: 2px;
  font-family: var(--font-body);
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  text-decoration: none;
}

.btn-primary {
  background: var(--c-gold);
  color: var(--c-bg-deep);
}

.btn-primary:hover {
  background: var(--c-gold-bright);
  transform: translateY(-1px);
  box-shadow: 0 6px 20px rgba(212, 175, 55, 0.35);
}

.btn-ghost {
  background: transparent;
  color: var(--c-text);
  border: 1px solid var(--c-border);
}

.btn-ghost:hover {
  border-color: var(--c-gold);
  color: var(--c-gold);
}

.btn-arrow::after {
  content: '→';
  font-family: var(--font-mono);
  font-size: 16px;
}

.btn-row {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  margin-top: 24px;
}

/* ============================================================
   PUZZLE COMPONENTS
   ============================================================ */

/* Multi-select cards (Room 1) */
.measure-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  margin: 24px 0;
}

@media (max-width: 600px) {
  .measure-grid { grid-template-columns: 1fr; }
}

.measure-card {
  padding: 18px 20px;
  background: rgba(15, 31, 58, 0.5);
  border: 1.5px solid var(--c-border-soft);
  border-radius: 3px;
  cursor: pointer;
  transition: all 0.2s ease;
  font-size: 14px;
  line-height: 1.5;
  user-select: none;
  position: relative;
  text-align: left;
  display: flex;
  align-items: flex-start;
  gap: 12px;
  color: var(--c-text);
}

.measure-card:hover {
  border-color: var(--c-gold);
  background: rgba(15, 31, 58, 0.8);
  transform: translateY(-1px);
}

.measure-card.selected {
  border-color: var(--c-gold);
  background: rgba(212, 175, 55, 0.1);
  box-shadow: 0 0 0 1px var(--c-gold);
}

.measure-card .checkbox {
  width: 18px;
  height: 18px;
  border: 1.5px solid var(--c-text-dim);
  border-radius: 2px;
  flex-shrink: 0;
  margin-top: 1px;
  position: relative;
  transition: all 0.2s ease;
}

.measure-card.selected .checkbox {
  background: var(--c-gold);
  border-color: var(--c-gold);
}

.measure-card.selected .checkbox::after {
  content: '✓';
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--c-bg-deep);
  font-weight: 800;
  font-size: 14px;
}

.measure-card.feedback-correct {
  border-color: var(--c-success);
  background: var(--c-success-bg);
  box-shadow: 0 0 0 1px var(--c-success);
}

.measure-card.feedback-correct .checkbox {
  background: var(--c-success);
  border-color: var(--c-success);
}

.measure-card.feedback-incorrect {
  border-color: var(--c-error);
  background: var(--c-error-bg);
  box-shadow: 0 0 0 1px var(--c-error);
}

.measure-card.feedback-incorrect .checkbox {
  background: var(--c-error);
  border-color: var(--c-error);
}

.measure-card.feedback-missed {
  border-color: var(--c-gold);
  background: rgba(212, 175, 55, 0.08);
}

.feedback-hint {
  display: none;
  margin-top: 8px;
  padding: 8px 10px;
  background: rgba(0, 0, 0, 0.25);
  border-radius: 2px;
  font-size: 12.5px;
  line-height: 1.5;
  color: var(--c-text-mute);
}

.measure-card.feedback-correct .feedback-hint,
.measure-card.feedback-incorrect .feedback-hint,
.measure-card.feedback-missed .feedback-hint {
  display: block;
}

/* Matching pairs (Room 2) */
.matching-board {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px 32px;
  margin: 24px 0;
  position: relative;
}

@media (max-width: 600px) {
  .matching-board { grid-template-columns: 1fr; gap: 12px; }
}

.match-card {
  padding: 16px 18px;
  background: rgba(15, 31, 58, 0.6);
  border: 1.5px solid var(--c-border-soft);
  border-radius: 3px;
  cursor: pointer;
  transition: all 0.2s ease;
  font-size: 13.5px;
  line-height: 1.5;
  position: relative;
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 64px;
  color: var(--c-text);
}

.match-card .match-marker {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: rgba(212, 175, 55, 0.15);
  border: 1px solid var(--c-border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 700;
  color: var(--c-gold);
  flex-shrink: 0;
}

.match-card:hover {
  border-color: var(--c-gold);
  background: rgba(15, 31, 58, 0.9);
}

.match-card.selected {
  border-color: var(--c-gold-bright);
  background: rgba(212, 175, 55, 0.12);
  box-shadow: 0 0 0 1px var(--c-gold-bright);
}

.match-card.paired {
  border-color: var(--c-teal);
  background: rgba(47, 184, 160, 0.1);
  cursor: default;
}

.match-card.paired .match-marker {
  background: var(--c-teal);
  color: var(--c-bg-deep);
  border-color: var(--c-teal);
}

.match-card.correct-pair {
  border-color: var(--c-success);
  background: var(--c-success-bg);
}

.match-card.correct-pair .match-marker {
  background: var(--c-success);
  border-color: var(--c-success);
  color: var(--c-bg-deep);
}

.match-card.wrong-pair {
  border-color: var(--c-error);
  background: var(--c-error-bg);
}

.match-card.wrong-pair .match-marker {
  background: var(--c-error);
  border-color: var(--c-error);
  color: var(--c-bg-deep);
}

.match-strong { font-family: var(--font-display); font-weight: 600; font-size: 16px; }

/* Sort cards into buckets (Rooms 3, 5, 6) */
.bucket-area {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin-top: 24px;
}

@media (max-width: 600px) {
  .bucket-area { grid-template-columns: 1fr; }
}

.bucket-area.quad {
  grid-template-columns: repeat(2, 1fr);
}

@media (min-width: 900px) {
  .bucket-area.quad { grid-template-columns: repeat(4, 1fr); }
}

.bucket {
  min-height: 160px;
  background: rgba(15, 31, 58, 0.4);
  border: 1.5px dashed var(--c-border-soft);
  border-radius: 3px;
  padding: 16px 14px;
  transition: all 0.2s ease;
}

.bucket.target {
  border-color: var(--c-gold);
  background: rgba(212, 175, 55, 0.08);
  box-shadow: 0 0 0 1px var(--c-gold);
}

.bucket-label {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 14px;
  color: var(--c-gold);
  margin-bottom: 4px;
  letter-spacing: 0.02em;
}

.bucket-desc {
  font-size: 11.5px;
  color: var(--c-text-mute);
  margin-bottom: 14px;
  line-height: 1.4;
  font-style: italic;
}

.bucket-items {
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-height: 60px;
}

.cards-pool {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 16px 14px;
  background: rgba(6, 12, 26, 0.5);
  border: 1px solid var(--c-border-soft);
  border-radius: 3px;
  min-height: 90px;
}

.cards-pool-label {
  width: 100%;
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--c-text-dim);
  margin-bottom: 4px;
}

.sort-card {
  padding: 8px 14px;
  background: rgba(22, 41, 74, 0.9);
  border: 1px solid var(--c-border-soft);
  border-radius: 2px;
  font-size: 13px;
  line-height: 1.3;
  cursor: pointer;
  transition: all 0.2s ease;
  color: var(--c-text);
  user-select: none;
  max-width: 100%;
}

.sort-card:hover {
  border-color: var(--c-gold);
  transform: translateY(-1px);
}

.sort-card.selected {
  border-color: var(--c-gold-bright);
  background: rgba(212, 175, 55, 0.15);
  box-shadow: 0 0 0 1px var(--c-gold-bright);
  transform: translateY(-1px);
}

.sort-card.correct {
  border-color: var(--c-success);
  background: var(--c-success-bg);
}

.sort-card.incorrect {
  border-color: var(--c-error);
  background: var(--c-error-bg);
}

.sort-card.placed {
  width: 100%;
  display: block;
}

/* Lückentext / Fill in numbers (Room 4) */
.cloze-grid {
  display: flex;
  flex-direction: column;
  gap: 14px;
  margin: 24px 0;
}

.cloze-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  background: rgba(15, 31, 58, 0.5);
  border: 1px solid var(--c-border-soft);
  border-radius: 3px;
  flex-wrap: wrap;
}

.cloze-text {
  font-size: 14.5px;
  line-height: 1.5;
  flex: 1;
  min-width: 240px;
  color: var(--c-text);
}

.cloze-text strong { color: var(--c-gold); font-weight: 600; }

.cloze-input {
  font-family: var(--font-mono);
  font-size: 16px;
  font-weight: 700;
  width: 110px;
  padding: 8px 12px;
  background: rgba(6, 12, 26, 0.7);
  border: 1.5px solid var(--c-border);
  border-radius: 2px;
  color: var(--c-gold-bright);
  text-align: center;
  transition: all 0.2s ease;
}

.cloze-input:focus {
  outline: none;
  border-color: var(--c-gold-bright);
  box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15);
}

.cloze-input.correct {
  border-color: var(--c-success);
  background: var(--c-success-bg);
  color: var(--c-success);
}

.cloze-input.incorrect {
  border-color: var(--c-error);
  background: var(--c-error-bg);
  color: var(--c-error);
}

.cloze-unit {
  font-family: var(--font-mono);
  font-size: 13px;
  color: var(--c-text-mute);
  margin-left: -4px;
}

/* Video embed (Bibliotheken 2 & 4) */
.video-wrap {
  position: relative;
  width: 100%;
  padding-top: 56.25%;
  border-radius: 6px;
  overflow: hidden;
  box-shadow: var(--shadow-card);
  background: #000;
  margin: 8px 0;
}
.video-wrap iframe {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
}
.fallback-line {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  align-items: center;
  margin-top: 16px;
  font-size: 14px;
  color: var(--c-text-mute);
}

/* Dropdown cloze (Raum 4, Teil 2) */
.cloze-prose {
  font-size: 15.5px;
  line-height: 2.5;
  color: var(--c-text);
}
.cloze-select {
  font-family: var(--font-body);
  font-size: 14px;
  font-weight: 600;
  color: var(--c-gold-bright);
  background: rgba(6, 12, 26, 0.7);
  border: 1.5px solid var(--c-border);
  border-radius: 3px;
  padding: 4px 8px;
  margin: 0 2px;
}
.cloze-select.correct { border-color: var(--c-success); background: var(--c-success-bg); color: var(--c-success); }
.cloze-select.incorrect { border-color: var(--c-error); background: var(--c-error-bg); color: var(--c-error); }

/* Status messages */
.status {
  padding: 14px 18px;
  border-radius: 2px;
  font-size: 14px;
  line-height: 1.5;
  margin: 20px 0;
  display: none;
  border-left: 3px solid;
}

.status.show { display: block; animation: slideIn 0.3s ease both; }

@keyframes slideIn {
  from { opacity: 0; transform: translateX(-8px); }
  to { opacity: 1; transform: translateX(0); }
}

.status-info {
  background: rgba(79, 142, 219, 0.08);
  border-color: var(--c-blue);
  color: var(--c-text);
}

.status-warning {
  background: var(--c-error-bg);
  border-color: var(--c-error);
  color: var(--c-text);
}

.status-success {
  background: var(--c-success-bg);
  border-color: var(--c-success);
  color: var(--c-text);
}

.status .label {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 700;

/* ============================================================
   LETTER REVEAL ANIMATION
   ============================================================ */

.reveal-overlay {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: radial-gradient(circle at center, rgba(6, 12, 26, 0.97) 0%, rgba(6, 12, 26, 1) 70%);
  display: none;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 0.4s ease;
}

.reveal-overlay.show {
  display: flex;
  opacity: 1;
}

.reveal-inner {
  text-align: center;
  position: relative;
  padding: 0 24px;
}

.reveal-letter {
  font-family: var(--font-display);
  font-size: clamp(180px, 32vw, 360px);
  font-weight: 800;
  color: var(--c-gold-bright);
  line-height: 1;
  text-shadow:
    0 0 60px rgba(255, 215, 0, 0.5),
    0 0 120px rgba(212, 175, 55, 0.3);
  animation: letterReveal 1.4s cubic-bezier(0.16, 1, 0.3, 1) both;
  font-style: italic;
  display: block;
}

@keyframes letterReveal {
  0% { transform: scale(0.4) rotate(-10deg); opacity: 0; filter: blur(20px); }
  60% { transform: scale(1.05) rotate(2deg); opacity: 1; filter: blur(0); }
  100% { transform: scale(1) rotate(0); opacity: 1; filter: blur(0); }
}

.reveal-caption {
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--c-gold);
  margin-top: 24px;
  animation: captionIn 0.6s ease 0.8s both;
}

@keyframes captionIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

.reveal-progress {
  position: absolute;
  bottom: -120px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 14px;
  animation: captionIn 0.6s ease 1.2s both;
}

.reveal-progress-letter {
  font-family: var(--font-display);
  font-size: 28px;
  font-weight: 800;
  color: var(--c-text-dim);
  width: 36px;
  text-align: center;
  letter-spacing: -0.02em;
}

.reveal-progress-letter.lit {
  color: var(--c-gold);
  text-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
}

.reveal-next {
  margin-top: 60px;
  animation: captionIn 0.6s ease 1.5s both;
}

/* ---- Arena: das große Finale gegen den Feiditor (dunkel, dramatisch) ---- */

.arena-cta{ position:absolute; left:50%; bottom:18px; transform:translateX(-50%); background:rgba(214,178,94,.95); color:#1a1305; font-family:var(--font-mono); font-size:11.5px; letter-spacing:.16em; text-transform:uppercase; font-weight:700; padding:9px 16px; border-radius:999px; box-shadow:0 6px 18px rgba(0,0,0,.5); white-space:nowrap; transition:transform .2s ease, background .2s ease; pointer-events:none; }

@media (max-width:600px){ .arena{ padding:26px 16px 22px; } .arena h2{ font-size:24px; } .arena-cta{ font-size:10px; padding:8px 12px; } }

<!doctype html>

<title>Feiditor</title>
<style>
  :root{
    --paper:#f7f4ec; --paper2:#fffdf8; --ink:#221f1a; --muted:#6f675a;

  rect(x,y,w,h,fill,stroke){
    let cmd='';
    if(fill) cmd+=`${fill[0]/255} ${fill[1]/255} ${fill[2]/255} rg\n`;
    if(stroke) cmd+=`${stroke[0]/255} ${stroke[1]/255} ${stroke[2]/255} RG\n`;
    cmd+=`${x} ${y} ${w} ${h} re\n`;
    if(fill&&stroke) cmd+='B'; else if(fill) cmd+='f'; else if(stroke) cmd+='S';
    this.currentContent.push(cmd);
  }
  line(x1,y1,x2,y2,color,width){
    const c=color||[0,0,0];
    this.currentContent.push(`${c[0]/255} ${c[1]/255} ${c[2]/255} RG\n${width||0.5} w\n${x1} ${y1} m ${x2} ${y2} l S`);
  }
  paragraph(str,x,y,width,fontSize,isBold,color,leading){
    if(!leading) leading=fontSize*1.4;
    const words=String(str).split(/\s+/); let line=''; let curY=y;
    for(const word of words){
      if(!word) continue;
      const test=line?line+' '+word:word;
      if(pdfStringWidth(test,fontSize,isBold)<=width){ line=test; }
      else{
        if(line){ this.text(line,x,curY,fontSize,isBold,color); curY-=leading; line=word; }
        else{ this.text(word,x,curY,fontSize,isBold,color); curY-=leading; }
      }
    }
    if(line){ this.text(line,x,curY,fontSize,isBold,color); curY-=leading; }
    return curY;
  }
  build(){
    const objects=[null,null,
      '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>',
      '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>'];
    const pageIds=[];
    for(const page of this.pages){
      objects.push(`<< /Length ${page.content.length} >>\nstream\n${page.content}\nendstream`);
      const contentId=objects.length;
      objects.push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${this.pageW} ${this.pageH}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${contentId} 0 R >>`);
      pageIds.push(objects.length);
    }
    objects[1]=`<< /Type /Pages /Kids [${pageIds.map(i=>i+' 0 R').join(' ')}] /Count ${pageIds.length} >>`;
    objects[0]='<< /Type /Catalog /Pages 2 0 R >>';
    let pdf='%PDF-1.4\n%\xC4\xC5\xC6\xC7\n'; const offsets=[0];
    for(let i=0;i<objects.length;i++){ offsets.push(pdf.length); pdf+=`${i+1} 0 obj\n${objects[i]}\nendobj\n`; }
    const xrefOffset=pdf.length;
    pdf+=`xref\n0 ${objects.length+1}\n0000000000 65535 f \n`;
    for(let i=1;i<=objects.length;i++) pdf+=String(offsets[i]).padStart(10,'0')+' 00000 n \n';
    pdf+=`trailer\n<< /Size ${objects.length+1} /Root 1 0 R >>\nstartxref\n${xrefOffset}\n%%EOF\n`;
    return pdf;
  }
  toBase64(trailerComment){
    let pdf=this.build();
    if(trailerComment) pdf+=trailerComment;   // unsichtbar nach %%EOF (von PDF-Viewern ignoriert)
    return btoa(pdf);
  }
}
function fmtDateTime(d){
  if(!d) d=new Date();
  const date=d.toLocaleDateString('de-DE');
  const time=d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
  return date+', '+time+' Uhr';
}

function buildOverviewPages(ov){
  const doc=new PdfDoc();
  const W=doc.pageW,H=doc.pageH,M=doc.margin; const CW=W-2*M;
  // Farben des Escape-Rooms „EU-Klimagipfel" (dunkelblau/gold)

    return H-80-24;
  }
  function ensure(y,need){ if(y-need<60){ doc.endPage(); return header('Überblick deiner Antworten & Erläuterungen'); } return y; }

  let y=header('Überblick deiner Antworten & Erläuterungen');

  // Pflichthinweis (fett, ganz oben) – KEIN Notfall-Tipp, da diese PDF kein %ESCAPEDATA trägt

  doc.rect(M,y-46,3,46,ACCENT);

    M+12,y-17,CW-24,10.5,true,PRIMARY,13.5);
  y-=46+14;

    doc.text(roomLabels[i],M,y,13,true,PRIMARY);
    doc.line(M,y-4,M+CW,y-4,ACCENT,0.8);
    y-=18;
    const att=attempts[i]; const m=mistakes[i];
    const attemptsLabel=att===1?'1 Versuch':att+' Versuche';

    }
    y=doc.paragraph('Insgesamt benötigt: '+attemptsLabel+'. Beim ersten Versuch waren folgende Punkte falsch:',M,y,CW,10.5,false,MUTE,14); y-=6;

        if(err.explanation) y=doc.paragraph('→ '+err.explanation,M+14,y,CW-14,10,false,MUTE,13);
      }
      y-=5;
    }
    y-=10;
  }

  y=ensure(y,50);
  doc.line(M,y,M+CW,y,[200,200,200],0.4); y-=14;
  doc.text('Bestätigungscode für Moodle: '+String(ov.code||''),M,y,10,true,PRIMARY);
  y-=22;
  doc.text('Copyright Jan-Rickmer Feindt',M,y,8.5,false,MUTE);
  doc.endPage();

  /* ---- Lösungserläuterungen ---- */
  if(notes.length){
    function ensure2(yy,need){ if(yy-need<60){ doc.endPage(); return header('Lösungserläuterungen'); } return yy; }
    let y2=header('Lösungserläuterungen');
    y2=doc.paragraph('Hier werden die richtigen Lösungen der sechs Rätselräume noch einmal genauer erklärt. '+
      'Nutze diese Seite, um den Stoff der Sitzung zu vertiefen und nachzuarbeiten.',M,y2,CW,10.5,false,TEXT,14);
    y2-=10;
    for(const note of notes){
      y2=ensure2(y2,96);
      doc.text(note.room,M,y2,12.5,true,PRIMARY);
      doc.line(M,y2-4,M+CW,y2-4,ACCENT,0.8);
      y2-=18;
      y2=doc.paragraph(note.text,M,y2,CW,10.5,false,TEXT,14.5);
      y2-=14;
    }

    doc.line(M,y2,M+CW,y2,[200,200,200],0.4); y2-=14;
    doc.text('Copyright Jan-Rickmer Feindt',M,y2,8.5,false,MUTE);
    doc.endPage();
  }
  return doc.pages.map(p=>p.content);
}

function buildPdf(opts){
  const PW=595.28,PH=841.89, ML=56,MR=56,MT=56,MB=64;
  const HEAD_SIZE=13, BODY_SIZE=11, HEAD2_SIZE=22, NOTE_SIZE=11;
  const BODY_LEAD=15.5, HEAD_LEAD=28;
  const usableW=PW-ML-MR;
  const headerBaseline=PH-MT-HEAD_SIZE, ruleY=headerBaseline-6, bodyTop=ruleY-22, bodyBottom=MB+24;

  const text=opts.text||""; const fmt=opts.fmt||[];
  // in Absätze an '\n' teilen
  const paras=[]; { let cur=[]; for(let i=0;i<text.length;i++){ const ch=text[i]; if(ch==="\n"){paras.push(cur);cur=[];} else { const ft=fmt[i]||{}; cur.push({ch,b:!!ft.b,i:!!ft.i,u:!!ft.u,h:!!ft.h}); } } paras.push(cur); }

  // Anzeigezeilen mit Größe/Durchschuss
  const dispLines=[];
  for(const para of paras){
    const heading=para.length?para[0].h:false;
    const size=heading?HEAD2_SIZE:BODY_SIZE;
    const lead=heading?HEAD_LEAD:BODY_LEAD;
    if(para.length===0){ dispLines.push({runs:[],size:BODY_SIZE,lead:BODY_LEAD}); continue; }
    const wrapped=wrapPara(para,size,usableW);
    for(const wl of wrapped) dispLines.push({runs:lineToRuns(wl),size,lead});
  }
  if(dispLines.length===0) dispLines.push({runs:[],size:BODY_SIZE,lead:BODY_LEAD});

  // Seiten füllen
  const pages=[]; let idx=0;
  while(idx<dispLines.length){
    const pageLines=[]; let y=bodyTop;
    while(idx<dispLines.length && y>=bodyBottom){ const dl=dispLines[idx]; pageLines.push({dl,y}); y-=dl.lead; idx++; }
    if(pageLines.length===0){ pageLines.push({dl:dispLines[idx],y:bodyTop}); idx++; }
    pages.push({lines:pageLines});
  }
  const nPages=pages.length;
  // Übersichts-Seiten (aus dem Escape-Room) werden hinter die Aufgaben-Seiten gehängt
  const ovStreams=(opts.overview&&typeof buildOverviewPages==="function")?buildOverviewPages(opts.overview):[];
  const nAll=nPages+ovStreams.length;

  const noteText="Bitte diese PDF-Datei herunterladen und bei Moodle hochladen.";
  const noteLines=[]; { // Hinweis ist immer normal/unformatiert
    const arr=noteText.split("").map(ch=>({ch,b:false,i:false,u:false}));
    for(const wl of wrapPara(arr,NOTE_SIZE,usableW)) noteLines.push(lineToRuns(wl));
  }
  const noteBottom=46;

  const pageObjNum=(i)=>7+i*2, contObjNum=(i)=>8+i*2;
  const objects={};
  objects[1]="<< /Type /Catalog /Pages 2 0 R >>";
  objects[2]=`<< /Type /Pages /Count ${nAll} /Kids [${Array.from({length:nAll},(_,i)=>`${pageObjNum(i)} 0 R`).join(" ")}] >>`;
  objects[3]="<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>";
  objects[4]="<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>";
  objects[5]="<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Oblique /Encoding /WinAnsiEncoding >>";
  objects[6]="<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-BoldOblique /Encoding /WinAnsiEncoding >>";

  for(let i=0;i<nPages;i++){
    objects[pageObjNum(i)]=`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW.toFixed(2)} ${PH.toFixed(2)}] /Resources << /Font << /F1 3 0 R /F2 4 0 R /F3 5 0 R /F4 6 0 R >> >> /Contents ${contObjNum(i)} 0 R >>`;
    let s="0.5 w\n";
    // Name + Linie
    s+=`BT /F1 ${HEAD_SIZE} Tf 0 0 0 rg ${ML} ${headerBaseline.toFixed(2)} Td (${encStr(opts.name||"")}) Tj ET\n`;
    s+=`${ML} ${ruleY.toFixed(2)} m ${(PW-MR).toFixed(2)} ${ruleY.toFixed(2)} l S\n`;
    // Textzeilen
    const underlines=[];
    for(const pl of pages[i].lines){
      const dl=pl.dl, y=pl.y;
      if(dl.runs.length){
        s+=`BT 1 0 0 1 ${ML.toFixed(2)} ${y.toFixed(2)} Tm 0 0 0 rg\n`;
        let x=ML;
        for(const run of dl.runs){
          const fn=fontFor(run.b,run.i);
          s+=`/${fn} ${dl.size} Tf (${encStr(run.text)}) Tj\n`;
          const rw=runWidth(run.text,run.b,dl.size);
          if(run.u){ underlines.push({x1:x,x2:x+rw,y:y-dl.size*0.12,lw:Math.max(0.5,dl.size*0.06)}); }
          x+=rw;
        }
        s+="ET\n";
      }
    }
    for(const ul of underlines){
      s+=`${ul.lw.toFixed(2)} w 0 0 0 RG ${ul.x1.toFixed(2)} ${ul.y.toFixed(2)} m ${ul.x2.toFixed(2)} ${ul.y.toFixed(2)} l S\n`;
    }
    // roter Hinweis nur auf der letzten Seite
    if(i===nPages-1){
      let yy=noteBottom+(noteLines.length-1)*BODY_LEAD;
      for(const runs of noteLines){
        s+=`BT 1 0 0 1 ${ML.toFixed(2)} ${yy.toFixed(2)} Tm 0.78 0.05 0.05 rg\n`;
        for(const run of runs){ s+=`/F1 ${NOTE_SIZE} Tf (${encStr(run.text)}) Tj\n`; }
        s+="ET\n";
        yy-=BODY_LEAD;
      }
    }
    objects[contObjNum(i)]={stream:s};
  }

  // Übersichts-Seiten anhängen (Content-Streams nutzen /F1 und /F2, die oben definiert sind)
  for(let k=0;k<ovStreams.length;k++){
    const i=nPages+k;
    objects[pageObjNum(i)]=`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW.toFixed(2)} ${PH.toFixed(2)}] /Resources << /Font << /F1 3 0 R /F2 4 0 R /F3 5 0 R /F4 6 0 R >> >> /Contents ${contObjNum(i)} 0 R >>`;
    objects[contObjNum(i)]={stream:ovStreams[k]+"\n"};
  }

  let pdf="%PDF-1.7\n%\u00E2\u00E3\u00CF\u00D3\n";
  if(opts.trackB64) pdf+=`%TRACKDATA ${opts.trackB64}\n`;
  const offsets={}; const maxNum=6+nAll*2;
  for(let n=1;n<=maxNum;n++){
    offsets[n]=pdf.length; const o=objects[n];
    if(o&&o.stream!==undefined){const st=o.stream;pdf+=`${n} 0 obj\n<< /Length ${st.length} >>\nstream\n${st}endstream\nendobj\n`;}
    else pdf+=`${n} 0 obj\n${o}\nendobj\n`;
  }
  const xrefStart=pdf.length;
  pdf+=`xref\n0 ${maxNum+1}\n0000000000 65535 f \n`;
  for(let n=1;n<=maxNum;n++) pdf+=String(offsets[n]).padStart(10,"0")+" 00000 n \n";
  pdf+=`trailer\n<< /Size ${maxNum+1} /Root 1 0 R >>\nstartxref\n${xrefStart}\n%%EOF`;
  return pdf;
}

/* ---------------- gemeinsame Krypto- & Auswertungs-Funktionen ---------------- *
 * Diese werden per toString() in die Lehrkraft-Seite (data:-Link) eingebettet,  *
 * damit es nur EINE Quelle der Wahrheit gibt.                                   */
function bytesToB64(bytes){let bin="";const CH=0x8000;for(let i=0;i<bytes.length;i+=CH)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+CH));return btoa(bin);}
function b64ToBytes(b64){const bin=atob(b64);const out=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)out[i]=bin.charCodeAt(i);return out;}
async function _key(codeStr,usage){const mat=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(codeStr));return crypto.subtle.importKey("raw",mat,{name:"AES-GCM"},false,usage);}
async function aesEncrypt(plain,codeStr){const iv=crypto.getRandomValues(new Uint8Array(12));const key=await _key(codeStr,["encrypt"]);const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},key,new TextEncoder().encode(plain));return bytesToB64(iv)+":"+bytesToB64(new Uint8Array(ct));}
async function aesDecrypt(bundle,codeStr){const parts=bundle.split(":");const iv=b64ToBytes(parts[0]);const ct=b64ToBytes(parts[1]);const key=await _key(codeStr,["decrypt"]);const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv},key,ct);return new TextDecoder().decode(pt);}
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));}
function classify(isVisible,src,gap){
  const COL={plain:"#23201b",paste:"#b3261e",fast:"#c2710c",slow:"#1f7a34",system:"#23201b"};
  if(src==="s") return COL.system;           // System-Text (vorbefüllte Aufgaben) -> schwarz wie normaler Text, nie farbig
  if(!isVisible) return COL.plain;
  if(src==="p") return COL.paste;            // aus Zwischenablage -> rot
  if(gap>=0&&gap<=15) return COL.paste;      // <= 0,015 s getippt -> rot
  if(gap>15&&gap<=70) return COL.fast;       // 0,015-0,07 s -> orange
  return COL.slow;                           // > 0,07 s / erstes Zeichen -> grün
}
const RED_LIMIT=50; // Rot-Anteil strikt ÜBER diesem Wert wird rot und fett hervorgehoben
/* Zählt sichtbare, nicht vorbefüllte Zeichen nach Farbe – EINE Formel für Einzelansicht, Export und Tabelle */
function computeStats(t,m){
  const WS=/\s/; let total=0,red=0,orange=0,green=0;
  for(let i=0;i<t.length;i++){
    const ch=t[i]; const isV=!WS.test(ch);
    const mark=m[i]||["t",-1]; const col=classify(isV,mark[0],mark[1]);
    if(isV && mark[0]!=="s"){ total++;
      if(col==="#b3261e") red++;
      else if(col==="#c2710c") orange++;
      else green++;
    }
  }
  const pct=(x)=>total?Math.round(x/total*100):0;
  return {total,red,orange,green,redPct:pct(red),orangePct:pct(orange),greenPct:pct(green)};
}
function renderAnalysis(payload){
  const t=payload.t, m=payload.m||[], f=payload.f||[];
  let html="";
  const WS=/\s/;
  for(let i=0;i<t.length;i++){
    const ch=t[i]; const isV=!WS.test(ch);
    const mark=m[i]||["t",-1]; const src=mark[0]; const gap=mark[1];
    const col=classify(isV,src,gap);
    const fl=f[i]||0; let st="color:"+col;
    if(fl&8){ st+=";font-weight:700;font-size:1.6em"; } else if(fl&1){ st+=";font-weight:700"; }
    if(fl&2) st+=";font-style:italic";
    if(fl&4) st+=";text-decoration:underline";
    html+=`<span style="${st}">${esc(ch)}</span>`;
  }
  const s=computeStats(t,m);
  // gespeicherter Rot-Anteil aus der PDF; ältere PDFs ohne Wert: aus den Tracking-Daten berechnet
  const rp=(typeof payload.r==="number"&&isFinite(payload.r))?payload.r:s.redPct;
  const badge=`<div class="redbadge${rp>RED_LIMIT?" high":""}">Rot-Anteil: ${rp} %</div>`;
  const legend=
    '<div class="legend">'+
      '<span><i class="sw" style="background:#b3261e"></i>eingefügt oder ≤ 0,015 s getippt</span>'+
      '<span><i class="sw" style="background:#c2710c"></i>0,015–0,07 s nach vorherigem Zeichen getippt</span>'+
      '<span><i class="sw" style="background:#1f7a34"></i>&gt; 0,07 s nach vorherigem Zeichen getippt</span>'+
    '</div>';
  const stat=`<p class="stat">Zeichen gesamt: ${s.total} · rot: ${s.red} (${s.redPct} %) · orange: ${s.orange} (${s.orangePct} %) · grün: ${s.green} (${s.greenPct} %)</p>`;
  const head=`<div class="nmeta">Verfasser:in — ${esc(payload.n||"")}</div>`;
  return head+badge+legend+stat+`<div class="analysis">${html}</div>`;
}

/* ----------------------- geheime Code-Bildung (Lehrkraft) ----------------------- */
function _kfN(n){return String(n*(0x230+0x220));}          // Code aus Buchstabenzahl
function _kf(s){const n=(s.match(/\p{L}/gu)||[]).length;return _kfN(n);}

/* ------------------------------ Tracking ------------------------------ */
let prevValue="";
let recs=[];          // pro Zeichen: {src:'t'|'p', t:ms}
let justPasted=false; // wird durch paste/drop gesetzt, nach einem input-Event geleert

function reconcile(newVal,pasted,now){
  const a=prevValue,b=newVal; const minL=Math.min(a.length,b.length);
  let p=0; while(p<minL&&a[p]===b[p])p++;
  let s=0; while(s<minL-p&&a[a.length-1-s]===b[b.length-1-s])s++;
  const removed=a.length-p-s;
  const inserted=b.slice(p,b.length-s);
  const ins=inserted.split("").map(()=>({src:pasted?"p":"t",t:now}));
  recs.splice(p,removed,...ins);
  if(recs.length!==b.length){ // Sicherheitsnetz gegen Desync: Tipp-Info unbekannt (t=-1), nie fälschlich rot
    recs=b.split("").map(()=>({src:"t",t:-1}));
  }
  prevValue=newVal;
}

let systemSnippets=[]; // vorgeschriebene Textbausteine (Aufgabenlabels + Aufgabentexte) – immer System-Text
function markSystemByContent(text,m){
  // Markiert jedes Vorkommen eines vorgeschriebenen Bausteins als System ("s"), unabhängig vom
  // Tracking-Zustand. So werden Aufgabenstellungen nie farbig (rot/orange/grün) ausgewertet.
  for(const snip of systemSnippets){
    if(!snip) continue;
    let from=0, idx;
    while((idx=text.indexOf(snip,from))!==-1){
      for(let i=idx;i<idx+snip.length;i++){ if(m[i]) m[i][0]="s"; }
      from=idx+snip.length;
    }
  }
}
function buildPayload(name,text,fmt,vn,nn){
  if(recs.length!==text.length){ // letzte Absicherung: Tipp-Info verloren -> Abstand unbekannt (nie fälschlich rot)
    recs=text.split("").map(()=>({src:"t",t:-1}));
  }
  fmt=fmt||[];
  const m=[]; const f=[];
  for(let i=0;i<text.length;i++){
    const gap=(i===0||recs[i].t<0||recs[i-1].t<0)?-1:(recs[i].t-recs[i-1].t);
    m.push([recs[i].src,gap]);
    const ft=fmt[i]||{};
    let bits=0; if(ft.b)bits|=1; if(ft.i)bits|=2; if(ft.u)bits|=4; if(ft.h)bits|=8;
    f.push(bits);
  }
  markSystemByContent(text,m);   // vorgeschriebene Aufgaben: immer System, nie farbig
  const r=computeStats(text,m).redPct; // Rot-Anteil in Prozent, wie ihn die Lehrkraft-Ansicht zeigt
  return {n:name,t:text,m,f,vn:vn||"",nn:nn||"",r};
}

function sanitize(s){return (s||"").replace(/[^\p{L}\p{N}_-]/gu,"_").slice(0,40)||"Datei";}
function asciiName(s){
  return (s||"")
    .replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue")
    .replace(/Ä/g,"Ae").replace(/Ö/g,"Oe").replace(/Ü/g,"Ue").replace(/ß/g,"ss")
    .normalize("NFKD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^A-Za-z0-9_-]/g,"_").replace(/_+/g,"_").replace(/^_|_$/g,"")
    .slice(0,40) || "Datei";
}
function fileSafe(s){return (s||"").replace(/[\/\\:*?"<>|\u0000-\u001f]/g,"").replace(/\s+/g," ").trim().slice(0,90)||"Datei";}
function downloadBlob(blob,filename){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),5000);
}

/* ---------- Escape-Room-Modus: aus hochgeladener Überblick-PDF rekonstruieren ---------- */
function buildPrefill(tasks){
  const lines=[];
  tasks.forEach((task,i)=>{
    lines.push("Aufgabe "+(i+1));
    lines.push(task);
    for(let k=0;k<8;k++) lines.push("");   // 8 Leerzeilen Lösungsraum
  });
  return lines.join("\n");
}
function startEscapeMode(v,n,tasks,red){
  studentVorname=(v||"").trim(); studentNachname=(n||"").trim();
  $("who-name").textContent=(studentVorname+" "+studentNachname).trim();
  escapeRed=Array.isArray(red)?red:[];
  // Vorgeschriebene Bausteine merken: Aufgabenlabels + Aufgabentexte -> beim Export immer System-Text
  systemSnippets=[];
  if(Array.isArray(tasks)) tasks.forEach((task,i)=>{ systemSnippets.push("Aufgabe "+(i+1)); if(task) systemSnippets.push(String(task)); });
  const prefill=(Array.isArray(tasks)&&tasks.length)?buildPrefill(tasks):"";
  const now=Date.now();
  setEditorText(prefill); prevValue=prefill;
  recs=prefill.split("").map(()=>({src:"s",t:now}));   // vorbefüllter Text = System (grau, nicht gezählt)
  renderMoodleHints();
  updateCharcount();
  show("screen-editor");
  setTimeout(()=>{
    ed.focus();
    // Cursor in die erste leere Lösungszeile setzen
    const pf=prefill.split("\n");
    let bi=pf.indexOf(""); if(bi<0) bi=pf.length-1;
    const blocks=Array.prototype.filter.call(ed.childNodes,n=>n.nodeType===1);
    placeCaretAtBlockStart(blocks[bi]||blocks[blocks.length-1]);
  },50);
}
function readEscapePdf(file){
  $("esc-err").textContent="";
  const fr=new FileReader();
  fr.onload=()=>{
    const bytes=new Uint8Array(fr.result);
    let str=""; for(let i=0;i<bytes.length;i++) str+=String.fromCharCode(bytes[i]);
    const mm=str.match(/%ESCAPEDATA (\S+)/);
    if(!mm){$("esc-err").textContent="In dieser PDF wurden keine Escape-Room-Daten gefunden. Bitte lade die Überblick-PDF aus dem Escape-Room hoch.";return;}
    let d;
    try{ d=JSON.parse(decodeURIComponent(escape(atob(mm[1])))); }
    catch(e){ $("esc-err").textContent="Die Escape-Room-Daten konnten nicht gelesen werden."; return; }
    startEscapeMode(d.v,d.n,d.t,d.r);
  };
  fr.onerror=()=>{$("esc-err").textContent="Datei konnte nicht gelesen werden.";};
  fr.readAsArrayBuffer(file);
}

/* ---------- Rich-Text-Editor: Serialisierung & Formatierung ---------- */
/* Read-only: liest den contenteditable-Inhalt als {text, fmt} aus, OHNE das DOM
   oder den Cursor zu verändern. Inline-Formatierung ändert den Text nicht, nur fmt –
   dadurch bleiben die Tipp-Tempo-Daten (recs) über Formatierungen hinweg erhalten. */
function serializeEditor(){
  const root=$("editor");
  const chars=[]; const fmt=[];
  function isBlock(node){ return node.nodeType===1 && /^(DIV|P|H[1-6]|LI|BLOCKQUOTE|PRE)$/.test(node.tagName); }
  function lastIsNL(){ return chars.length===0 || chars[chars.length-1]==="\n"; }
  function pushCh(ch,st){ chars.push(ch); fmt.push({b:st.b,i:st.i,u:st.u,h:st.h}); }
  function lastChildOfBlock(node){
    const p=node.parentNode; return p && isBlock(p) && p.childNodes[p.childNodes.length-1]===node;
  }
  function walk(node, st){
    const kids=node.childNodes||[];
    for(let k=0;k<kids.length;k++){
      const child=kids[k];
      if(child.nodeType===3){
        const s=child.nodeValue||"";
        for(const ch of s) pushCh(ch, st);
      } else if(child.nodeType===1){
        const tag=child.tagName;
        if(tag==="BR"){
          if(lastChildOfBlock(child)){ /* Platzhalter-<br> -> kein Umbruch */ }
          else pushCh("\n", st);
          continue;
        }
        const ns={b:st.b,i:st.i,u:st.u,h:st.h};
        if(tag==="B"||tag==="STRONG") ns.b=true;
        if(tag==="I"||tag==="EM") ns.i=true;
        if(tag==="U"||tag==="INS") ns.u=true;
        const sty=child.style||{};
        const fw=sty.fontWeight; if(fw==="bold"||fw==="bolder"||(fw&&parseInt(fw,10)>=600)) ns.b=true;
        const fst=sty.fontStyle; if(fst&&String(fst).indexOf("italic")>=0) ns.i=true;
        const td=(sty.textDecorationLine||sty.textDecoration||""); if(String(td).indexOf("underline")>=0) ns.u=true;
        if(child.classList&&child.classList.contains("heading")){ ns.h=true; ns.b=true; }
        if(/^H[1-6]$/.test(tag)){ ns.h=true; ns.b=true; }
        try{ const cs=getComputedStyle(child); if(cs){ const w=cs.fontWeight; if(w==="bold"||w==="bolder"||(parseInt(w,10)>=600)) ns.b=true; if(String(cs.fontStyle||"").indexOf("italic")>=0) ns.i=true; } }catch(e){}
        if(isBlock(child) && !lastIsNL()) pushCh("\n", st);
        walk(child, ns);
      }
    }
  }
  walk(root, {b:false,i:false,u:false,h:false});
  return { text: chars.join(""), fmt };
}

/* Baut den Editor-Inhalt aus reinem Text neu auf (jede Zeile = ein Block-DIV). */
function setEditorText(plain){
  const root=$("editor"); root.innerHTML="";
  const lines=String(plain||"").split("\n");
  for(const line of lines){
    const div=document.createElement("div");
    if(line==="") div.appendChild(document.createElement("br"));
    else div.appendChild(document.createTextNode(line));
    root.appendChild(div);
  }
  if(root.childNodes.length===0){ const d=document.createElement("div"); d.appendChild(document.createElement("br")); root.appendChild(d); }
  updateEmpty();
}

/* Platzhalter ein-/ausblenden (CSS: #editor.empty::before) */
function updateEmpty(){
  const root=$("editor");
  root.classList.toggle("empty", serializeEditor().text.length===0);
}

/* Den Block (oberste DIV-Ebene im Editor), in dem ein Knoten liegt. */
function blockOf(node){
  const root=$("editor"); if(!node) return null;
  if(node===root){ return null; }
  let n=node;
  while(n && n.parentNode!==root) n=n.parentNode;
  return (n && n.parentNode===root && n.nodeType===1) ? n : null;
}
/* Alle Blöcke, die von der aktuellen Auswahl berührt werden. */
function selectedBlocks(){
  const root=$("editor"); const sel=window.getSelection();
  if(!sel||sel.rangeCount===0) return [];
  const r=sel.getRangeAt(0);
  let a=blockOf(r.startContainer), b=blockOf(r.endContainer);
  const blocks=Array.prototype.filter.call(root.childNodes,n=>n.nodeType===1);
  if(!a) a=blocks[0]; if(!b) b=blocks[blocks.length-1];
  if(!a||!b) return [];
  const ia=blocks.indexOf(a), ib=blocks.indexOf(b);
  if(ia<0||ib<0) return [];
  const lo=Math.min(ia,ib), hi=Math.max(ia,ib);
  return blocks.slice(lo,hi+1);
}
/* Überschrift für die ausgewählten Blöcke umschalten. */
function toggleHeading(){
  const blocks=selectedBlocks(); if(!blocks.length) return;
  const allHead=blocks.every(b=>b.classList.contains("heading"));
  blocks.forEach(b=>{ if(allHead) b.classList.remove("heading"); else b.classList.add("heading"); });
  $("editor").focus();
  updateFormatButtons();
}
/* Button-Zustände an die aktuelle Auswahl/Cursorposition anpassen. */
function updateFormatButtons(){
  const q=(c)=>{ try{ return document.queryCommandState(c); }catch(e){ return false; } };
  $("fb-bold").classList.toggle("active", q("bold"));
  $("fb-italic").classList.toggle("active", q("italic"));
  $("fb-underline").classList.toggle("active", q("underline"));
  const blocks=selectedBlocks();
  const head = blocks.length>0 && blocks.every(b=>b.classList.contains("heading"));
  $("fb-heading").classList.toggle("active", head);
}
/* Inline-Befehl (bold/italic/underline) ausführen; Auswahl bleibt erhalten. */
function execInline(cmd){
  $("editor").focus();
  try{ document.execCommand(cmd,false,null); }catch(e){}
  updateFormatButtons();
  updateEmpty();
}
/* Cursor an den Anfang eines Blocks setzen. */
function placeCaretAtBlockStart(block){
  if(!block) return;
  const sel=window.getSelection(); const r=document.createRange();
  r.setStart(block,0); r.collapse(true);
  sel.removeAllRanges(); sel.addRange(r);
}

/* Editor-Tracking */
const ed=$("editor");
ed.addEventListener("paste",(e)=>{
  // Nur reinen Text einfügen, damit das DOM sauber bleibt (keine fremde Formatierung)
  if(e.clipboardData){
    e.preventDefault();
    const txt=e.clipboardData.getData("text/plain");
    justPasted=true;
    try{ document.execCommand("insertText",false,txt); }
    catch(err){ justPasted=true; }
  } else { justPasted=true; }
});
ed.addEventListener("drop",()=>{justPasted=true;});
ed.addEventListener("keydown",(e)=>{
  // Strg/Cmd+B/I/U: Browser formatiert selbst; danach Button-Status aktualisieren
  if((e.ctrlKey||e.metaKey)&&!e.altKey){
    const k=e.key.toLowerCase();
    if(k==="b"||k==="i"||k==="u"){ setTimeout(()=>{ updateFormatButtons(); updateEmpty(); },0); }
  }
  // Enter in einer Überschrift: neue Zeile soll normal sein
  if(e.key==="Enter"){
    setTimeout(()=>{
      const blocks=selectedBlocks();
      blocks.forEach(b=>{ const txt=(b.textContent||"").replace(/\u200B/g,""); if(b.classList.contains("heading")&&txt==="") b.classList.remove("heading"); });
      updateFormatButtons();
    },0);
  }
});

  updateCharcount();

});
ed.addEventListener("keyup",updateFormatButtons);
ed.addEventListener("mouseup",updateFormatButtons);

/* Export: erzeugt NUR die Text-PDF (mit rotem Moodle-Hinweis); die Tracking-Daten stecken
   verschlüsselt als %TRACKDATA in der PDF und sind über „Lehrkraft → PDF laden + Code" auslesbar */
$("export-btn").addEventListener("click",async()=>{
  const btn=$("export-btn"); const ser=serializeEditor(); const text=ser.text; const fmt=ser.fmt;
  const name=studentVorname+" "+studentNachname;
  btn.disabled=true; const old=btn.textContent; btn.textContent="Erzeuge PDF…";
  try{
    const payload=buildPayload(name,text,fmt,studentVorname,studentNachname);
    const code=_kf(studentVorname);
    const bundle=await aesEncrypt(JSON.stringify(payload),code);

    const pdfName=fileSafe("Escape Room Daten von "+studentVorname+" "+studentNachname)+".pdf";

    // PDF: Aufgaben-Seiten (formatierter Text + roter Moodle-Hinweis) + Übersichts-Seiten aus dem Escape-Room;
    // Tracking-Daten stecken (verschlüsselt) als %TRACKDATA drin
    const overview=(window.__ESCAPE_DATA__&&window.__ESCAPE_DATA__.overview)||null;
    const pdfStr=buildPdf({name,text,fmt,trackB64:bundle,overview});
    const u8=new Uint8Array(pdfStr.length);
    for(let i=0;i<pdfStr.length;i++)u8[i]=pdfStr.charCodeAt(i)&0xFF;

    downloadBlob(new Blob([u8],{type:"application/octet-stream"}), pdfName); // octet-stream: erzwingt Speichern statt Anzeigen

    btn.textContent="PDF erstellt ✓";
    setTimeout(()=>{ btn.textContent=old; }, 2200);
  }catch(err){ alert("Fehler beim Erzeugen der PDF: "+err.message); btn.textContent=old; }
  finally{ btn.disabled=false; }
});

/* Lehrkraft: PDF laden + Code (Einzelansicht) bzw. mehrere PDFs (Tabellenansicht) */
let teacherBundle=null;
let batchRows=[];        // Zeilen der Tabellenansicht
let batchSelected=null;  // in der Tabelle angeklickte Zeile
const TRACK_RE=/%TRACKDATA (\S+)/;

function readAsBinaryStr(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{const u=new Uint8Array(fr.result);let s="";const CH=0x8000;for(let i=0;i<u.length;i+=CH)s+=String.fromCharCode.apply(null,u.subarray(i,i+CH));res(s);};
    fr.onerror=()=>rej(new Error("Datei konnte nicht gelesen werden."));
    fr.readAsArrayBuffer(file);
  });
}
function setCodeFor(text){
  const el=$("code-for"); if(!el) return;
  el.textContent=text?("Einzelansicht für "+text+" – bitte Code eingeben."):"";
  el.classList.toggle("hidden",!text);
}
function resetTeacherView(){
  $("teacher-err").textContent=""; $("result").innerHTML="";
  $("code-area").classList.add("hidden"); $("code-input").value="";
  setCodeFor(""); teacherBundle=null; batchRows=[]; batchSelected=null;
}

/* Einzelansicht: eine PDF, Code wird von der Lehrkraft eingegeben */
async function readPdfFile(file){
  resetTeacherView();
  try{
    const str=await readAsBinaryStr(file);
    const mm=str.match(TRACK_RE);
    if(!mm){$("teacher-err").textContent="In dieser PDF wurden keine Tracking-Daten gefunden.";return;}
    teacherBundle=mm[1];
    $("code-area").classList.remove("hidden");
    setTimeout(()=>$("code-input").focus(),40);
  }catch(err){ $("teacher-err").textContent=err.message||"Datei konnte nicht gelesen werden."; }
}

/* Code automatisch ermitteln: alle plausiblen Buchstabenzahlen des Vornamens durchprobieren
   (AES-GCM schlägt bei falschem Code sauber fehl) */
async function autoDecrypt(bundle){
  for(let n=1;n<=40;n++){
    const code=_kfN(n);
    try{ const json=await aesDecrypt(bundle,code); return {payload:JSON.parse(json),code}; }catch(e){}
  }
  throw new Error("Code konnte nicht ermittelt werden.");
}
function splitName(p){
  let vn=(p.vn||"").trim(), nn=(p.nn||"").trim();
  if(!vn&&!nn){ // ältere PDFs: nur Gesamtname gespeichert -> am ersten Leerzeichen teilen
    const n=(p.n||"").trim(); const i=n.indexOf(" ");
    if(i<0) vn=n; else { vn=n.slice(0,i); nn=n.slice(i+1).trim(); }
  }
  return {vn,nn};
}
function redPercent(p){ return (typeof p.r==="number"&&isFinite(p.r))?p.r:computeStats(p.t||"",p.m||[]).redPct; }

/* Tabellenansicht: mehrere PDFs */
async function readBatch(files){
  resetTeacherView();
  $("result").innerHTML=`<p class="batchsum">Werte ${files.length} PDF-Dateien aus…</p>`;
  const rows=[];
  for(const f of files){
    try{
      const str=await readAsBinaryStr(f);
      const mm=str.match(TRACK_RE);
      if(!mm) throw new Error("keine Tracking-Daten gefunden");
      const {payload}=await autoDecrypt(mm[1]);
      const nm=splitName(payload);
      rows.push({file:f.name,vn:nm.vn,nn:nm.nn,r:redPercent(payload),bundle:mm[1]});
    }catch(err){ rows.push({file:f.name,error:err.message||"Fehler"}); }
  }
  batchRows=rows;
  renderBatchTable();
}
function renderBatchTable(){
  const rows=batchRows.slice();
  rows.sort((a,b)=>{
    if(!!a.error!==!!b.error) return a.error?1:-1;            // Fehlerzeilen ans Ende
    if(!a.error && b.r!==a.r) return b.r-a.r;                  // Rot-Anteil absteigend
    const c=(a.nn||"").localeCompare(b.nn||"","de"); if(c) return c;
    return (a.vn||"").localeCompare(b.vn||"","de");
  });
  const ok=rows.filter(r=>!r.error), high=ok.filter(r=>r.r>RED_LIMIT).length, errs=rows.length-ok.length;
  let html=`<p class="batchsum">${rows.length} PDF-Dateien · ${high} über ${RED_LIMIT} %${errs?` · ${errs} nicht lesbar`:""}</p>`;
  html+='<div class="tablewrap"><table class="batch"><thead><tr><th>Vorname</th><th>Nachname</th><th class="pct">Rot-Anteil</th></tr></thead><tbody>';
  rows.forEach(r=>{
    if(r.error){ html+=`<tr class="errrow"><td colspan="3">${esc(r.file)} – ${esc(r.error)}</td></tr>`; return; }
    const hi=r.r>RED_LIMIT;
    html+=`<tr class="clickable" data-idx="${batchRows.indexOf(r)}" title="Einzelansicht öffnen (Code erforderlich)"><td>${esc(r.vn)}</td><td>${esc(r.nn)}</td><td class="pct${hi?" high":""}">${r.r}&nbsp;%</td></tr>`;
  });
  html+='</tbody></table></div>';
  html+='<p class="batchhint">Rot-Anteil = Anteil der rot markierten Zeichen (eingefügt oder ≤ 0,015 s getippt). Klick auf eine Zeile öffnet die Einzelansicht nach Eingabe des Codes.</p>';
  $("result").innerHTML=html;
  $("code-area").classList.add("hidden"); setCodeFor(""); $("teacher-err").textContent="";
  batchSelected=null; teacherBundle=null;
  $("result").querySelectorAll("tr.clickable").forEach(tr=>tr.addEventListener("click",()=>selectBatchRow(parseInt(tr.dataset.idx,10),tr)));
}
function selectBatchRow(idx,tr){
  const row=batchRows[idx]; if(!row||row.error) return;
  batchSelected=row; teacherBundle=row.bundle;
  $("result").querySelectorAll("tr.selected").forEach(x=>x.classList.remove("selected"));
  tr.classList.add("selected");
  setCodeFor((row.vn+" "+row.nn).trim());
  $("teacher-err").textContent="";
  $("code-area").classList.remove("hidden"); $("code-input").value="";
  try{ $("code-area").scrollIntoView({behavior:"smooth",block:"center"}); }catch(e){}
  setTimeout(()=>$("code-input").focus(),40);
}

function handleFiles(list){
  const files=Array.prototype.slice.call(list||[]);
  if(!files.length) return;
  if(files.length===1) readPdfFile(files[0]); else readBatch(files);
}
$("pdf-input").addEventListener("change",e=>{handleFiles(e.target.files); e.target.value="";});
const dropZone=$("teacher-drop");
["dragover","dragenter"].forEach(ev=>dropZone.addEventListener(ev,e=>{e.preventDefault();dropZone.style.borderColor="#8a6a3c";}));
["dragleave","drop"].forEach(ev=>dropZone.addEventListener(ev,e=>{e.preventDefault();dropZone.style.borderColor="";}));
dropZone.addEventListener("drop",e=>{handleFiles(e.dataTransfer.files);});

async function showTeacherResult(){
  const code=$("code-input").value.trim();
  $("teacher-err").textContent="";
  if(!teacherBundle)return;
  try{
    const json=await aesDecrypt(teacherBundle,code);
    const p=JSON.parse(json);
    let html=renderAnalysis(p);
    if(batchSelected) html='<a href="#" class="backlink" id="back-table">← zurück zur Tabelle</a>'+html;
    $("result").innerHTML=html;
    if(batchSelected){
      $("code-area").classList.add("hidden"); setCodeFor("");
      $("back-table").addEventListener("click",e=>{e.preventDefault();renderBatchTable();});
    }
  }catch(err){
    if(!batchSelected) $("result").innerHTML="";   // in der Tabellenansicht bleibt die Tabelle stehen
    $("teacher-err").textContent="Falscher Code.";
  }
}
$("code-btn").addEventListener("click",showTeacherResult);
$("code-input").addEventListener("keydown",e=>{if(e.key==="Enter")showTeacherResult();});

const WIN_ANSI_MAP = {
  'ä': 0xE4, 'ö': 0xF6, 'ü': 0xFC, 'Ä': 0xC4, 'Ö': 0xD6, 'Ü': 0xDC, 'ß': 0xDF,
  '€': 0x80, '‚': 0x82, '„': 0x84, '…': 0x85, '†': 0x86, '‡': 0x87,
  '‰': 0x89, '‹': 0x8B, "\u2018": 0x91, "\u2019": 0x92, '\u201C': 0x93, '\u201D': 0x94,
  '•': 0x95, '–': 0x96, '—': 0x97, '™': 0x99, '›': 0x9B,
  '¡': 0xA1, '«': 0xAB, '»': 0xBB, '·': 0xB7, '×': 0xD7, '°': 0xB0,
  '²': 0xB2, '³': 0xB3, '½': 0xBD, '¼': 0xBC, '¾': 0xBE, '¿': 0xBF,
};
const FALLBACK_MAP = {
  '₀':'0','₁':'1','₂':'2','₃':'3','₄':'4','₅':'5','₆':'6','₇':'7','₈':'8','₉':'9',
  '⁰':'0','¹':'1','⁴':'4','⁵':'5','⁶':'6','⁷':'7','⁸':'8','⁹':'9',
  '→':'->','←':'<-','↑':'^','↓':'v','✓':'v','✗':'x','✕':'x','★':'*','☆':'*',
  '\u00A0':' ','\u2009':' ','\u200B':'',
};

function encodeWinAnsi(str) {
  const bytes = [];
  for (const ch of str) {
    const code = ch.charCodeAt(0);
    if (code < 128) bytes.push(code);
    else if (WIN_ANSI_MAP[ch] !== undefined) bytes.push(WIN_ANSI_MAP[ch]);
    else if (FALLBACK_MAP[ch] !== undefined) {
      for (const sub of FALLBACK_MAP[ch]) bytes.push(sub.charCodeAt(0) & 0xFF);
    } else if (code <= 255) bytes.push(code);
    else bytes.push(0x3F);
  }
  return bytes;
}

function pdfStringWidth(str, fontSize, isBold) {
  const bytes = encodeWinAnsi(str);
  let total = 0;
  for (const b of bytes) total += (HELV_W[b] || 500) * (isBold ? 1.04 : 1);
  return total * fontSize / 1000;
}

class PdfDoc {
  constructor() {
    this.pages = [];
    this.pageW = 595; this.pageH = 842; // A4 in pt
    this.margin = 56;
    this.cursorY = 0;
    this.currentContent = [];
  }
  startPage() {
    this.cursorY = this.pageH - this.margin;
    this.currentContent = [];
  }
  endPage() {
    this.pages.push({ content: this.currentContent.join('\n') });
  }
  _escapedString(str) {
    const bytes = encodeWinAnsi(str);
    let s = '(';
    for (const b of bytes) {
      if (b === 0x28 || b === 0x29 || b === 0x5C) s += '\\';
      s += String.fromCharCode(b);
    }
    s += ')';
    return s;
  }
  text(str, x, y, fontSize, isBold, color) {
    const fontKey = isBold ? 'F2' : 'F1';
    const c = color || [0, 0, 0];
    const pdfStr = this._escapedString(str);
    let cmd = `${c[0]/255} ${c[1]/255} ${c[2]/255} rg\nBT\n/${fontKey} ${fontSize} Tf\n${x} ${y} Td\n${pdfStr} Tj\nET`;
    this.currentContent.push(cmd);
  }
  rect(x, y, w, h, fill, stroke) {
    let cmd = '';
    if (fill) cmd += `${fill[0]/255} ${fill[1]/255} ${fill[2]/255} rg\n`;
    if (stroke) cmd += `${stroke[0]/255} ${stroke[1]/255} ${stroke[2]/255} RG\n`;
    cmd += `${x} ${y} ${w} ${h} re\n`;
    if (fill && stroke) cmd += 'B';
    else if (fill) cmd += 'f';
    else if (stroke) cmd += 'S';
    this.currentContent.push(cmd);
  }
  line(x1, y1, x2, y2, color, width) {
    const c = color || [0,0,0];
    let cmd = `${c[0]/255} ${c[1]/255} ${c[2]/255} RG\n${width||0.5} w\n${x1} ${y1} m ${x2} ${y2} l S`;
    this.currentContent.push(cmd);
  }
  paragraph(str, x, y, width, fontSize, isBold, color, leading) {
    if (!leading) leading = fontSize * 1.4;
    const words = String(str).split(/\s+/);
    let line = '';
    let curY = y;
    for (const word of words) {
      if (!word) continue;
      const test = line ? line + ' ' + word : word;
      if (pdfStringWidth(test, fontSize, isBold) <= width) {
        line = test;
      } else {
        if (line) {
          this.text(line, x, curY, fontSize, isBold, color);
          curY -= leading;
          line = word;
        } else {
          this.text(word, x, curY, fontSize, isBold, color);
          curY -= leading;
        }
      }
    }
    if (line) {
      this.text(line, x, curY, fontSize, isBold, color);
      curY -= leading;
    }
    return curY;
  }
  build() {
    const objects = [null, null,  // catalog, pages
      '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>',
      '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>',
    ];
    const pageIds = [];
    for (const page of this.pages) {
      objects.push(`<< /Length ${page.content.length} >>\nstream\n${page.content}\nendstream`);
      const contentId = objects.length;
      objects.push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${this.pageW} ${this.pageH}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${contentId} 0 R >>`);
      pageIds.push(objects.length);
    }
    objects[1] = `<< /Type /Pages /Kids [${pageIds.map(i => i + ' 0 R').join(' ')}] /Count ${pageIds.length} >>`;
    objects[0] = '<< /Type /Catalog /Pages 2 0 R >>';

    let pdf = '%PDF-1.4\n%\xC4\xC5\xC6\xC7\n';
    const offsets = [0];
    for (let i = 0; i < objects.length; i++) {
      offsets.push(pdf.length);
      pdf += `${i+1} 0 obj\n${objects[i]}\nendobj\n`;
    }
    const xrefOffset = pdf.length;
    pdf += `xref\n0 ${objects.length + 1}\n0000000000 65535 f \n`;
    for (let i = 1; i <= objects.length; i++) pdf += String(offsets[i]).padStart(10, '0') + ' 00000 n \n';
    pdf += `trailer\n<< /Size ${objects.length + 1} /Root 1 0 R >>\nstartxref\n${xrefOffset}\n%%EOF\n`;
    return pdf;
  }
  toBase64(trailerComment) {
    let pdf = this.build();
    if (trailerComment) pdf += trailerComment;   // unsichtbar nach %%EOF (von PDF-Viewern ignoriert)
    return btoa(pdf);
  }
}

  return doc.toBase64(trailer);
}

// Datum + Uhrzeit des Abschlusses formatieren
function fmtDateTime(d) {
  if (!d) d = new Date();
  const date = d.toLocaleDateString('de-DE');
  const time = d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
  return date + ', ' + time + ' Uhr';
}

      lib.classList.add('visited');
    }
    sealsBox.appendChild(lib);

    const s = document.createElement('div');
    s.className = 'seal';
    if (state.solved[i]) {
      s.classList.add('solved');
      s.textContent = CODE_WORD[i];
    } else if (state.screen === 'room' + (i + 1)) {
      s.classList.add('active');
      s.textContent = i + 1;
    } else {
      s.textContent = i + 1;
    }
    sealsBox.appendChild(s);
  }
}

window.maskBirth = (el) => {
  let v = el.value.replace(/[^0-9]/g, '').slice(0, 8);
  let out = v;
  if (v.length > 4) out = v.slice(0, 2) + '.' + v.slice(2, 4) + '.' + v.slice(4);
  else if (v.length > 2) out = v.slice(0, 2) + '.' + v.slice(2);
  el.value = out;
};

window.submitName = () => {
  const fn = document.getElementById('firstNameInput').value.trim();
  const ln = document.getElementById('lastNameInput').value.trim();
  const bd = document.getElementById('birthInput').value.trim();
  const err = document.getElementById('nameError');
  function showErr(msg) { err.style.display = 'block'; err.textContent = msg; }
  if (fn.length < 2 || ln.length < 2) {
    showErr('Bitte trage deinen vollen Vor- und Nachnamen ein (jeweils mindestens 2 Zeichen).');
    return;
  }
  const m = bd.match(/^(\d{2})\.(\d{2})\.(\d{4})$/);
  if (!m) {
    showErr('Bitte gib dein Geburtsdatum im Format TT.MM.JJJJ ein (z. B. 07.03.2009).');
    return;
  }
  const dd = parseInt(m[1], 10), mm = parseInt(m[2], 10), yyyy = parseInt(m[3], 10);
  if (dd < 1 || dd > 31 || mm < 1 || mm > 12 || yyyy < 1900 || yyyy > 2025) {
    showErr('Das Geburtsdatum scheint nicht zu stimmen. Bitte prüfe Tag, Monat und Jahr.');
    return;
  }
  state.firstName = fn;
  state.lastName = ln;
  state.birthDate = bd;
  state.code = computeCode(m[1] + m[2] + m[3]);
  renderIntro();
};

const LIB2_TEXT = `
  <div class="lib-section">
    <div class="lib-section-title">Warum überhaupt Umweltpolitik?</div>
    <p>Wer Kohle verfeuert oder mit dem Verbrenner fährt, verursacht Schäden – etwa durch Treibhausgase –, für die er selbst zunächst nicht zahlt; die Kosten trägt die Allgemeinheit. Solche nicht eingepreisten Folgen nennt man <strong>externe Effekte</strong> (externe Kosten). Der Markt allein bildet sie im Preis nicht ab. Aufgabe des Staates ist es deshalb, diese Kosten den Verursachern wieder zuzurechnen – die <strong>Internalisierung externer Kosten</strong>. Dahinter steht das <strong>Verursacherprinzip</strong>: Wer die Umwelt belastet, soll dafür aufkommen.</p>
  </div>

  <div class="lib-section">
    <div class="lib-section-title">Vier typische Hebel des Bundes</div>
    <p>Wie der Bund steuert, lässt sich in vier Instrumentengruppen ordnen:</p>
    <table class="lib-table">
      <thead><tr><th>Hebel</th><th>Wirkungsweise</th></tr></thead>
      <tbody>
        <tr><td><strong>Ordnungsrecht</strong></td><td>schreibt Verhalten vor (Ge-/Verbote, Grenzwerte, Standards)</td></tr>
        <tr><td><strong>Ökonomische Instrumente</strong></td><td>setzen finanzielle Anreize (Preis- oder Mengenlösung)</td></tr>
        <tr><td><strong>Förderung</strong></td><td>belohnt erwünschtes Verhalten (Zuschüsse, Programme)</td></tr>
        <tr><td><strong>Information</strong></td><td>beeinflusst über Aufklärung und Kennzeichnung</td></tr>
      </tbody>
    </table>
  </div>

  <div class="lib-section">
    <div class="lib-section-title">1 · Ordnungsrechtliche Instrumente (Auflagenlösung)</div>
    <p>Der Staat steuert über <strong>Ge- und Verbote, Grenzwerte und Standards</strong>, also durch rechtlichen Zwang. Beispiele: das <strong>BImSchG</strong> legt Grenzwerte für den Schadstoffausstoß von Anlagen fest und regelt deren Genehmigung; das <strong>GEG</strong> schreibt Heizungstausch und Dämmstandards vor. Vorteil: hohe Planungssicherheit und klare ökologische Wirkung. Nachteil: unflexibel und oft ineffizient, weil alle dasselbe tun müssen – unabhängig davon, wer Emissionen am günstigsten vermeiden könnte; zudem hoher Kontrollaufwand.</p>
  </div>

  <div class="lib-section">
    <div class="lib-section-title">2 · Marktwirtschaftliche (ökonomische) Instrumente</div>
    <p>Sie schreiben kein konkretes Verhalten vor, sondern setzen <strong>finanzielle Anreize</strong> und überlassen die Entscheidung dem Einzelnen. Zwei Varianten:</p>
    <ul class="lib-bullets">
      <li><strong>Preislösung (Abgaben/Steuern):</strong> Der Staat legt einen <strong>Preis</strong> fest – die Menge ergibt sich daraus. Wichtigstes Beispiel: das <strong>BEHG</strong> mit seinem nationalen CO₂-Preis auf fossile Brennstoffe. Eine solche Lenkungsabgabe verteuert klimaschädliches Verhalten. Der Preis ist klar, die genau eingesparte Menge bleibt offen.</li>
      <li><strong>Mengenlösung (Zertifikatehandel, „Cap-and-Trade"):</strong> Der Staat legt eine <strong>Höchstmenge</strong> fest (den „Cap") und gibt handelbare Zertifikate aus – der Preis bildet sich am Markt. Vor allem auf EU-Ebene im Einsatz (EU-Emissionshandel): ökologisch treffsicher bei der Menge, dafür ist der Preis weniger vorhersehbar.</li>
    </ul>
    <p>Gemeinsamer Vorteil: <strong>ökonomische Effizienz</strong> – Emissionen werden dort eingespart, wo es am billigsten ist. Kritisch ist die <strong>Verteilungswirkung</strong>: Ein CO₂-Preis belastet einkommensschwache Haushalte relativ stärker, was die gesellschaftliche Akzeptanz beeinflusst.</p>
  </div>

  <div class="lib-section">
    <div class="lib-section-title">3 · Finanzielle Förderung (Anreiz-/Subventionsinstrumente)</div>
    <p>Statt zu verteuern oder zu verbieten, <strong>belohnt</strong> der Staat erwünschtes Verhalten durch Zuschüsse und Förderprogramme – etwa für den Einbau einer Wärmepumpe oder die Gebäudesanierung. Das erhöht die Akzeptanz und beschleunigt den Umstieg, kostet aber Steuergeld und folgt eher dem <strong>Gemeinlastprinzip</strong> (die Allgemeinheit zahlt) als dem Verursacherprinzip.</p>
  </div>

  <div class="lib-section">
    <div class="lib-section-title">4 · Information und Selbstverpflichtung (persuasive Instrumente)</div>
    <p>Die „weichsten" Hebel wirken über Aufklärung, Kennzeichnung (z. B. das Energielabel) oder freiwillige Vereinbarungen mit der Wirtschaft. Sie setzen weder Zwang noch starke finanzielle Anreize, sondern auf Einsicht und Transparenz – wirksam, für sich genommen aber meist zu schwach.</p>
  </div>

  </div>

let r1Selected = new Set();

function renderRoom1() {
  state.screen = 'room1';

  r1Submitted = false;
  const room = ROOMS[0];

  const cards = PUZZLE_R1.measures.map(m => `
    <button class="measure-card" id="card-${m.id}" onclick="toggleR1('${m.id}')">
      <span class="checkbox"></span>
      <span><span class="card-text">${m.text}</span><div class="feedback-hint" id="hint-${m.id}">${m.expl}</div></span>
    </button>
  `).join('');

  root.innerHTML = `
    ${roomHeader(room)}
    <div class="measure-grid">${cards}</div>
    ${roomFooter(room,
      'Frage dich: Wer ist <strong>Eigentümer</strong> der Sache? Wer plant <strong>vor Ort</strong>? CO₂-Preise und EU-weit gültige Verbote werden NICHT in der Kommune beschlossen.',
      'checkR1()')}
  `;
}

window.toggleR1 = (id) => {
  if (r1Submitted) return;
  const card = document.getElementById('card-' + id);
  if (r1Selected.has(id)) {
    r1Selected.delete(id);
    card.classList.remove('selected');
  } else {
    r1Selected.add(id);
    card.classList.add('selected');
  }
};

window.checkR1 = () => {
  const correctSet = new Set(PUZZLE_R1.measures.filter(m => m.correct).map(m => m.id));
  let perfectMatch = true;
  const wrongSelected = [];
  const missed = [];

  // Mark each card with feedback
  PUZZLE_R1.measures.forEach(m => {
    const card = document.getElementById('card-' + m.id);
    card.classList.remove('selected', 'feedback-correct', 'feedback-incorrect', 'feedback-missed');
    const isSelected = r1Selected.has(m.id);
    if (isSelected && m.correct) {
      card.classList.add('feedback-correct');
    } else if (isSelected && !m.correct) {
      card.classList.add('feedback-incorrect');
      perfectMatch = false;
      wrongSelected.push(m);
    } else if (!isSelected && m.correct) {
      card.classList.add('feedback-missed');
      perfectMatch = false;
      missed.push(m);
    }
  });

  // Record errors (first attempt only)
  const errors = [];
  wrongSelected.forEach(m => errors.push({ kind: 'falsch_gewaehlt', item: m.text, explanation: m.expl }));
  missed.forEach(m => errors.push({ kind: 'uebersehen', item: m.text, explanation: m.expl }));
  recordAttempt(0, { errors });

  if (perfectMatch) {
    r1Submitted = true;
    showStatus('success', 'Raum gelöst', 'Vier kommunale Maßnahmen korrekt identifiziert. Die Bürgermeisterin nickt anerkennend.');
    setTimeout(() => triggerReveal(0), 900);
  } else {
    showStatus('warning', 'Noch nicht ganz', 'Schau dir die rot markierten Karten (falsch gewählt) und die gold markierten Karten (übersehen) an. Lies die Erklärungen und korrigiere deine Auswahl.');
    // Allow retry: reset visual state after a moment but keep selections
    setTimeout(() => {
      PUZZLE_R1.measures.forEach(m => {
        const card = document.getElementById('card-' + m.id);
        card.classList.remove('feedback-correct', 'feedback-incorrect', 'feedback-missed');
        if (r1Selected.has(m.id)) card.classList.add('selected');
      });
    }, 5000);
  }
};

  const bank = R2B_BANK.slice().sort((a, b) => a.length - b.length || a.localeCompare(b, 'de'));

window.selectLeft = (i) => {
  if (r2Submitted) return;
  // Already paired?
  if (r2Pairs[i] !== undefined) {
    // Unpair
    const rightId = r2Pairs[i];
    document.getElementById('right-' + rightId).classList.remove('paired');
    document.getElementById('right-' + rightId).querySelector('.match-marker').textContent = '?';
    document.getElementById('left-' + i).classList.remove('paired');
    document.getElementById('left-' + i).querySelector('.match-marker').textContent = (i + 1);
    delete r2Pairs[i];
    return;
  }
  // Deselect others
  document.querySelectorAll('#screenContainer .match-card.selected').forEach(c => {
    if (c.id.startsWith('left-')) c.classList.remove('selected');
  });
  document.getElementById('left-' + i).classList.add('selected');
  r2SelectedLeft = i;
};

window.selectRight = (rightId) => {
  if (r2Submitted) return;
  // If already paired, unpair
  for (const [li, ri] of Object.entries(r2Pairs)) {
    if (ri === rightId) {
      document.getElementById('right-' + rightId).classList.remove('paired');
      document.getElementById('right-' + rightId).querySelector('.match-marker').textContent = '?';
      document.getElementById('left-' + li).classList.remove('paired');
      document.getElementById('left-' + li).querySelector('.match-marker').textContent = (Number(li) + 1);
      delete r2Pairs[li];
      return;
    }
  }
  if (r2SelectedLeft === null) {
    showStatus('info', 'Tipp', 'Wähle zuerst ein Gesetz auf der linken Seite.');
    return;
  }
  // Pair them
  const leftIdx = r2SelectedLeft;
  r2Pairs[leftIdx] = rightId;
  document.getElementById('left-' + leftIdx).classList.remove('selected');
  document.getElementById('left-' + leftIdx).classList.add('paired');
  document.getElementById('right-' + rightId).classList.add('paired');
  document.getElementById('right-' + rightId).querySelector('.match-marker').textContent = (leftIdx + 1);
  r2SelectedLeft = null;
  document.getElementById('statusBox').innerHTML = '';
};

window.checkR2 = () => {
  if (Object.keys(r2Pairs).length < 4) {
    showStatus('warning', 'Noch nicht fertig', 'Teil 1: Es müssen alle vier Gesetze einer Wirkung zugeordnet sein.');
    return;
  }
  // Teil 2 vollständig ausgefüllt?
  const t2Incomplete = R2B_BLANKS.some(b => { const el = document.getElementById('r2b-' + b.id); return !el || !el.value; });
  if (t2Incomplete) {
    showStatus('warning', 'Noch nicht fertig', 'Teil 2: Bitte wähle in jedem Auswahlfeld des Lückentexts einen Begriff.');
    return;
  }

  let allCorrect = true;
  const errors = [];

  // Teil 1: Zuordnung
  PUZZLE_R2.pairs.forEach((p, i) => {
    const leftEl = document.getElementById('left-' + i);
    const rightId = r2Pairs[i];
    const rightEl = document.getElementById('right-' + rightId);
    leftEl.classList.remove('paired');
    rightEl.classList.remove('paired');
    if (rightId === p.rightId) {
      leftEl.classList.add('correct-pair');
      rightEl.classList.add('correct-pair');
    } else {
      leftEl.classList.add('wrong-pair');
      rightEl.classList.add('wrong-pair');
      allCorrect = false;
      const gotRight = PUZZLE_R2.pairs.find(x => x.rightId === rightId);
      errors.push({
        kind: 'falsch_zugeordnet',
        item: p.left + ' (' + p.leftLong + ')',
        wrongAnswer: gotRight ? gotRight.right : '(unbekannt)',
        correctAnswer: p.right,
      });
    }
  });

  // Teil 2: Dropdown-Lückentext
  R2B_BLANKS.forEach(b => {
    const selEl = document.getElementById('r2b-' + b.id);
    const val = selEl.value;
    selEl.classList.remove('correct', 'incorrect');
    if (val === b.correct) {
      selEl.classList.add('correct');
    } else {
      selEl.classList.add('incorrect');
      allCorrect = false;
      errors.push({
        kind: 'falsche_eingabe',
        item: 'Lückentext (Textseite): ' + b.label,
        wrongAnswer: val,
        correctAnswer: b.correct,
      });
    }
  });

  recordAttempt(1, { errors });

  if (allCorrect) {
    r2Submitted = true;
    showStatus('success', 'Raum gelöst', 'Beide Teile korrekt. Die Aktenordner sind sortiert.');
    setTimeout(() => triggerReveal(1), 900);
  } else {
    showStatus('warning', 'Noch nicht alle Antworten stimmen', 'Grün = korrekt, rot = falsch (Teil 1 Paare, Teil 2 Auswahlfelder). Korrigiere die roten und prüfe erneut.');
    setTimeout(() => {
      PUZZLE_R2.pairs.forEach((p, i) => {
        const leftEl = document.getElementById('left-' + i);
        const rightId = r2Pairs[i];
        if (rightId !== p.rightId) {
          // Unpair wrong pairs
          leftEl.classList.remove('wrong-pair');
          document.getElementById('right-' + rightId).classList.remove('wrong-pair');
          document.getElementById('right-' + rightId).querySelector('.match-marker').textContent = '?';
          leftEl.querySelector('.match-marker').textContent = (i + 1);
          delete r2Pairs[i];
        }
      });
    }, 3500);
  }
};

function normalizeAnswer(s) {
  return String(s).trim().toLowerCase().replace(',', '.').replace(/\s+/g, ' ');
}

window.checkR4 = () => {
  let allCorrect = true;
  let anyAnswered = false;
  const errors = [];
  PUZZLE_R4.rows.forEach(r => {
    const inp = document.getElementById('cloze-' + r.id);
    const val = normalizeAnswer(inp.value);
    if (!val) { allCorrect = false; return; }
    anyAnswered = true;
    inp.classList.remove('correct', 'incorrect');
    const accepts = (r.accepts || [r.answer]).map(a => normalizeAnswer(a));
    let ok = accepts.includes(val);
    // For numbers, check tolerance
    if (!ok && r.type === 'number') {
      const num = parseFloat(val.replace(',', '.'));
      const target = parseFloat(String(r.answer).replace(',', '.'));
      if (!isNaN(num) && !isNaN(target) && Math.abs(num - target) <= (r.tolerance || 0)) ok = true;
    }
    if (ok) {
      inp.classList.add('correct');
    } else {
      inp.classList.add('incorrect');
      allCorrect = false;
      // Reconstruct the question text
      const qtext = (r.before + ' ___ ' + (r.after || '')).replace(/\s+/g, ' ').trim();
      errors.push({
        kind: 'falsche_eingabe',
        item: qtext,
        wrongAnswer: inp.value,
        correctAnswer: r.answer + (r.unit ? ' ' + r.unit : ''),
      });
    }
  });

  // Teil 2: Dropdown-Lückentext
  R4B_BLANKS.forEach(b => {
    const selEl = document.getElementById('r4b-' + b.id);
    if (!selEl) return;
    const val = selEl.value;
    selEl.classList.remove('correct', 'incorrect');
    if (!val) { allCorrect = false; return; }
    anyAnswered = true;
    if (val === b.correct) {
      selEl.classList.add('correct');
    } else {
      selEl.classList.add('incorrect');
      allCorrect = false;
      errors.push({
        kind: 'falsche_eingabe',
        item: 'Lückentext (Erklärfilm): ' + b.label,
        wrongAnswer: val,
        correctAnswer: b.correct,
      });
    }
  });

  if (!anyAnswered) {
    showStatus('warning', 'Bitte ausfüllen', 'Trage Werte ein und versuche es dann erneut.');
    return;
  }

  recordAttempt(3, { errors });

  if (allCorrect) {
    r4Submitted = true;
    showStatus('success', 'Raum gelöst', 'Beide Teile korrekt. Das Pariser Briefing ist entschlüsselt.');
    setTimeout(() => triggerReveal(3), 900);
  } else {
    showStatus('warning', 'Noch nicht alle Antworten stimmen', 'Prüfe Teil 1 (rot markierte Felder) und Teil 2 (rot markierte Auswahlfelder) und korrigiere sie.');
  }
};

/* ============================================================
