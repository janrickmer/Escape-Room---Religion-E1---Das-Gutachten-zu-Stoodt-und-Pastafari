<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Das Gutachten · Escape-Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   DAS GUTACHTEN — Escape Room
   Ev. Religion · E-Phase · E1 · Funktionen von Religion (Stoodt)
   ============================================================ */

:root {
  --c-bg:           #ffffff;
  --c-bg-soft:      #f4f8fc;
  --c-bg-card:      #ffffff;
  --c-bg-tint:      #e6f2fb;
  --c-text:         #1b2733;
  --c-text-mute:    #55677a;
  --c-text-dim:     #8a99a8;
  --c-blue:         #3b9ddd;
  --c-blue-deep:    #1d7bbf;
  --c-blue-dark:    #155f94;
  --c-blue-soft:    #cfe6f7;
  --c-success:      #2c8a58;
  --c-success-bg:   #e6f5ec;
  --c-error:        #cf4f3a;
  --c-error-bg:     #fbe9e5;
  --c-warn:         #c98a1c;
  --c-warn-bg:      #fff5e0;
  --c-border:       #cddced;
  --c-border-soft:  #e3ebf3;

  --font-display: 'Manrope', 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-body:    'Manrope', 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-serif:   'Source Serif 4', 'Iowan Old Style', Georgia, 'Times New Roman', serif;
  --font-mono:    'JetBrains Mono', 'Menlo', 'Consolas', monospace;

  --shadow-soft:   0 2px 10px rgba(27, 39, 51, 0.06);
  --shadow-card:   0 6px 24px rgba(27, 39, 51, 0.07), 0 1px 3px rgba(27, 39, 51, 0.05);
  --radius:        10px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  background: var(--c-bg);
  color: var(--c-text);
  font-family: var(--font-body);
  font-weight: 400;
  line-height: 1.6;
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ============================================================
   LAYOUT
   ============================================================ */

.app { min-height: 100vh; display: flex; flex-direction: column; }

.topbar {
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(255, 255, 255, 0.92);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--c-border-soft);
  padding: 12px 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
}

.topbar-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 15px;
  letter-spacing: -0.01em;
  color: var(--c-blue-dark);
}

.topbar-brand .stars-icon { width: 24px; height: 24px; fill: none; stroke: var(--c-blue); stroke-width: 1.8; }

.topbar-progress { display: flex; gap: 7px; align-items: center; flex-wrap: wrap; }

.seal {
  width: 30px; height: 30px;
  border-radius: 50%;
  border: 1.5px solid var(--c-border);
  background: #fff;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-mono);
  font-size: 11px; font-weight: 700;
  color: var(--c-text-dim);
  transition: all 0.35s ease;
  position: relative;
}
.seal.active { border-color: var(--c-blue); color: var(--c-blue-deep); box-shadow: 0 0 0 4px var(--c-bg-tint); }
.seal.solved {
  background: var(--c-blue);
  border-color: var(--c-blue);
  color: #fff;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 13px;
}
.seal.library { width: 10px; height: 10px; border-radius: 2px; border-color: var(--c-border); background: #fff; }
.seal.library.active { border-color: var(--c-blue); background: var(--c-blue-soft); box-shadow: none; }
.seal.library.visited { border-color: var(--c-blue-soft); background: var(--c-blue-soft); }

.main { flex: 1; display: flex; align-items: flex-start; justify-content: center; padding: 52px 24px 80px; }

.site-footer {
  text-align: center;
  font-size: 11px;
  color: var(--c-text-dim);
  padding: 18px 12px 24px;
  border-top: 1px solid var(--c-border-soft);
  font-family: var(--font-mono);
  letter-spacing: 0.04em;
}

.screen { width: 100%; max-width: 900px; animation: screenIn 0.45s ease both; }
@keyframes screenIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
@media (prefers-reduced-motion: reduce) { .screen { animation: none; } }

/* ============================================================
   TYPOGRAPHY
   ============================================================ */

h1, h2, h3 { font-family: var(--font-display); font-weight: 700; line-height: 1.15; color: var(--c-text); letter-spacing: -0.02em; }

.kicker {
  font-family: var(--font-mono);
  font-size: 11px; font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--c-blue-deep);
  margin-bottom: 16px;
  display: flex; align-items: center; gap: 12px;
}
.kicker::before { content: ''; display: inline-block; width: 26px; height: 2px; background: var(--c-blue); border-radius: 2px; }

.title-mega { font-size: clamp(40px, 6.5vw, 68px); font-weight: 800; line-height: 1.02; margin-bottom: 22px; letter-spacing: -0.035em; }
.title-mega em { font-style: normal; font-weight: 500; color: var(--c-blue-deep); }

.lede { font-family: var(--font-serif); font-size: clamp(18px, 2vw, 21px); font-weight: 400; line-height: 1.55; color: var(--c-text-mute); max-width: 62ch; margin-bottom: 30px; }

p { margin-bottom: 16px; }
p.body-lg { font-size: 17px; line-height: 1.7; }
.text-mute { color: var(--c-text-mute); }
.font-mono { font-family: var(--font-mono); }
.center { text-align: center; }
.spacer-sm { height: 12px; }
.spacer-md { height: 28px; }

/* ============================================================
   COMPONENTS
   ============================================================ */

.card {
  background: var(--c-bg-card);
  border: 1px solid var(--c-border-soft);
  border-radius: var(--radius);
  padding: 32px 36px;
  margin-bottom: 22px;
  box-shadow: var(--shadow-card);
  position: relative;
}
@media (max-width: 600px) { .card { padding: 22px 20px; } }

.card-accent { position: relative; overflow: hidden; }
.card-accent::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--c-blue); }

.briefing { font-family: var(--font-serif); font-style: italic; font-size: 18px; line-height: 1.7; color: var(--c-text); padding-left: 14px; }
.briefing .speaker {
  display: block;
  font-family: var(--font-mono);
  font-style: normal;
  font-size: 10.5px; font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--c-blue-deep);
  margin-bottom: 8px;
}

/* Buttons */
.btn {
  display: inline-flex; align-items: center; gap: 10px;
  padding: 13px 24px;
  border: none;
  border-radius: 8px;
  font-family: var(--font-body);
  font-size: 14px; font-weight: 700;
  letter-spacing: 0.01em;
  cursor: pointer;
  transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
  text-decoration: none;
}
.btn:focus-visible, .hint-btn:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--c-blue-soft); outline-offset: 2px; }
.btn-primary { background: var(--c-blue); color: #fff; }
.btn-primary:hover { background: var(--c-blue-deep); transform: translateY(-1px); }
.btn-ghost { background: #fff; color: var(--c-blue-dark); border: 1px solid var(--c-border); }
.btn-ghost:hover { border-color: var(--c-blue); color: var(--c-blue-deep); background: var(--c-bg-soft); }
.btn-arrow::after { content: '→'; font-family: var(--font-mono); font-size: 16px; }
.btn-row { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 22px; }

.muted-list { list-style: none; padding: 0; }
.muted-list li { margin: 6px 0 6px 18px; font-size: 14px; position: relative; color: var(--c-text); }
.muted-list li::before { content: ''; position: absolute; left: -18px; top: 9px; width: 7px; height: 7px; border-radius: 50%; background: var(--c-blue-soft); }

/* Intro grid */
.intro-grid { display: grid; grid-template-columns: 1fr; gap: 22px; margin-bottom: 8px; }
@media (min-width: 900px) { .intro-grid { grid-template-columns: 1.6fr 1fr; align-items: start; } }
.intro-meta { background: var(--c-bg-soft); border: 1px solid var(--c-border-soft); border-radius: var(--radius); padding: 24px 26px; }
.intro-meta dt { font-family: var(--font-mono); font-size: 10.5px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--c-blue-deep); margin-top: 16px; }
.intro-meta dt:first-child { margin-top: 0; }
.intro-meta dd { font-size: 14.5px; color: var(--c-text); margin-top: 3px; line-height: 1.5; }

/* Room header — Aktenreiter */
.room-header { display: flex; align-items: center; gap: 18px; margin-bottom: 20px; }
.room-number {
  font-family: var(--font-mono);
  font-size: 15px; font-weight: 700;
  color: var(--c-blue-deep);
  background: var(--c-bg-tint);
  border: 1px solid var(--c-blue-soft);
  border-radius: 8px;
  padding: 12px 14px;
  min-width: 64px;
  text-align: center;
  letter-spacing: 0.06em;
}
.room-meta { display: flex; flex-direction: column; }
.room-location { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--c-text-dim); margin-bottom: 4px; }
.room-name { font-family: var(--font-display); font-size: clamp(24px, 3.4vw, 34px); font-weight: 800; letter-spacing: -0.025em; line-height: 1.1; }

.task-label { color: var(--c-blue-deep); font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; }

/* Status + hint */
.status {
  padding: 14px 18px;
  border-radius: 8px;
  margin: 18px 0 8px;
  font-size: 14.5px;
  line-height: 1.55;
  border: 1px solid transparent;
  opacity: 0; transform: translateY(-4px);
  transition: opacity 0.25s ease, transform 0.25s ease;
}
.status.show { opacity: 1; transform: translateY(0); }
.status-info    { background: var(--c-bg-tint);    border-color: var(--c-blue-soft); color: var(--c-blue-dark); }
.status-warning { background: var(--c-warn-bg);    border-color: #f1d9a3;            color: #6b4a08; }
.status-success { background: var(--c-success-bg); border-color: #bfe3cd;            color: #17603a; }
.status .label { display: block; font-family: var(--font-mono); font-size: 10.5px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 4px; }

.hint-box { display: none; padding: 14px 18px; border-radius: 8px; background: var(--c-bg-soft); border: 1px dashed var(--c-border); font-size: 14.5px; line-height: 1.6; margin: 14px 0 6px; color: var(--c-text); }
.hint-box.show { display: block; }
.hint-box p { margin: 0 0 8px; }
.hint-box p:last-child { margin-bottom: 0; }
.hint-box ul { margin: 4px 0 10px 20px; padding: 0; }
.hint-box li { margin: 2px 0; }
.hint-box .sol { color: var(--c-blue-dark); background: var(--c-bg-tint); padding: 0 4px; border-radius: 4px; }
.hint-box .hint-foot { margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--c-border); font-size: 12.5px; color: var(--c-text-dim); }
.hint-box.pulse { animation: hintPulse 0.9s ease; }
@keyframes hintPulse { 0% { box-shadow: 0 0 0 0 var(--c-blue-soft); } 60% { box-shadow: 0 0 0 6px rgba(207, 230, 247, 0); } 100% { box-shadow: none; } }
.hint-box .label { display: block; font-family: var(--font-mono); font-size: 10.5px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--c-blue-deep); margin-bottom: 4px; }
.hint-btn { background: none; border: none; color: var(--c-text-mute); font-family: var(--font-body); font-size: 13.5px; font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; padding: 8px 4px; }
.hint-btn:hover { color: var(--c-blue-deep); }

/* Part headings inside puzzle rooms */
.part-head { font-size: 16px; font-weight: 700; margin: 26px 0 10px; display: flex; align-items: center; gap: 10px; }
.part-head .part-tag { font-family: var(--font-mono); font-size: 10.5px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--c-blue-deep); background: var(--c-bg-tint); padding: 3px 8px; border-radius: 4px; }
.part-sub { font-size: 14.5px; color: var(--c-text-mute); margin: -4px 0 12px; }

/* ============================================================
   PUZZLE COMPONENTS
   ============================================================ */

/* Multiple choice (single select) */
.mc-block { border: 1px solid var(--c-border-soft); border-radius: var(--radius); padding: 18px 20px; margin: 10px 0 14px; background: #fff; }
.mc-question { font-size: 15.5px; font-weight: 600; margin-bottom: 12px; line-height: 1.5; }
.mc-options { display: grid; gap: 8px; }
.mc-option {
  display: flex; align-items: flex-start; gap: 12px;
  width: 100%; text-align: left;
  padding: 12px 14px;
  border: 1.5px solid var(--c-border);
  border-radius: 8px;
  background: #fff;
  font-family: var(--font-body);
  font-size: 14.5px; line-height: 1.5;
  color: var(--c-text);
  cursor: pointer;
  transition: border-color 0.15s ease, background 0.15s ease;
}
.mc-option:hover { border-color: var(--c-blue); background: var(--c-bg-soft); }
.mc-option .radio { flex: 0 0 auto; width: 18px; height: 18px; margin-top: 2px; border-radius: 50%; border: 2px solid var(--c-border); position: relative; }
.mc-option.selected { border-color: var(--c-blue); background: var(--c-bg-tint); }
.mc-option.selected .radio { border-color: var(--c-blue); }
.mc-option.selected .radio::after { content: ''; position: absolute; inset: 3px; border-radius: 50%; background: var(--c-blue); }
.mc-option.correct { border-color: var(--c-success); background: var(--c-success-bg); }
.mc-option.correct .radio { border-color: var(--c-success); }
.mc-option.correct .radio::after { content: ''; position: absolute; inset: 3px; border-radius: 50%; background: var(--c-success); }
.mc-option.incorrect { border-color: var(--c-error); background: var(--c-error-bg); }
.mc-option.incorrect .radio { border-color: var(--c-error); }
.mc-option.incorrect .radio::after { content: ''; position: absolute; inset: 3px; border-radius: 50%; background: var(--c-error); }

/* Bucket sort */
.cards-pool { border: 1.5px dashed var(--c-border); border-radius: var(--radius); padding: 16px 16px 10px; margin: 16px 0; min-height: 70px; display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start; background: var(--c-bg-soft); }
.cards-pool-label { width: 100%; font-family: var(--font-mono); font-size: 10.5px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--c-text-dim); margin-bottom: 4px; }
.sort-card {
  padding: 10px 14px;
  border: 1.5px solid var(--c-border);
  border-radius: 8px;
  background: #fff;
  font-family: var(--font-body);
  font-size: 14px; line-height: 1.45;
  color: var(--c-text);
  text-align: left;
  cursor: pointer;
  transition: border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
  margin: 0 0 6px 0;
}
.sort-card:hover { border-color: var(--c-blue); }
.sort-card.selected { border-color: var(--c-blue); background: var(--c-bg-tint); box-shadow: 0 0 0 3px var(--c-blue-soft); }
.sort-card.placed { width: 100%; }
.sort-card.correct { border-color: var(--c-success); background: var(--c-success-bg); }
.sort-card.incorrect { border-color: var(--c-error); background: var(--c-error-bg); }

.bucket-area { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin: 10px 0 8px; }
.bucket-area.triple { grid-template-columns: repeat(3, 1fr); }
@media (max-width: 720px) { .bucket-area, .bucket-area.triple { grid-template-columns: 1fr; } }
.bucket {
  border: 1.5px solid var(--c-border);
  border-radius: var(--radius);
  padding: 16px 14px 10px;
  min-height: 150px;
  background: #fff;
  cursor: pointer;
  transition: border-color 0.15s ease, background 0.15s ease;
}
.bucket.target { border-color: var(--c-blue); background: var(--c-bg-tint); border-style: dashed; }
.bucket-label { font-family: var(--font-display); font-weight: 800; font-size: 15.5px; color: var(--c-blue-dark); }
.bucket-desc { font-size: 13px; color: var(--c-text-mute); margin: 2px 0 10px; line-height: 1.45; }
.bucket-items { display: flex; flex-direction: column; gap: 6px; }

/* Assignment (case -> function) */
.assign-list { display: flex; flex-direction: column; gap: 10px; margin: 12px 0 6px; }
.assign-row { display: grid; grid-template-columns: 1fr 260px; gap: 12px; align-items: center; border: 1.5px solid var(--c-border-soft); border-radius: var(--radius); padding: 12px 14px; background: #fff; }
@media (max-width: 700px) { .assign-row { grid-template-columns: 1fr; } }
.assign-text { font-size: 14.5px; line-height: 1.5; }
.assign-select {
  width: 100%;
  padding: 10px 12px;
  border: 1.5px solid var(--c-border);
  border-radius: 8px;
  background: #fff;
  font-family: var(--font-body);
  font-size: 14px;
  color: var(--c-text);
}
.assign-row.correct { border-color: var(--c-success); background: var(--c-success-bg); }
.assign-row.incorrect { border-color: var(--c-error); background: var(--c-error-bg); }

/* Cloze (free text) */
.cloze-prose { font-family: var(--font-serif); font-size: 17px; line-height: 2.1; color: var(--c-text); }
.cloze-input {
  display: inline-block;
  min-width: 150px;
  padding: 5px 10px;
  margin: 0 3px;
  border: none;
  border-bottom: 2px solid var(--c-blue);
  border-radius: 4px 4px 0 0;
  background: var(--c-bg-tint);
  font-family: var(--font-body);
  font-size: 15px; font-weight: 600;
  color: var(--c-blue-dark);
  text-align: center;
  vertical-align: baseline;
}
.cloze-input:focus { outline: none; background: #dbeefb; }
.cloze-input.correct { border-bottom-color: var(--c-success); background: var(--c-success-bg); color: #17603a; }
.cloze-input.incorrect { border-bottom-color: var(--c-error); background: var(--c-error-bg); color: #8f2f22; }

.cloze-grid { display: grid; gap: 10px; margin: 12px 0 6px; }
.cloze-row { display: grid; grid-template-columns: 1fr 200px; gap: 12px; align-items: center; border: 1.5px solid var(--c-border-soft); border-radius: var(--radius); padding: 12px 14px; background: #fff; }
@media (max-width: 640px) { .cloze-row { grid-template-columns: 1fr; } }
.cloze-text { font-size: 14.5px; line-height: 1.5; }
.cloze-row .cloze-input { width: 100%; min-width: 0; margin: 0; }

/* Matching (pairs) */
.matching-board { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 12px 0 8px; }
@media (max-width: 640px) { .matching-board { grid-template-columns: 1fr; } }
.match-col-label { font-family: var(--font-mono); font-size: 10.5px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--c-text-dim); margin-bottom: 8px; }
.match-card {
  display: flex; align-items: flex-start; gap: 12px;
  width: 100%; text-align: left;
  padding: 12px 14px; margin-bottom: 8px;
  border: 1.5px solid var(--c-border);
  border-radius: 8px;
  background: #fff;
  font-family: var(--font-body);
  font-size: 14px; line-height: 1.45;
  color: var(--c-text);
  cursor: pointer;
  transition: border-color 0.15s ease, background 0.15s ease;
}
.match-card:hover { border-color: var(--c-blue); }
.match-card .match-marker { flex: 0 0 auto; width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--c-border); display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 11.5px; font-weight: 700; color: var(--c-text-dim); }
.match-card.selected { border-color: var(--c-blue); background: var(--c-bg-tint); }
.match-card.paired { border-color: var(--c-blue-soft); background: var(--c-bg-soft); }
.match-card.paired .match-marker { background: var(--c-blue); border-color: var(--c-blue); color: #fff; }
.match-card.correct-pair { border-color: var(--c-success); background: var(--c-success-bg); }
.match-card.correct-pair .match-marker { background: var(--c-success); border-color: var(--c-success); color: #fff; }
.match-card.wrong-pair { border-color: var(--c-error); background: var(--c-error-bg); }
.match-card.wrong-pair .match-marker { background: var(--c-error); border-color: var(--c-error); color: #fff; }
.match-strong { font-weight: 700; color: var(--c-blue-dark); }

/* Video */
.video-wrap { position: relative; width: 100%; padding-top: 56.25%; border-radius: var(--radius); overflow: hidden; background: var(--c-bg-soft); border: 1px solid var(--c-border-soft); margin: 8px 0 12px; }
.video-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.intro-video { max-width: 720px; margin: 4px 0 22px; }
.final-video { max-width: 720px; margin: 0 0 22px; }
.final-video .video-wrap { margin-top: 0; }
.btn.btn-small { padding: 7px 12px; font-size: 13px; }
.intro-video .video-wrap { margin-top: 0; }
.fallback-line { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; font-size: 13.5px; color: var(--c-text-mute); margin-bottom: 26px; }

/* ============================================================
   LIBRARY ROOMS
   ============================================================ */

.library-banner { display: flex; gap: 14px; align-items: flex-start; background: var(--c-bg-tint); border: 1px solid var(--c-blue-soft); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 26px; }
.library-banner-icon { flex: 0 0 auto; width: 26px; height: 26px; color: var(--c-blue-deep); margin-top: 2px; }
.library-banner-text { font-size: 14px; line-height: 1.55; color: var(--c-blue-dark); }
.library-banner-text strong { font-weight: 800; }
.library-banner-text .warn { display: block; margin-top: 6px; font-weight: 700; color: #8f5b0a; }

.lib-section { margin-bottom: 30px; }
.lib-section-title { font-family: var(--font-display); font-size: 21px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 10px; color: var(--c-text); padding-left: 12px; border-left: 4px solid var(--c-blue); line-height: 1.25; }
.lib-section-lede { font-size: 15px; color: var(--c-text-mute); margin-bottom: 10px; }
.lib-section p { font-family: var(--font-serif); font-size: 17px; line-height: 1.72; color: var(--c-text); margin-bottom: 12px; max-width: 74ch; }
.lib-section p strong { font-weight: 600; color: var(--c-blue-dark); }
.lib-section p em { font-style: italic; }

.lib-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin: 12px 0 6px; }
.lib-grid.triple { grid-template-columns: repeat(3, 1fr); }
@media (max-width: 720px) { .lib-grid, .lib-grid.triple { grid-template-columns: 1fr; } }
.lib-card { background: var(--c-bg-soft); border: 1px solid var(--c-border-soft); border-radius: var(--radius); padding: 16px 18px; }
.lib-card.teal { background: var(--c-bg-tint); border-color: var(--c-blue-soft); }
.lib-card.muted { background: #fff; }
.lib-card-sub { font-family: var(--font-mono); font-size: 10.5px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--c-blue-deep); margin-bottom: 4px; }
.lib-card-title { font-family: var(--font-display); font-size: 16.5px; font-weight: 800; margin-bottom: 6px; letter-spacing: -0.01em; }
.lib-card-body { font-size: 14px; line-height: 1.55; color: var(--c-text); }
.lib-card-body strong { color: var(--c-blue-dark); }

.lib-table { width: 100%; border-collapse: collapse; margin: 10px 0 8px; font-size: 14.5px; }
.lib-table th { text-align: left; font-family: var(--font-mono); font-size: 10.5px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--c-blue-deep); padding: 8px 12px; border-bottom: 2px solid var(--c-blue-soft); background: var(--c-bg-tint); }
.lib-table td { padding: 11px 12px; border-bottom: 1px solid var(--c-border-soft); vertical-align: top; line-height: 1.5; }
.lib-table td:first-child { font-weight: 700; color: var(--c-blue-dark); width: 30%; }
.lib-table tr:nth-child(even) td { background: var(--c-bg-soft); }

.lib-bullets { list-style: none; padding: 0; margin: 8px 0 8px; }
.lib-bullets li { position: relative; padding-left: 22px; margin: 7px 0; font-size: 15px; line-height: 1.55; }
.lib-bullets li::before { content: ''; position: absolute; left: 4px; top: 10px; width: 8px; height: 8px; border-radius: 2px; background: var(--c-blue); }
.lib-bullets li strong { color: var(--c-blue-dark); }

.lib-quote { font-family: var(--font-serif); font-style: italic; font-size: 18px; line-height: 1.6; color: var(--c-blue-dark); border-left: 4px solid var(--c-blue-soft); padding: 6px 0 6px 18px; margin: 12px 0 8px; max-width: 70ch; }

.lib-note { background: var(--c-warn-bg); border: 1px solid #f1d9a3; border-radius: var(--radius); padding: 14px 18px; margin: 12px 0 6px; font-size: 14.5px; line-height: 1.6; }
.lib-note strong { color: #6b4a08; }

.lib-warning-bar { display: flex; gap: 14px; align-items: center; background: var(--c-warn-bg); border: 1px solid #f1d9a3; border-radius: var(--radius); padding: 14px 18px; margin-top: 8px; }
.lib-warning-bar .icon { flex: 0 0 auto; width: 24px; height: 24px; color: #b8791a; }
.lib-warning-bar .text { font-size: 14px; line-height: 1.5; color: #4d3708; }
.lib-warning-bar .text strong { font-weight: 800; }

/* ============================================================
   LETTER REVEAL OVERLAY
   ============================================================ */

.reveal-overlay { position: fixed; inset: 0; z-index: 200; background: rgba(255, 255, 255, 0.94); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
.reveal-overlay.show { opacity: 1; pointer-events: auto; }
.reveal-inner { text-align: center; padding: 32px; max-width: 520px; }
.reveal-letter { display: inline-flex; align-items: center; justify-content: center; width: 150px; height: 150px; border-radius: 50%; background: var(--c-blue); color: #fff; font-family: var(--font-display); font-size: 84px; font-weight: 800; box-shadow: 0 16px 40px rgba(59, 157, 221, 0.35); animation: letterReveal 0.6s cubic-bezier(0.16, 1, 0.3, 1) both; }
@keyframes letterReveal { from { transform: scale(0.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.reveal-caption { margin-top: 22px; font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--c-blue-deep); }
.reveal-progress { display: flex; justify-content: center; gap: 10px; margin-top: 18px; }
.reveal-progress-letter { width: 40px; height: 44px; border-radius: 8px; border: 1.5px solid var(--c-border); display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-size: 20px; font-weight: 800; color: var(--c-text-dim); background: #fff; }
.reveal-progress-letter.lit { border-color: var(--c-blue); background: var(--c-bg-tint); color: var(--c-blue-dark); }
.reveal-next { margin-top: 26px; }
@media (prefers-reduced-motion: reduce) { .reveal-letter { animation: none; } }

/* ============================================================
   FINAL SCREEN
   ============================================================ */

.final-hero { text-align: center; padding: 20px 0 36px; }
.final-code { font-family: var(--font-display); font-size: clamp(48px, 9vw, 96px); font-weight: 800; letter-spacing: 0.18em; color: var(--c-blue-deep); line-height: 1; margin: 10px 0 6px; }
.final-suffix { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--c-text-dim); }
.code-box { display: inline-block; margin-top: 18px; padding: 16px 26px; background: var(--c-bg-tint); border: 1px solid var(--c-blue-soft); border-radius: var(--radius); }
.code-box .code-label { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--c-blue-deep); }
.code-box .code-value { font-family: var(--font-mono); font-size: 30px; font-weight: 700; color: var(--c-blue-dark); letter-spacing: 0.06em; margin-top: 4px; }
/* ---- Download-Button (Übersichts-PDF) ---- */
.btn-download { display: inline-flex; align-items: center; gap: 10px; background: var(--c-blue-deep); color: #fff; border: none; border-radius: 10px; padding: 14px 22px; font-family: var(--font-body); font-size: 15.5px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 14px rgba(29,123,191,.35); transition: transform .15s ease, box-shadow .15s ease, background .15s ease; }
.btn-download:hover { background: var(--c-blue-dark); transform: translateY(-1px); box-shadow: 0 6px 18px rgba(29,123,191,.45); }
.btn-download:active { transform: translateY(0); }
.btn-download svg { width: 20px; height: 20px; flex: none; }

/* ---- Arena: das große Finale gegen den Feiditor (dunkel, dramatisch – bewusst unabhängig vom hellen Farbschema) ---- */
.arena{ background:radial-gradient(120% 90% at 50% 0%, #17223a 0%, #0b1220 55%, #070c16 100%); color:#e9eef7; border-radius:14px; padding:34px 28px 30px; margin-top:22px; box-shadow:0 18px 50px rgba(0,0,0,.45); border:1px solid rgba(255,255,255,.06); }
.arena-kicker{ font-family:var(--font-mono); font-size:11px; letter-spacing:.28em; text-transform:uppercase; color:#d6b25e; font-weight:600; text-align:center; }
.arena h2{ font-family:var(--font-display); font-size:30px; font-weight:700; color:#fff; text-align:center; margin:8px 0 10px; letter-spacing:.01em; }
.arena p{ max-width:620px; margin:0 auto 22px; text-align:center; font-size:15px; line-height:1.6; color:#b9c4d8; }
.arena-gate{ display:block; width:100%; max-width:760px; margin:0 auto; padding:0; border:0; background:transparent; cursor:pointer; position:relative; border-radius:12px; overflow:hidden; outline:none; }
.arena-gate svg{ display:block; width:100%; height:auto; }
.arena-gate .gate-glow{ opacity:0; transition:opacity .4s ease; }
.arena-gate:hover .gate-glow, .arena-gate:focus-visible .gate-glow{ opacity:1; }
.arena-gate .gate-field{ transition:filter .3s ease; }
.arena-gate:hover .gate-field{ filter:brightness(1.2); }
.arena-gate:focus-visible{ box-shadow:0 0 0 3px #d6b25e; }
.arena-cta{ position:absolute; left:50%; bottom:18px; transform:translateX(-50%); background:rgba(214,178,94,.95); color:#1a1305; font-family:var(--font-mono); font-size:11.5px; letter-spacing:.16em; text-transform:uppercase; font-weight:700; padding:9px 16px; border-radius:999px; box-shadow:0 6px 18px rgba(0,0,0,.5); white-space:nowrap; transition:transform .2s ease, background .2s ease; pointer-events:none; }
.arena-gate:hover .arena-cta{ transform:translateX(-50%) translateY(-2px); background:#f0cf78; }
.arena-foot{ text-align:center; font-size:12.5px; color:#7f8cab; margin-top:16px; }
@media (max-width:600px){ .arena{ padding:26px 16px 22px; } .arena h2{ font-size:24px; } .arena-cta{ font-size:10px; padding:8px 12px; } }

.gutachten { font-family: var(--font-serif); font-size: 16.5px; line-height: 1.7; background: var(--c-bg-soft); border: 1px solid var(--c-border-soft); border-radius: var(--radius); padding: 26px 30px; }
.gutachten .gutachten-head { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--c-blue-deep); margin-bottom: 10px; }
.gutachten .empty-field { display: block; margin-top: 10px; padding: 14px 16px; border: 2px dashed var(--c-blue-soft); border-radius: 8px; color: var(--c-text-dim); font-family: var(--font-body); font-size: 14px; }

/* Inputs (name screen) */
.field-label { display: block; font-family: var(--font-mono); font-size: 10.5px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--c-blue-deep); margin-bottom: 6px; }
.field-input { width: 100%; padding: 12px 14px; background: #fff; border: 1.5px solid var(--c-border); border-radius: 8px; color: var(--c-text); font-family: var(--font-body); font-size: 15px; }
.field-input:focus { outline: none; border-color: var(--c-blue); box-shadow: 0 0 0 3px var(--c-blue-soft); }
.field-error { display: none; margin-top: 14px; padding: 10px 14px; background: var(--c-error-bg); border-left: 3px solid var(--c-error); color: #8f2f22; font-size: 13.5px; border-radius: 6px; }

</style>
</head>

<!-- ==== Eingebetteter Feiditor (Digitales Arbeitsblatt) ==== -->
<script type="text/template" id="feiditor-src">
<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feiditor</title>
<style>
  :root{
    --paper:#f7f4ec; --paper2:#fffdf8; --ink:#221f1a; --muted:#6f675a;
    --line:#ddd5c4; --accent:#6b4f2c; --accent2:#8a6a3c; --shadow:rgba(40,30,15,.10);
    --serif:"Iowan Old Style","Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;
    --sans:"Avenir Next",Avenir,"Segoe UI","Helvetica Neue",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans);
    -webkit-font-smoothing:antialiased; line-height:1.5;
  }
  .screen{display:none; min-height:100vh}
  .screen.active{display:block}

  /* ---------- Start ---------- */
  #screen-start{display:none; place-items:center; padding:40px 20px}
  #screen-start.active{display:grid}
  .card{
    width:100%; max-width:440px; background:var(--paper2);
    border:1px solid var(--line); border-radius:14px; padding:40px 36px;
    box-shadow:0 18px 50px -28px var(--shadow);
  }
  .brand{font-family:var(--serif); font-size:13px; letter-spacing:.22em; text-transform:uppercase; color:var(--accent); margin:0 0 6px}
  .card h1{font-family:var(--serif); font-weight:600; font-size:30px; margin:0 0 4px; letter-spacing:.01em}
  .card p.sub{color:var(--muted); margin:0 0 26px; font-size:14.5px}
  label{display:block; font-size:12.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin:0 0 6px}
  .field{margin-bottom:18px}
  input[type=text]{
    width:100%; font-family:var(--serif); font-size:18px; color:var(--ink);
    background:var(--paper); border:1px solid var(--line); border-radius:9px;
    padding:11px 13px; outline:none; transition:border-color .15s, box-shadow .15s;
  }
  input[type=text]:focus{border-color:var(--accent2); box-shadow:0 0 0 3px rgba(138,106,60,.16)}
  .btn{
    font-family:var(--sans); font-size:15px; font-weight:600; letter-spacing:.01em;
    color:var(--paper2); background:var(--ink); border:1px solid var(--ink);
    border-radius:9px; padding:12px 18px; cursor:pointer; transition:transform .06s, background .15s;
  }
  .btn:hover{background:#332e25}
  .btn:active{transform:translateY(1px)}
  .btn.block{width:100%; margin-top:6px}
  .btn.ghost{background:transparent; color:var(--ink); border-color:var(--line)}
  .btn.ghost:hover{background:var(--paper)}
  .err{color:#b3261e; font-size:13.5px; min-height:18px; margin:2px 0 0}
  .foot{margin-top:24px; padding-top:16px; border-top:1px solid var(--line); text-align:center}
  .foot a{color:var(--muted); font-size:12.5px; text-decoration:none; letter-spacing:.04em}
  .foot a:hover{color:var(--accent); text-decoration:underline}

  /* ---------- Editor ---------- */
  #screen-editor{display:none; flex-direction:column; height:100vh}
  #screen-editor.active{display:flex}
  .topbar{
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding:13px 22px; border-bottom:1px solid var(--line); background:var(--paper2);
  }
  .who{font-family:var(--serif); font-size:16px}
  .who .lbl{font-family:var(--sans); font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); margin-right:8px}
  .count{font-size:12.5px; color:var(--muted); font-variant-numeric:tabular-nums}
  .paperwrap{flex:1; overflow:auto; display:flex; flex-direction:column; align-items:center; padding:34px 20px 150px}
  .sheet{
    width:100%; max-width:760px; background:var(--paper2); border:1px solid var(--line);
    border-radius:6px; box-shadow:0 24px 60px -40px var(--shadow); padding:56px 60px;
  }
  #editor{
    width:100%; min-height:60vh; border:0; outline:0; background:transparent;
    font-family:var(--serif); font-size:18.5px; line-height:1.78; color:var(--ink);
    white-space:pre-wrap; word-wrap:break-word; overflow-wrap:anywhere;
  }
  #editor:focus{outline:0}
  #editor .heading{font-weight:700; font-size:2em; line-height:1.25; margin:.1em 0}
  #editor.empty::before{content:attr(data-placeholder); color:#b9b0a0; pointer-events:none}

  /* ---------- Formatierungsleiste (Word-artig) ---------- */
  .formatbar{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    padding:9px 22px; border-bottom:1px solid var(--line); background:var(--paper2);
  }
  .fbtn{
    font-family:var(--sans); font-size:15px; min-width:38px; height:34px; padding:0 11px;
    color:var(--ink); background:var(--paper); border:1px solid var(--line); border-radius:8px;
    cursor:pointer; display:inline-flex; align-items:center; justify-content:center;
    transition:background .12s, border-color .12s, color .12s; user-select:none;
  }
  .fbtn:hover{background:#efe9dd}
  .fbtn:active{transform:translateY(1px)}
  .fbtn.active{background:var(--accent); color:var(--paper2); border-color:var(--accent)}
  .fbtn.wide{font-size:13.5px; letter-spacing:.02em}
  .fbtn .b{font-weight:800}
  .fbtn .i{font-style:italic}
  .fbtn .u{text-decoration:underline}
  .fsep{width:1px; height:22px; background:var(--line); margin:0 3px}
  .actionbar{
    position:fixed; left:0; right:0; bottom:0; display:flex; justify-content:center;
    padding:16px 16px 46px; background:linear-gradient(to top, var(--paper) 60%, rgba(247,244,236,0));
  }
  .copyright{
    position:fixed; left:0; right:0; bottom:13px; text-align:center;
    font-size:11px; letter-spacing:.05em; color:var(--muted); pointer-events:none; z-index:6;
  }

  /* ---------- Lehrkraft ---------- */
  #screen-teacher{display:none; place-items:start center; padding:40px 20px 80px}
  #screen-teacher.active{display:grid}
  .panel{width:100%; max-width:920px}
  .panel h1{font-family:var(--serif); font-weight:600; font-size:26px; margin:0 0 4px}
  .panel .sub{color:var(--muted); margin:0 0 22px; font-size:14.5px}
  .drop{
    background:var(--paper2); border:1.5px dashed var(--line); border-radius:12px;
    padding:26px; text-align:center; color:var(--muted); font-size:14.5px;
  }
  .drop strong{color:var(--ink)}
  .row{display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin-top:14px}
  input[type=password]{
    font-family:var(--serif); font-size:18px; letter-spacing:.12em; width:180px;
    background:var(--paper); border:1px solid var(--line); border-radius:9px; padding:10px 12px; outline:none;
  }
  input[type=password]:focus{border-color:var(--accent2); box-shadow:0 0 0 3px rgba(138,106,60,.16)}
  .hidden{display:none !important}
  .backlink{display:inline-block; margin-bottom:18px; color:var(--muted); font-size:13px; text-decoration:none}
  .backlink:hover{color:var(--accent)}

  /* analysis */
  .legend{display:flex; gap:18px; flex-wrap:wrap; margin:20px 0 14px; font-size:13.5px; color:var(--muted)}
  .legend span{display:inline-flex; align-items:center; gap:7px}
  .sw{width:13px; height:13px; border-radius:3px; display:inline-block}
  .stat{font-size:13px; color:var(--muted); margin:0 0 16px; font-variant-numeric:tabular-nums}
  .analysis{
    background:var(--paper2); border:1px solid var(--line); border-radius:10px;
    padding:30px 34px; font-family:var(--serif); font-size:17.5px; line-height:1.85;
    white-space:pre-wrap; word-wrap:break-word; overflow-wrap:anywhere;
  }
  .nmeta{font-family:var(--sans); font-size:12.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin-bottom:14px}
  .redbadge{
    display:inline-block; font-family:var(--sans); font-size:14px; font-weight:600; letter-spacing:.02em;
    background:var(--paper2); border:1px solid var(--line); border-radius:9px; padding:8px 14px;
    margin:0 0 6px; font-variant-numeric:tabular-nums;
  }
  .redbadge.high{color:#b3261e; border-color:#b3261e; font-weight:800}
  .codefor{font-size:13.5px; color:var(--muted); margin:14px 0 0}

  /* Tabellenansicht (Mehrfach-Upload) */
  .batchsum{font-size:13px; color:var(--muted); margin:18px 0 10px; font-variant-numeric:tabular-nums}
  .tablewrap{border:1px solid var(--line); border-radius:10px; overflow:auto; background:var(--paper2)}
  table.batch{width:100%; border-collapse:collapse; font-size:15px}
  table.batch th{
    font-family:var(--sans); font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted);
    font-weight:600; text-align:left; padding:10px 14px; border-bottom:1px solid var(--line); background:var(--paper);
  }

function buildPdf(opts){
  const PW=595.28,PH=841.89, ML=56,MR=56,MT=56,MB=64;
  const HEAD_SIZE=13, BODY_SIZE=11, HEAD2_SIZE=22, NOTE_SIZE=11;
  const BODY_LEAD=15.5, HEAD_LEAD=28;
  const usableW=PW-ML-MR;
  const headerBaseline=PH-MT-HEAD_SIZE, ruleY=headerBaseline-6, bodyTop=ruleY-22, bodyBottom=MB+24;

  const text=opts.text||""; const fmt=opts.fmt||[];
  // in Absätze an '\n' teilen
  const paras=[]; { let cur=[]; for(let i=0;i<text.length;i++){ const ch=text[i]; if(ch==="\n"){paras.push(cur);cur=[];} else { const ft=fmt[i]||{}; cur.push({ch,b:!!ft.b,i:!!ft.i,u:!!ft.u,h:!!ft.h}); } } paras.push(cur); }

  // Anzeigezeilen mit Größe/Durchschuss
  const dispLines=[];
  for(const para of paras){
    const heading=para.length?para[0].h:false;
    const size=heading?HEAD2_SIZE:BODY_SIZE;
    const lead=heading?HEAD_LEAD:BODY_LEAD;
    if(para.length===0){ dispLines.push({runs:[],size:BODY_SIZE,lead:BODY_LEAD}); continue; }
    const wrapped=wrapPara(para,size,usableW);
    for(const wl of wrapped) dispLines.push({runs:lineToRuns(wl),size,lead});
  }
  if(dispLines.length===0) dispLines.push({runs:[],size:BODY_SIZE,lead:BODY_LEAD});

  // Seiten füllen
  const pages=[]; let idx=0;
  while(idx<dispLines.length){
    const pageLines=[]; let y=bodyTop;
    while(idx<dispLines.length && y>=bodyBottom){ const dl=dispLines[idx]; pageLines.push({dl,y}); y-=dl.lead; idx++; }
    if(pageLines.length===0){ pageLines.push({dl:dispLines[idx],y:bodyTop}); idx++; }
    pages.push({lines:pageLines});
  }
  const nPages=pages.length;
  // Übersichts-Seiten (aus dem Escape-Room) werden hinter die Aufgaben-Seiten gehängt
  const ovStreams=(opts.overview&&typeof buildOverviewPages==="function")?buildOverviewPages(opts.overview):[];
  const nAll=nPages+ovStreams.length;

  const noteText="Bitte diese PDF-Datei herunterladen und bei Moodle hochladen.";
  const noteLines=[]; { // Hinweis ist immer normal/unformatiert
    const arr=noteText.split("").map(ch=>({ch,b:false,i:false,u:false}));
    for(const wl of wrapPara(arr,NOTE_SIZE,usableW)) noteLines.push(lineToRuns(wl));
  }
  const noteBottom=46;

  const pageObjNum=(i)=>7+i*2, contObjNum=(i)=>8+i*2;
  const objects={};
  objects[1]="<< /Type /Catalog /Pages 2 0 R >>";
  objects[2]=`<< /Type /Pages /Count ${nAll} /Kids [${Array.from({length:nAll},(_,i)=>`${pageObjNum(i)} 0 R`).join(" ")}] >>`;
  objects[3]="<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>";
  objects[4]="<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>";
  objects[5]="<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Oblique /Encoding /WinAnsiEncoding >>";
  objects[6]="<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-BoldOblique /Encoding /WinAnsiEncoding >>";

  for(let i=0;i<nPages;i++){
    objects[pageObjNum(i)]=`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW.toFixed(2)} ${PH.toFixed(2)}] /Resources << /Font << /F1 3 0 R /F2 4 0 R /F3 5 0 R /F4 6 0 R >> >> /Contents ${contObjNum(i)} 0 R >>`;
    let s="0.5 w\n";
    // Name + Linie
    s+=`BT /F1 ${HEAD_SIZE} Tf 0 0 0 rg ${ML} ${headerBaseline.toFixed(2)} Td (${encStr(opts.name||"")}) Tj ET\n`;
    s+=`${ML} ${ruleY.toFixed(2)} m ${(PW-MR).toFixed(2)} ${ruleY.toFixed(2)} l S\n`;
    // Textzeilen
    const underlines=[];
    for(const pl of pages[i].lines){
      const dl=pl.dl, y=pl.y;
      if(dl.runs.length){
        s+=`BT 1 0 0 1 ${ML.toFixed(2)} ${y.toFixed(2)} Tm 0 0 0 rg\n`;
        let x=ML;
        for(const run of dl.runs){
          const fn=fontFor(run.b,run.i);
          s+=`/${fn} ${dl.size} Tf (${encStr(run.text)}) Tj\n`;
          const rw=runWidth(run.text,run.b,dl.size);
          if(run.u){ underlines.push({x1:x,x2:x+rw,y:y-dl.size*0.12,lw:Math.max(0.5,dl.size*0.06)}); }
          x+=rw;
        }
        s+="ET\n";
      }
    }
    for(const ul of underlines){
      s+=`${ul.lw.toFixed(2)} w 0 0 0 RG ${ul.x1.toFixed(2)} ${ul.y.toFixed(2)} m ${ul.x2.toFixed(2)} ${ul.y.toFixed(2)} l S\n`;
    }
    // roter Hinweis nur auf der letzten Seite
    if(i===nPages-1){
      let yy=noteBottom+(noteLines.length-1)*BODY_LEAD;
      for(const runs of noteLines){
        s+=`BT 1 0 0 1 ${ML.toFixed(2)} ${yy.toFixed(2)} Tm 0.78 0.05 0.05 rg\n`;
        for(const run of runs){ s+=`/F1 ${NOTE_SIZE} Tf (${encStr(run.text)}) Tj\n`; }
        s+="ET\n";
        yy-=BODY_LEAD;
      }
    }
    objects[contObjNum(i)]={stream:s};
  }

  // Übersichts-Seiten anhängen (Content-Streams nutzen /F1 und /F2, die oben definiert sind)
  for(let k=0;k<ovStreams.length;k++){
    const i=nPages+k;
    objects[pageObjNum(i)]=`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW.toFixed(2)} ${PH.toFixed(2)}] /Resources << /Font << /F1 3 0 R /F2 4 0 R /F3 5 0 R /F4 6 0 R >> >> /Contents ${contObjNum(i)} 0 R >>`;
    objects[contObjNum(i)]={stream:ovStreams[k]+"\n"};
  }

  let pdf="%PDF-1.7\n%\u00E2\u00E3\u00CF\u00D3\n";
  if(opts.trackB64) pdf+=`%TRACKDATA ${opts.trackB64}\n`;
  const offsets={}; const maxNum=6+nAll*2;
  for(let n=1;n<=maxNum;n++){
    offsets[n]=pdf.length; const o=objects[n];
    if(o&&o.stream!==undefined){const st=o.stream;pdf+=`${n} 0 obj\n<< /Length ${st.length} >>\nstream\n${st}endstream\nendobj\n`;}
    else pdf+=`${n} 0 obj\n${o}\nendobj\n`;
  }
  const xrefStart=pdf.length;
  pdf+=`xref\n0 ${maxNum+1}\n0000000000 65535 f \n`;
  for(let n=1;n<=maxNum;n++) pdf+=String(offsets[n]).padStart(10,"0")+" 00000 n \n";
  pdf+=`trailer\n<< /Size ${maxNum+1} /Root 1 0 R >>\nstartxref\n${xrefStart}\n%%EOF`;
  return pdf;
}

/* ---------------- gemeinsame Krypto- & Auswertungs-Funktionen ---------------- *
 * Diese werden per toString() in die Lehrkraft-Seite (data:-Link) eingebettet,  *
 * damit es nur EINE Quelle der Wahrheit gibt.                                   */
function bytesToB64(bytes){let bin="";const CH=0x8000;for(let i=0;i<bytes.length;i+=CH)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+CH));return btoa(bin);}
function b64ToBytes(b64){const bin=atob(b64);const out=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)out[i]=bin.charCodeAt(i);return out;}
async function _key(codeStr,usage){const mat=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(codeStr));return crypto.subtle.importKey("raw",mat,{name:"AES-GCM"},false,usage);}
async function aesEncrypt(plain,codeStr){const iv=crypto.getRandomValues(new Uint8Array(12));const key=await _key(codeStr,["encrypt"]);const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},key,new TextEncoder().encode(plain));return bytesToB64(iv)+":"+bytesToB64(new Uint8Array(ct));}
async function aesDecrypt(bundle,codeStr){const parts=bundle.split(":");const iv=b64ToBytes(parts[0]);const ct=b64ToBytes(parts[1]);const key=await _key(codeStr,["decrypt"]);const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv},key,ct);return new TextDecoder().decode(pt);}
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));}
function classify(isVisible,src,gap){
  const COL={plain:"#23201b",paste:"#b3261e",fast:"#c2710c",slow:"#1f7a34",system:"#23201b"};
  if(src==="s") return COL.system;           // System-Text (vorbefüllte Aufgaben) -> schwarz wie normaler Text, nie farbig
  if(!isVisible) return COL.plain;
  if(src==="p") return COL.paste;            // aus Zwischenablage -> rot
  if(gap>=0&&gap<=15) return COL.paste;      // <= 0,015 s getippt -> rot
  if(gap>15&&gap<=70) return COL.fast;       // 0,015-0,07 s -> orange
  return COL.slow;                           // > 0,07 s / erstes Zeichen -> grün
}
const RED_LIMIT=50; // Rot-Anteil strikt ÜBER diesem Wert wird rot und fett hervorgehoben
/* Zählt sichtbare, nicht vorbefüllte Zeichen nach Farbe – EINE Formel für Einzelansicht, Export und Tabelle */
function computeStats(t,m){
  const WS=/\s/; let total=0,red=0,orange=0,green=0;
  for(let i=0;i<t.length;i++){
    const ch=t[i]; const isV=!WS.test(ch);
    const mark=m[i]||["t",-1]; const col=classify(isV,mark[0],mark[1]);
    if(isV && mark[0]!=="s"){ total++;
      if(col==="#b3261e") red++;
      else if(col==="#c2710c") orange++;
      else green++;
    }
  }
  const pct=(x)=>total?Math.round(x/total*100):0;
  return {total,red,orange,green,redPct:pct(red),orangePct:pct(orange),greenPct:pct(green)};
}
function renderAnalysis(payload){
  const t=payload.t, m=payload.m||[], f=payload.f||[];
  let html="";
  const WS=/\s/;
  for(let i=0;i<t.length;i++){
    const ch=t[i]; const isV=!WS.test(ch);
    const mark=m[i]||["t",-1]; const src=mark[0]; const gap=mark[1];
    const col=classify(isV,src,gap);
    const fl=f[i]||0; let st="color:"+col;
    if(fl&8){ st+=";font-weight:700;font-size:1.6em"; } else if(fl&1){ st+=";font-weight:700"; }
    if(fl&2) st+=";font-style:italic";
    if(fl&4) st+=";text-decoration:underline";
    html+=`<span style="${st}">${esc(ch)}</span>`;
  }
  const s=computeStats(t,m);
  // gespeicherter Rot-Anteil aus der PDF; ältere PDFs ohne Wert: aus den Tracking-Daten berechnet
  const rp=(typeof payload.r==="number"&&isFinite(payload.r))?payload.r:s.redPct;
  const badge=`<div class="redbadge${rp>RED_LIMIT?" high":""}">Rot-Anteil: ${rp} %</div>`;
  const legend=
    '<div class="legend">'+
      '<span><i class="sw" style="background:#b3261e"></i>eingefügt oder ≤ 0,015 s getippt</span>'+
      '<span><i class="sw" style="background:#c2710c"></i>0,015–0,07 s nach vorherigem Zeichen getippt</span>'+
      '<span><i class="sw" style="background:#1f7a34"></i>&gt; 0,07 s nach vorherigem Zeichen getippt</span>'+
    '</div>';
  const stat=`<p class="stat">Zeichen gesamt: ${s.total} · rot: ${s.red} (${s.redPct} %) · orange: ${s.orange} (${s.orangePct} %) · grün: ${s.green} (${s.greenPct} %)</p>`;
  const head=`<div class="nmeta">Verfasser:in — ${esc(payload.n||"")}</div>`;
  return head+badge+legend+stat+`<div class="analysis">${html}</div>`;
}

/* ----------------------- geheime Code-Bildung (Lehrkraft) ----------------------- */
function _kfN(n){return String(n*(0x230+0x220));}          // Code aus Buchstabenzahl
function _kf(s){const n=(s.match(/\p{L}/gu)||[]).length;return _kfN(n);}

/* ------------------------------ Tracking ------------------------------ */
let prevValue="";
let recs=[];          // pro Zeichen: {src:'t'|'p', t:ms}
let justPasted=false; // wird durch paste/drop gesetzt, nach einem input-Event geleert

function reconcile(newVal,pasted,now){
  const a=prevValue,b=newVal; const minL=Math.min(a.length,b.length);
  let p=0; while(p<minL&&a[p]===b[p])p++;
  let s=0; while(s<minL-p&&a[a.length-1-s]===b[b.length-1-s])s++;
  const removed=a.length-p-s;
  const inserted=b.slice(p,b.length-s);
  const ins=inserted.split("").map(()=>({src:pasted?"p":"t",t:now}));
  recs.splice(p,removed,...ins);
  if(recs.length!==b.length){ // Sicherheitsnetz gegen Desync: Tipp-Info unbekannt (t=-1), nie fälschlich rot
    recs=b.split("").map(()=>({src:"t",t:-1}));
  }
  prevValue=newVal;
}

let systemSnippets=[]; // vorgeschriebene Textbausteine (Aufgabenlabels + Aufgabentexte) – immer System-Text
function markSystemByContent(text,m){
  // Markiert jedes Vorkommen eines vorgeschriebenen Bausteins als System ("s"), unabhängig vom
  // Tracking-Zustand. So werden Aufgabenstellungen nie farbig (rot/orange/grün) ausgewertet.
  for(const snip of systemSnippets){
    if(!snip) continue;
    let from=0, idx;
    while((idx=text.indexOf(snip,from))!==-1){
      for(let i=idx;i<idx+snip.length;i++){ if(m[i]) m[i][0]="s"; }
      from=idx+snip.length;
    }
  }
}
function buildPayload(name,text,fmt,vn,nn){
  if(recs.length!==text.length){ // letzte Absicherung: Tipp-Info verloren -> Abstand unbekannt (nie fälschlich rot)
    recs=text.split("").map(()=>({src:"t",t:-1}));
  }
  fmt=fmt||[];
  const m=[]; const f=[];
  for(let i=0;i<text.length;i++){
    const gap=(i===0||recs[i].t<0||recs[i-1].t<0)?-1:(recs[i].t-recs[i-1].t);
    m.push([recs[i].src,gap]);
    const ft=fmt[i]||{};
    let bits=0; if(ft.b)bits|=1; if(ft.i)bits|=2; if(ft.u)bits|=4; if(ft.h)bits|=8;
    f.push(bits);
  }
  markSystemByContent(text,m);   // vorgeschriebene Aufgaben: immer System, nie farbig
  const r=computeStats(text,m).redPct; // Rot-Anteil in Prozent, wie ihn die Lehrkraft-Ansicht zeigt
  return {n:name,t:text,m,f,vn:vn||"",nn:nn||"",r};
}

function sanitize(s){return (s||"").replace(/[^\p{L}\p{N}_-]/gu,"_").slice(0,40)||"Datei";}
function asciiName(s){
  return (s||"")
    .replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue")
    .replace(/Ä/g,"Ae").replace(/Ö/g,"Oe").replace(/Ü/g,"Ue").replace(/ß/g,"ss")
    .normalize("NFKD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^A-Za-z0-9_-]/g,"_").replace(/_+/g,"_").replace(/^_|_$/g,"")
    .slice(0,40) || "Datei";
}
function fileSafe(s){return (s||"").replace(/[\/\\:*?"<>|\u0000-\u001f]/g,"").replace(/\s+/g," ").trim().slice(0,90)||"Datei";}
function downloadBlob(blob,filename){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),5000);
}

/* ---------- Escape-Room-Modus: aus hochgeladener Überblick-PDF rekonstruieren ---------- */
function buildPrefill(tasks){
  const lines=[];
  tasks.forEach((task,i)=>{
    lines.push("Aufgabe "+(i+1));
    lines.push(task);
    for(let k=0;k<8;k++) lines.push("");   // 8 Leerzeilen Lösungsraum
  });
  return lines.join("\n");
}
function startEscapeMode(v,n,tasks,red){
  studentVorname=(v||"").trim(); studentNachname=(n||"").trim();
  $("who-name").textContent=(studentVorname+" "+studentNachname).trim();
  escapeRed=Array.isArray(red)?red:[];
  // Vorgeschriebene Bausteine merken: Aufgabenlabels + Aufgabentexte -> beim Export immer System-Text
  systemSnippets=[];
  if(Array.isArray(tasks)) tasks.forEach((task,i)=>{ systemSnippets.push("Aufgabe "+(i+1)); if(task) systemSnippets.push(String(task)); });
  const prefill=(Array.isArray(tasks)&&tasks.length)?buildPrefill(tasks):"";
  const now=Date.now();
  setEditorText(prefill); prevValue=prefill;
  recs=prefill.split("").map(()=>({src:"s",t:now}));   // vorbefüllter Text = System (grau, nicht gezählt)
  renderMoodleHints();
  updateCharcount();
  show("screen-editor");
  setTimeout(()=>{
    ed.focus();
    // Cursor in die erste leere Lösungszeile setzen
    const pf=prefill.split("\n");
    let bi=pf.indexOf(""); if(bi<0) bi=pf.length-1;
    const blocks=Array.prototype.filter.call(ed.childNodes,n=>n.nodeType===1);
    placeCaretAtBlockStart(blocks[bi]||blocks[blocks.length-1]);
  },50);
}
function readEscapePdf(file){
  $("esc-err").textContent="";
  const fr=new FileReader();
  fr.onload=()=>{
    const bytes=new Uint8Array(fr.result);
    let str=""; for(let i=0;i<bytes.length;i++) str+=String.fromCharCode(bytes[i]);
    const mm=str.match(/%ESCAPEDATA (\S+)/);
    if(!mm){$("esc-err").textContent="In dieser PDF wurden keine Escape-Room-Daten gefunden. Bitte lade die Überblick-PDF aus dem Escape-Room hoch.";return;}
    let d;
    try{ d=JSON.parse(decodeURIComponent(escape(atob(mm[1])))); }
    catch(e){ $("esc-err").textContent="Die Escape-Room-Daten konnten nicht gelesen werden."; return; }
    startEscapeMode(d.v,d.n,d.t,d.r);
  };
  fr.onerror=()=>{$("esc-err").textContent="Datei konnte nicht gelesen werden.";};
  fr.readAsArrayBuffer(file);
}
$("esc-input").addEventListener("change",e=>{const f=e.target.files[0];if(f)readEscapePdf(f);});

["dragover","dragenter"].forEach(ev=>escDrop.addEventListener(ev,e=>{e.preventDefault();escDrop.style.borderColor="#8a6a3c";}));

/* ---------- Rich-Text-Editor: Serialisierung & Formatierung ---------- */
/* Read-only: liest den contenteditable-Inhalt als {text, fmt} aus, OHNE das DOM
   oder den Cursor zu verändern. Inline-Formatierung ändert den Text nicht, nur fmt –
   dadurch bleiben die Tipp-Tempo-Daten (recs) über Formatierungen hinweg erhalten. */
function serializeEditor(){
  const root=$("editor");
  const chars=[]; const fmt=[];
  function isBlock(node){ return node.nodeType===1 && /^(DIV|P|H[1-6]|LI|BLOCKQUOTE|PRE)$/.test(node.tagName); }
  function lastIsNL(){ return chars.length===0 || chars[chars.length-1]==="\n"; }
  function pushCh(ch,st){ chars.push(ch); fmt.push({b:st.b,i:st.i,u:st.u,h:st.h}); }
  function lastChildOfBlock(node){
    const p=node.parentNode; return p && isBlock(p) && p.childNodes[p.childNodes.length-1]===node;
  }
  function walk(node, st){
    const kids=node.childNodes||[];
    for(let k=0;k<kids.length;k++){
      const child=kids[k];
      if(child.nodeType===3){
        const s=child.nodeValue||"";
        for(const ch of s) pushCh(ch, st);
      } else if(child.nodeType===1){
        const tag=child.tagName;
        if(tag==="BR"){
          if(lastChildOfBlock(child)){ /* Platzhalter-<br> -> kein Umbruch */ }
          else pushCh("\n", st);
          continue;
        }
        const ns={b:st.b,i:st.i,u:st.u,h:st.h};
        if(tag==="B"||tag==="STRONG") ns.b=true;
        if(tag==="I"||tag==="EM") ns.i=true;
        if(tag==="U"||tag==="INS") ns.u=true;
        const sty=child.style||{};
        const fw=sty.fontWeight; if(fw==="bold"||fw==="bolder"||(fw&&parseInt(fw,10)>=600)) ns.b=true;
        const fst=sty.fontStyle; if(fst&&String(fst).indexOf("italic")>=0) ns.i=true;
        const td=(sty.textDecorationLine||sty.textDecoration||""); if(String(td).indexOf("underline")>=0) ns.u=true;
        if(child.classList&&child.classList.contains("heading")){ ns.h=true; ns.b=true; }
        if(/^H[1-6]$/.test(tag)){ ns.h=true; ns.b=true; }
        try{ const cs=getComputedStyle(child); if(cs){ const w=cs.fontWeight; if(w==="bold"||w==="bolder"||(parseInt(w,10)>=600)) ns.b=true; if(String(cs.fontStyle||"").indexOf("italic")>=0) ns.i=true; } }catch(e){}
        if(isBlock(child) && !lastIsNL()) pushCh("\n", st);
        walk(child, ns);
      }
    }
  }
  walk(root, {b:false,i:false,u:false,h:false});
  return { text: chars.join(""), fmt };
}

/* Baut den Editor-Inhalt aus reinem Text neu auf (jede Zeile = ein Block-DIV). */
function setEditorText(plain){
  const root=$("editor"); root.innerHTML="";
  const lines=String(plain||"").split("\n");
  for(const line of lines){
    const div=document.createElement("div");
    if(line==="") div.appendChild(document.createElement("br"));
    else div.appendChild(document.createTextNode(line));
    root.appendChild(div);
  }
  if(root.childNodes.length===0){ const d=document.createElement("div"); d.appendChild(document.createElement("br")); root.appendChild(d); }
  updateEmpty();
}

/* Platzhalter ein-/ausblenden (CSS: #editor.empty::before) */
function updateEmpty(){
  const root=$("editor");
  root.classList.toggle("empty", serializeEditor().text.length===0);
}

/* Den Block (oberste DIV-Ebene im Editor), in dem ein Knoten liegt. */
function blockOf(node){
  const root=$("editor"); if(!node) return null;
  if(node===root){ return null; }
  let n=node;
  while(n && n.parentNode!==root) n=n.parentNode;
  return (n && n.parentNode===root && n.nodeType===1) ? n : null;
}
/* Alle Blöcke, die von der aktuellen Auswahl berührt werden. */
function selectedBlocks(){
  const root=$("editor"); const sel=window.getSelection();
  if(!sel||sel.rangeCount===0) return [];
  const r=sel.getRangeAt(0);
  let a=blockOf(r.startContainer), b=blockOf(r.endContainer);
  const blocks=Array.prototype.filter.call(root.childNodes,n=>n.nodeType===1);
  if(!a) a=blocks[0]; if(!b) b=blocks[blocks.length-1];
  if(!a||!b) return [];
  const ia=blocks.indexOf(a), ib=blocks.indexOf(b);
  if(ia<0||ib<0) return [];
  const lo=Math.min(ia,ib), hi=Math.max(ia,ib);
  return blocks.slice(lo,hi+1);
}
/* Überschrift für die ausgewählten Blöcke umschalten. */
function toggleHeading(){
  const blocks=selectedBlocks(); if(!blocks.length) return;
  const allHead=blocks.every(b=>b.classList.contains("heading"));
  blocks.forEach(b=>{ if(allHead) b.classList.remove("heading"); else b.classList.add("heading"); });
  $("editor").focus();
  updateFormatButtons();
}
/* Button-Zustände an die aktuelle Auswahl/Cursorposition anpassen. */
function updateFormatButtons(){
  const q=(c)=>{ try{ return document.queryCommandState(c); }catch(e){ return false; } };
  $("fb-bold").classList.toggle("active", q("bold"));
  $("fb-italic").classList.toggle("active", q("italic"));
  $("fb-underline").classList.toggle("active", q("underline"));
  const blocks=selectedBlocks();
  const head = blocks.length>0 && blocks.every(b=>b.classList.contains("heading"));
  $("fb-heading").classList.toggle("active", head);
}
/* Inline-Befehl (bold/italic/underline) ausführen; Auswahl bleibt erhalten. */
function execInline(cmd){
  $("editor").focus();
  try{ document.execCommand(cmd,false,null); }catch(e){}
  updateFormatButtons();
  updateEmpty();
}
/* Cursor an den Anfang eines Blocks setzen. */
function placeCaretAtBlockStart(block){
  if(!block) return;
  const sel=window.getSelection(); const r=document.createRange();
  r.setStart(block,0); r.collapse(true);
  sel.removeAllRanges(); sel.addRange(r);
}

/* Editor-Tracking */
const ed=$("editor");
ed.addEventListener("paste",(e)=>{
  // Nur reinen Text einfügen, damit das DOM sauber bleibt (keine fremde Formatierung)
  if(e.clipboardData){
    e.preventDefault();
    const txt=e.clipboardData.getData("text/plain");
    justPasted=true;
    try{ document.execCommand("insertText",false,txt); }
    catch(err){ justPasted=true; }
  } else { justPasted=true; }
});
ed.addEventListener("drop",()=>{justPasted=true;});
ed.addEventListener("keydown",(e)=>{
  // Strg/Cmd+B/I/U: Browser formatiert selbst; danach Button-Status aktualisieren
  if((e.ctrlKey||e.metaKey)&&!e.altKey){
    const k=e.key.toLowerCase();
    if(k==="b"||k==="i"||k==="u"){ setTimeout(()=>{ updateFormatButtons(); updateEmpty(); },0); }
  }
  // Enter in einer Überschrift: neue Zeile soll normal sein
  if(e.key==="Enter"){
    setTimeout(()=>{
      const blocks=selectedBlocks();
      blocks.forEach(b=>{ const txt=(b.textContent||"").replace(/\u200B/g,""); if(b.classList.contains("heading")&&txt==="") b.classList.remove("heading"); });
      updateFormatButtons();
    },0);
  }
});
ed.addEventListener("input",()=>{
  reconcile(serializeEditor().text,justPasted,Date.now());
  justPasted=false;
  updateCharcount();
  updateEmpty();
});
ed.addEventListener("keyup",updateFormatButtons);
ed.addEventListener("mouseup",updateFormatButtons);
document.addEventListener("selectionchange",()=>{ if(document.activeElement===$("editor")) updateFormatButtons(); });

/* Export: erzeugt NUR die Text-PDF (mit rotem Moodle-Hinweis); die Tracking-Daten stecken
   verschlüsselt als %TRACKDATA in der PDF und sind über „Lehrkraft → PDF laden + Code" auslesbar */
$("export-btn").addEventListener("click",async()=>{
  const btn=$("export-btn"); const ser=serializeEditor(); const text=ser.text; const fmt=ser.fmt;
  const name=studentVorname+" "+studentNachname;
  btn.disabled=true; const old=btn.textContent; btn.textContent="Erzeuge PDF…";
  try{
    const payload=buildPayload(name,text,fmt,studentVorname,studentNachname);
    const code=_kf(studentVorname);
    const bundle=await aesEncrypt(JSON.stringify(payload),code);

    const pdfName=fileSafe("Escape Room Daten von "+studentVorname+" "+studentNachname)+".pdf";

    // PDF: Aufgaben-Seiten (formatierter Text + roter Moodle-Hinweis) + Übersichts-Seiten aus dem Escape-Room;
    // Tracking-Daten stecken (verschlüsselt) als %TRACKDATA drin
    const overview=(window.__ESCAPE_DATA__&&window.__ESCAPE_DATA__.overview)||null;
    const pdfStr=buildPdf({name,text,fmt,trackB64:bundle,overview});
    const u8=new Uint8Array(pdfStr.length);
    for(let i=0;i<pdfStr.length;i++)u8[i]=pdfStr.charCodeAt(i)&0xFF;

    downloadBlob(new Blob([u8],{type:"application/octet-stream"}), pdfName); // octet-stream: erzwingt Speichern statt Anzeigen

    btn.textContent="PDF erstellt ✓";
    setTimeout(()=>{ btn.textContent=old; }, 2200);
  }catch(err){ alert("Fehler beim Erzeugen der PDF: "+err.message); btn.textContent=old; }
  finally{ btn.disabled=false; }
});

/* Lehrkraft: PDF laden + Code (Einzelansicht) bzw. mehrere PDFs (Tabellenansicht) */
let teacherBundle=null;
let batchRows=[];        // Zeilen der Tabellenansicht
let batchSelected=null;  // in der Tabelle angeklickte Zeile
const TRACK_RE=/%TRACKDATA (\S+)/;

function readAsBinaryStr(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{const u=new Uint8Array(fr.result);let s="";const CH=0x8000;for(let i=0;i<u.length;i+=CH)s+=String.fromCharCode.apply(null,u.subarray(i,i+CH));res(s);};
    fr.onerror=()=>rej(new Error("Datei konnte nicht gelesen werden."));
    fr.readAsArrayBuffer(file);
  });
}
function setCodeFor(text){
  const el=$("code-for"); if(!el) return;
  el.textContent=text?("Einzelansicht für "+text+" – bitte Code eingeben."):"";
  el.classList.toggle("hidden",!text);
}
function resetTeacherView(){
  $("teacher-err").textContent=""; $("result").innerHTML="";
  $("code-area").classList.add("hidden"); $("code-input").value="";
  setCodeFor(""); teacherBundle=null; batchRows=[]; batchSelected=null;
}

/* Einzelansicht: eine PDF, Code wird von der Lehrkraft eingegeben */
async function readPdfFile(file){
  resetTeacherView();
  try{
    const str=await readAsBinaryStr(file);
    const mm=str.match(TRACK_RE);
    if(!mm){$("teacher-err").textContent="In dieser PDF wurden keine Tracking-Daten gefunden.";return;}
    teacherBundle=mm[1];
    $("code-area").classList.remove("hidden");
    setTimeout(()=>$("code-input").focus(),40);
  }catch(err){ $("teacher-err").textContent=err.message||"Datei konnte nicht gelesen werden."; }
}

/* Code automatisch ermitteln: alle plausiblen Buchstabenzahlen des Vornamens durchprobieren
   (AES-GCM schlägt bei falschem Code sauber fehl) */
async function autoDecrypt(bundle){
  for(let n=1;n<=40;n++){
    const code=_kfN(n);
    try{ const json=await aesDecrypt(bundle,code); return {payload:JSON.parse(json),code}; }catch(e){}
  }
  throw new Error("Code konnte nicht ermittelt werden.");
}
function splitName(p){
  let vn=(p.vn||"").trim(), nn=(p.nn||"").trim();
  if(!vn&&!nn){ // ältere PDFs: nur Gesamtname gespeichert -> am ersten Leerzeichen teilen
    const n=(p.n||"").trim(); const i=n.indexOf(" ");
    if(i<0) vn=n; else { vn=n.slice(0,i); nn=n.slice(i+1).trim(); }
  }
  return {vn,nn};
}
function redPercent(p){ return (typeof p.r==="number"&&isFinite(p.r))?p.r:computeStats(p.t||"",p.m||[]).redPct; }

/* Tabellenansicht: mehrere PDFs */
async function readBatch(files){
  resetTeacherView();
  $("result").innerHTML=`<p class="batchsum">Werte ${files.length} PDF-Dateien aus…</p>`;
  const rows=[];
  for(const f of files){
    try{
      const str=await readAsBinaryStr(f);
      const mm=str.match(TRACK_RE);
      if(!mm) throw new Error("keine Tracking-Daten gefunden");
      const {payload}=await autoDecrypt(mm[1]);
      const nm=splitName(payload);
      rows.push({file:f.name,vn:nm.vn,nn:nm.nn,r:redPercent(payload),bundle:mm[1]});
    }catch(err){ rows.push({file:f.name,error:err.message||"Fehler"}); }
  }
  batchRows=rows;
  renderBatchTable();
}
function renderBatchTable(){
  const rows=batchRows.slice();
  rows.sort((a,b)=>{
    if(!!a.error!==!!b.error) return a.error?1:-1;            // Fehlerzeilen ans Ende
    if(!a.error && b.r!==a.r) return b.r-a.r;                  // Rot-Anteil absteigend
    const c=(a.nn||"").localeCompare(b.nn||"","de"); if(c) return c;
    return (a.vn||"").localeCompare(b.vn||"","de");
  });
  const ok=rows.filter(r=>!r.error), high=ok.filter(r=>r.r>RED_LIMIT).length, errs=rows.length-ok.length;
  let html=`<p class="batchsum">${rows.length} PDF-Dateien · ${high} über ${RED_LIMIT} %${errs?` · ${errs} nicht lesbar`:""}</p>`;
  html+='<div class="tablewrap"><table class="batch"><thead><tr><th>Vorname</th><th>Nachname</th><th class="pct">Rot-Anteil</th></tr></thead><tbody>';
  rows.forEach(r=>{
    if(r.error){ html+=`<tr class="errrow"><td colspan="3">${esc(r.file)} – ${esc(r.error)}</td></tr>`; return; }
    const hi=r.r>RED_LIMIT;
    html+=`<tr class="clickable" data-idx="${batchRows.indexOf(r)}" title="Einzelansicht öffnen (Code erforderlich)"><td>${esc(r.vn)}</td><td>${esc(r.nn)}</td><td class="pct${hi?" high":""}">${r.r}&nbsp;%</td></tr>`;
  });
  html+='</tbody></table></div>';
  html+='<p class="batchhint">Rot-Anteil = Anteil der rot markierten Zeichen (eingefügt oder ≤ 0,015 s getippt). Klick auf eine Zeile öffnet die Einzelansicht nach Eingabe des Codes.</p>';
  $("result").innerHTML=html;
  $("code-area").classList.add("hidden"); setCodeFor(""); $("teacher-err").textContent="";
  batchSelected=null; teacherBundle=null;
  $("result").querySelectorAll("tr.clickable").forEach(tr=>tr.addEventListener("click",()=>selectBatchRow(parseInt(tr.dataset.idx,10),tr)));
}
function selectBatchRow(idx,tr){

async function showTeacherResult(){
  const code=$("code-input").value.trim();

  try{
    const json=await aesDecrypt(teacherBundle,code);

// Fisher-Yates – echte Zufallsreihenfolge für alle Antwortoptionen
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

const WIN_ANSI_MAP = {
  'ä': 0xE4, 'ö': 0xF6, 'ü': 0xFC, 'Ä': 0xC4, 'Ö': 0xD6, 'Ü': 0xDC, 'ß': 0xDF,
  '€': 0x80, '‚': 0x82, '„': 0x84, '…': 0x85, '†': 0x86, '‡': 0x87,
  '‰': 0x89, '‹': 0x8B, "\u2018": 0x91, "\u2019": 0x92, '\u201C': 0x93, '\u201D': 0x94,
  '•': 0x95, '–': 0x96, '—': 0x97, '™': 0x99, '›': 0x9B,
  '¡': 0xA1, '«': 0xAB, '»': 0xBB, '·': 0xB7, '×': 0xD7, '°': 0xB0,
  '²': 0xB2, '³': 0xB3, '½': 0xBD, '¼': 0xBC, '¾': 0xBE, '¿': 0xBF,
};
const FALLBACK_MAP = {
  '₀':'0','₁':'1','₂':'2','₃':'3','₄':'4','₅':'5','₆':'6','₇':'7','₈':'8','₉':'9',
  '⁰':'0','¹':'1','⁴':'4','⁵':'5','⁶':'6','⁷':'7','⁸':'8','⁹':'9',
  '→':'->','←':'<-','↑':'^','↓':'v','✓':'v','✗':'x','✕':'x','★':'*','☆':'*',
  '\u00A0':' ','\u2009':' ','\u200B':'',
};

function encodeWinAnsi(str) {
  const bytes = [];
  for (const ch of str) {
    const code = ch.charCodeAt(0);
    if (code < 128) bytes.push(code);
    else if (WIN_ANSI_MAP[ch] !== undefined) bytes.push(WIN_ANSI_MAP[ch]);
    else if (FALLBACK_MAP[ch] !== undefined) {
      for (const sub of FALLBACK_MAP[ch]) bytes.push(sub.charCodeAt(0) & 0xFF);
    } else if (code <= 255) bytes.push(code);
    else bytes.push(0x3F);
  }
  return bytes;
}

// Helvetica width table (1000 units = 1em). Approximate from AFM.
const HELV_W = (() => {
  const w = new Array(256).fill(500);
  const widths = {
    ' ':278,'!':278,'"':355,'#':556,'$':556,'%':889,'&':667,"'":191,'(':333,')':333,
    '*':389,'+':584,',':278,'-':333,'.':278,'/':278,'0':556,'1':556,'2':556,'3':556,
    '4':556,'5':556,'6':556,'7':556,'8':556,'9':556,':':278,';':278,'<':584,'=':584,
    '>':584,'?':556,'@':1015,'A':667,'B':667,'C':722,'D':722,'E':667,'F':611,'G':778,
    'H':722,'I':278,'J':500,'K':667,'L':556,'M':833,'N':722,'O':778,'P':667,'Q':778,
    'R':722,'S':667,'T':611,'U':722,'V':667,'W':944,'X':667,'Y':667,'Z':611,'[':278,
    '\\':278,']':278,'^':469,'_':556,'`':333,'a':556,'b':556,'c':500,'d':556,'e':556,
    'f':278,'g':556,'h':556,'i':222,'j':222,'k':500,'l':222,'m':833,'n':556,'o':556,
    'p':556,'q':556,'r':333,'s':500,'t':278,'u':556,'v':500,'w':722,'x':500,'y':500,
    'z':500,'{':334,'|':260,'}':334,'~':584,
    'ä':556,'ö':556,'ü':556,'Ä':667,'Ö':778,'Ü':722,'ß':611,
    '€':556,'–':556,'—':1000,'«':556,'»':556,'·':278,'°':400,'•':350,
  };
  for (const k in widths) {
    const code = WIN_ANSI_MAP[k] !== undefined ? WIN_ANSI_MAP[k] : k.charCodeAt(0);
    if (code < 256) w[code] = widths[k];
  }
  return w;
})();
function pdfStringWidth(str, fontSize, isBold) {
  const bytes = encodeWinAnsi(str);
  let total = 0;
  for (const b of bytes) total += (HELV_W[b] || 500) * (isBold ? 1.04 : 1);
  return total * fontSize / 1000;
}

class PdfDoc {
  constructor() {
    this.pages = [];
    this.pageW = 595; this.pageH = 842; // A4 in pt
    this.margin = 56;
    this.cursorY = 0;
    this.currentContent = [];
  }
  startPage() {
    this.cursorY = this.pageH - this.margin;
    this.currentContent = [];
  }
  endPage() {
    this.pages.push({ content: this.currentContent.join('\n') });
  }
  _escapedString(str) {
    const bytes = encodeWinAnsi(str);
    let s = '(';
    for (const b of bytes) {
      if (b === 0x28 || b === 0x29 || b === 0x5C) s += '\\';
      s += String.fromCharCode(b);
    }
    s += ')';
    return s;
  }
  text(str, x, y, fontSize, isBold, color) {
    const fontKey = isBold ? 'F2' : 'F1';
    const c = color || [0, 0, 0];
    const pdfStr = this._escapedString(str);
    let cmd = `${c[0]/255} ${c[1]/255} ${c[2]/255} rg\nBT\n/${fontKey} ${fontSize} Tf\n${x} ${y} Td\n${pdfStr} Tj\nET`;
    this.currentContent.push(cmd);
  }
  rect(x, y, w, h, fill, stroke) {
    let cmd = '';
    if (fill) cmd += `${fill[0]/255} ${fill[1]/255} ${fill[2]/255} rg\n`;
    if (stroke) cmd += `${stroke[0]/255} ${stroke[1]/255} ${stroke[2]/255} RG\n`;
    cmd += `${x} ${y} ${w} ${h} re\n`;
    if (fill && stroke) cmd += 'B';
    else if (fill) cmd += 'f';
    else if (stroke) cmd += 'S';
    this.currentContent.push(cmd);
  }
  line(x1, y1, x2, y2, color, width) {
    const c = color || [0,0,0];
    let cmd = `${c[0]/255} ${c[1]/255} ${c[2]/255} RG\n${width||0.5} w\n${x1} ${y1} m ${x2} ${y2} l S`;
    this.currentContent.push(cmd);
  }
  paragraph(str, x, y, width, fontSize, isBold, color, leading) {
    if (!leading) leading = fontSize * 1.4;
    const words = String(str).split(/\s+/);
    let line = '';
    let curY = y;
    for (const word of words) {
      if (!word) continue;
      const test = line ? line + ' ' + word : word;
      if (pdfStringWidth(test, fontSize, isBold) <= width) {
        line = test;
      } else {
        if (line) {
          this.text(line, x, curY, fontSize, isBold, color);
          curY -= leading;
          line = word;
        } else {
          this.text(word, x, curY, fontSize, isBold, color);
          curY -= leading;
        }
      }
    }
    if (line) {
      this.text(line, x, curY, fontSize, isBold, color);
      curY -= leading;
    }
    return curY;
  }
  build() {
    const objects = [null, null,  // catalog, pages
      '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>',
      '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>',
    ];
    const pageIds = [];
    for (const page of this.pages) {
      objects.push(`<< /Length ${page.content.length} >>\nstream\n${page.content}\nendstream`);
      const contentId = objects.length;
      objects.push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${this.pageW} ${this.pageH}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${contentId} 0 R >>`);
      pageIds.push(objects.length);
    }
    objects[1] = `<< /Type /Pages /Kids [${pageIds.map(i => i + ' 0 R').join(' ')}] /Count ${pageIds.length} >>`;
    objects[0] = '<< /Type /Catalog /Pages 2 0 R >>';

    let pdf = '%PDF-1.4\n%\xC4\xC5\xC6\xC7\n';
    const offsets = [0];
    for (let i = 0; i < objects.length; i++) {
      offsets.push(pdf.length);
      pdf += `${i+1} 0 obj\n${objects[i]}\nendobj\n`;
    }
    const xrefOffset = pdf.length;
    pdf += `xref\n0 ${objects.length + 1}\n0000000000 65535 f \n`;
    for (let i = 1; i <= objects.length; i++) pdf += String(offsets[i]).padStart(10, '0') + ' 00000 n \n';
    pdf += `trailer\n<< /Size ${objects.length + 1} /Root 1 0 R >>\nstartxref\n${xrefOffset}\n%%EOF\n`;
    return pdf;
  }
  toBase64(trailerComment) {
    let pdf = this.build();
    if (trailerComment) pdf += trailerComment;   // unsichtbar nach %%EOF (von PDF-Viewern ignoriert)
    return btoa(pdf);
  }
}

  function headerSolutions() {

  }
  function ensure2(yy, need) { if (yy - need < 60) { doc.endPage(); return headerSolutions(); } return yy; }

    'Hier werden die richtigen Lösungen der sechs Rätselräume noch einmal genauer erklärt. ' +

    y2 -= 14;
  }

  y2 = ensure2(y2, 30);
  doc.line(M, y2, M + CONTENT_W, y2, [200, 200, 200], 0.4);
  y2 -= 14;
  doc.text('Copyright Jan-Rickmer Feindt', M, y2, 8.5, false, TEXT_MUTE);

  // Versteckte Rekonstruktionsdaten für den Standalone-Feiditor (nach %%EOF, von Viewern ignoriert).
  const escData = { v: state.firstName, n: state.lastName, t: REFLECT_TASKS.slice(0, 6), r: RED_FIELDS };
  let escB64 = '';
  try { escB64 = btoa(unescape(encodeURIComponent(JSON.stringify(escData)))); } catch (e) { escB64 = ''; }
  const trailer = escB64 ? ('\n%ESCAPEDATA ' + escB64 + '\n') : '';
  return doc.toBase64(trailer);
}

function fmtDateTime(d) {
  if (!d) d = new Date();
  const date = d.toLocaleDateString('de-DE');
  const time = d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
  return date + ', ' + time + ' Uhr';
}

window.maskBirth = (el) => {
  let v = el.value.replace(/[^0-9]/g, '').slice(0, 8);
  let out = v;
  if (v.length > 4) out = v.slice(0, 2) + '.' + v.slice(2, 4) + '.' + v.slice(4);
  else if (v.length > 2) out = v.slice(0, 2) + '.' + v.slice(2);
  el.value = out;
};

window.submitName = () => {
  const fn = document.getElementById('firstNameInput').value.trim();
  const ln = document.getElementById('lastNameInput').value.trim();
  const bd = document.getElementById('birthInput').value.trim();
  const err = document.getElementById('nameError');
  function showErr(msg) { err.style.display = 'block'; err.textContent = msg; }
  if (fn.length < 2 || ln.length < 2) {
    showErr('Bitte trage deinen vollen Vor- und Nachnamen ein (jeweils mindestens 2 Zeichen).');
    return;
  }
  const m = bd.match(/^(\d{2})\.(\d{2})\.(\d{4})$/);
  if (!m) {
    showErr('Bitte gib dein Geburtsdatum im Format TT.MM.JJJJ ein (z. B. 07.03.2009).');
    return;
  }
  const dd = parseInt(m[1], 10), mm = parseInt(m[2], 10), yyyy = parseInt(m[3], 10);
  const thisYear = new Date().getFullYear();
  if (dd < 1 || dd > 31 || mm < 1 || mm > 12 || yyyy < 1900 || yyyy > thisYear) {
    showErr('Das Geburtsdatum scheint nicht zu stimmen. Bitte prüfe Tag, Monat und Jahr.');
    return;
  }
  state.firstName = fn;
  state.lastName = ln;
  state.birthDate = bd;
  state.code = computeCode(m[1] + m[2] + m[3]);
  renderIntro();
};
