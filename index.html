   ============================================================ */

function triggerReveal(roomIdx) {
  state.solved[roomIdx] = true;
  state.letters[roomIdx] = CODE_WORD[roomIdx];

  const overlay = document.getElementById('revealOverlay');
  document.getElementById('revealLetter').textContent = CODE_WORD[roomIdx];
  document.getElementById('revealCaption').textContent = `Buchstabe ${roomIdx + 1} von 6 freigeschaltet`;

  // Build the progress letters
  const progBox = document.getElementById('revealProgress');
  progBox.innerHTML = '';
  for (let i = 0; i < 6; i++) {
    const span = document.createElement('span');
    span.className = 'reveal-progress-letter' + (state.solved[i] ? ' lit' : '');
    span.textContent = state.solved[i] ? CODE_WORD[i] : '·';
    progBox.appendChild(span);
  }

  // Button: continue
  const btn = document.getElementById('revealContinue');
  const isLast = roomIdx === 5;
  btn.textContent = isLast ? 'Verhandlungssaal betreten' : 'Nächste Bibliothek betreten';
  btn.onclick = () => {
    overlay.classList.remove('show');
    setTimeout(() => {
      if (isLast) renderFinal();
      else goLibrary(roomIdx + 2);  // next library (roomIdx 0 = room 1 → goLibrary(2))
    }, 300);
  };

  overlay.classList.add('show');
}

   PDF 2 — Reflexions-Datei (dynamisch erzeugt)

const REFLECT_TASKS = [
  'Erkläre in eigenen Worten, wofür eine Kommune (Stadt, Gemeinde, Landkreis) in der Klimapolitik zuständig ist – und wofür nicht. Nenne je zwei eigene Beispiele. (Bibliotheksraum 1)',
  'Fasse die vier zentralen Bundesgesetze der Klimapolitik in eigenen Worten zusammen: Was bewirken KSG, BEHG, GEG und BImSchG jeweils? (Bibliotheksraum 2)',
  'Erkläre das Subsidiaritätsprinzip in eigenen Worten. Warum regelt die EU z. B. CO2-Grenzwerte für Autos, während der Energiemix in der Hand der Mitgliedstaaten bleibt? (Bibliotheksraum 3)',
  'Beschreibe das Pariser Abkommen mit eigenen Worten: Was wurde dort vereinbart, und was bedeutet der Begriff „NDC"? (Bibliotheksraum 4)',
  'Vergleiche zwei der vier Nachhaltigkeitssäulen (Effizienz, Suffizienz, Konsistenz, Partizipation): Worin unterscheiden sie sich grundsätzlich? Nenne zu jeder ein eigenes Beispiel. (Bibliotheksraum 5)',
  'Erläutere die Regel „so lokal wie möglich, so weit oben wie nötig" an einem selbst gewählten Klimaproblem: Auf welcher Ebene würdest du es regeln und warum? (Bibliotheksraum 6)',
  'Bearbeite nun auf Moodle die Aufgabe „Text verfassen …".',
  'Lade diese Reflexions-Datei in der dafür vorgesehenen Abgabe bei Moodle hoch.',
];

// Texte der beiden roten Felder des Feiditors – exakt wie im eingebetteten Feiditor.
// Werden (zusammen mit Name & Aufgaben) versteckt in die Überblick-PDF eingebettet,
// damit der Standalone-Feiditor sie bei einem PDF-Upload rekonstruieren kann.
const RED_FIELDS = [
  'Wandle diesen Text nun in eine PDF-Datei um und lade diese PDF-Datei in der korrekten Abgabe auf Moodle hoch.',
  'Aufgabe 7: Nachdem du die Lösungen zu Aufgaben 1-6 auf Moodle hochgeladen hast, bearbeitest du die auf Moodle verlinkte Aufgabe "Text verfassen ..."',
];

function generateReflexionPdf() {
  const doc = new PdfDoc();
  const W = doc.pageW, H = doc.pageH, M = doc.margin; const CW = W - 2 * M;
  const PRIMARY = [27, 73, 101], GOLD = [212, 175, 55], MUTE = [108, 120, 136], TEXT = [25, 25, 25], LINE = [205, 205, 205];

  function header() {
    doc.startPage();
    doc.rect(0, H - 72, W, 72, PRIMARY);
    doc.text('Reflexion — EU-Klimagipfel', M, H - 38, 18, true, [255, 255, 255]);
    doc.text('Escape-Room „EU-Klimagipfel" · Bearbeite die Aufgaben in eigenen Worten', M, H - 58, 9, false, [214, 226, 228]);
    return H - 72 - 22;
  }
  function ensure(y, need) { if (y - need < 70) { doc.endPage(); return header(); } return y; }

  let y = header();

  // Identifikationsblock: Name, Geburtsdatum, Zeitpunkt der Vollendung
  const bH = 58;
  doc.rect(M, y - bH, CW, bH, [244, 248, 251]);
  doc.rect(M, y - bH, 3, bH, GOLD);
  doc.text('NAME', M + 14, y - 15, 8, true, GOLD);
  doc.text(state.firstName + ' ' + state.lastName, M + 14, y - 30, 12.5, true, PRIMARY);
  doc.text('GEBURTSDATUM', M + 260, y - 15, 8, true, GOLD);
  doc.text(state.birthDate, M + 260, y - 30, 11, false, TEXT);
  doc.text('ESCAPE-ROOM ABGESCHLOSSEN AM', M + 14, y - 46, 8, true, GOLD);
  doc.text(fmtDateTime(state.completedAt), M + 200, y - 46, 10, false, TEXT);
  y -= bH + 16;

  y = doc.paragraph('Diese Reflexion vertieft die Inhalte aus den Bibliotheksräumen. Beantworte die folgenden Aufgaben in eigenen Worten – stichpunktartig oder in ganzen Sätzen.',
    M, y, CW, 10.5, false, TEXT, 14);
  y -= 8;

  for (let i = 0; i < REFLECT_TASKS.length; i++) {
    const isLast = i === REFLECT_TASKS.length - 1;
    const isSecondLast = i === REFLECT_TASKS.length - 2;
    y = ensure(y, (isLast || isSecondLast) ? 70 : 120);
    doc.text('Aufgabe ' + (i + 1), M, y, 11, true, GOLD);
    y -= 15;
    y = doc.paragraph(REFLECT_TASKS[i], M, y, CW, 11, true, TEXT, 15);
    y -= 8;
    if (isLast || isSecondLast) {
      // Moodle-Aufgaben: Checkbox statt Schreiblinien
      doc.rect(M, y - 12, 12, 12, null, MUTE);
      doc.text('erledigt', M + 20, y - 10, 9.5, false, MUTE);
      y -= 26;
    } else {
      // Schreiblinien
      for (let l = 0; l < 4; l++) { y -= 20; doc.line(M, y, M + CW, y, LINE, 0.5); }
      y -= 14;
    }
  }

  y = ensure(y, 30);
  doc.line(M, y, M + CW, y, LINE, 0.4); y -= 14;
  doc.text('Copyright Jan-Rickmer Feindt', M, y, 8.5, false, MUTE);
  doc.endPage();
  return doc.toBase64();
}

/* ============================================================
   DOWNLOAD-HELFER
   ============================================================ */
function translit(s) {
  return (s || '').replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue')
    .replace(/Ä/g, 'Ae').replace(/Ö/g, 'Oe').replace(/Ü/g, 'Ue').replace(/ß/g, 'ss')
    .replace(/[^a-zA-Z0-9-]/g, '');
}
function downloadPdfBase64(b64, filename) {
  const binary = atob(b64); const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  const blob = new Blob([bytes], { type: 'application/pdf' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a'); link.href = url; link.download = filename;
  document.body.appendChild(link); link.click(); document.body.removeChild(link);
  setTimeout(() => URL.revokeObjectURL(url), 1200);
}

window.downloadReflexionPDF = () => {
  try {
    const b64 = generateReflexionPdf();
    const name = translit(state.lastName) || 'Schueler';
    downloadPdfBase64(b64, `Reflexion_${name}_${state.code}.pdf`);
  } catch (e) {
    console.error('Reflexion PDF generation failed:', e);
    alert('Konnte die Reflexions-Datei nicht erzeugen: ' + e.message);
  }
};

/* ============================================================
   DIGITALES ARBEITSBLATT IM FEIDITOR
   (Programmierung wie in den Referenz-Escape-Rooms; nur die
    Aufgabenstellungen stammen aus dem bisherigen EU-Arbeitsblatt)
   ============================================================ */
window.openFeiditor = () => {
  try {
    const tplEl = document.getElementById('feiditor-src');
    if (!tplEl) { alert('Der Feiditor konnte nicht geladen werden.'); return; }
    // Eingebetteten Feiditor-Quelltext holen und die escapten Script-End-Tags wiederherstellen
    let html = tplEl.textContent.replace(/<\\\/script>/gi, '<\/script>');
    // Escape-Room-Daten in den Feiditor injizieren: Name, die sechs Aufgaben, die roten Felder
    // und alle Daten für die Übersichts-Seiten der kombinierten PDF
    const data = {
      firstName: state.firstName,
      lastName:  state.lastName,
      birthDate: state.birthDate,
      code:      state.code,
      tasks:     REFLECT_TASKS.slice(0, 6),
      redFields: RED_FIELDS,
      overview:  {
        firstName:     state.firstName,
        lastName:      state.lastName,
        birthDate:     state.birthDate,
        code:          state.code,
        completedAt:   fmtDateTime(state.completedAt),
        attempts:      state.attempts,
        mistakes:      state.mistakes,
        roomLabels:    ROOM_LABELS,
        solutionNotes: SOLUTION_NOTES,
        subtitle:      'PoWi · E-Phase · E2.3 · Escape-Room „EU-Klimagipfel"'
      }
    };
    const inject = '<script>window.__ESCAPE_DATA__=' + JSON.stringify(data).replace(/</g, '\\u003c') + ';<\/script>';
    // Direkt nach dem öffnenden <head> einfügen (erstes Vorkommen = echter Dokument-Head;
    // ein </head> käme auch in JS-Strings des Feiditors vor und wäre kein sicherer Anker)
    if (html.indexOf('<head>') !== -1) html = html.replace('<head>', '<head>\n' + inject);
    else html = inject + html;
    // Per document.write öffnen, damit der sichere Kontext (crypto.subtle) erhalten bleibt.
    // Ein Blob-URL würde den secure context verlieren -> Verschlüsselung schlägt fehl.
    const win = window.open('', '_blank');
    if (!win) { alert('Bitte erlaube Pop-ups für diese Seite, damit sich das digitale Arbeitsblatt öffnen kann.'); return; }
    win.document.open();
    win.document.write(html);
    win.document.close();
  } catch (e) { console.error(e); alert('Das digitale Arbeitsblatt konnte nicht geöffnet werden: ' + e.message); }
};

window.downloadOverviewPDF = () => {
  try {
    const b64 = generateMistakesPdf();
    const clean = (s) => (s || '').trim().replace(/\s+/g, '-').replace(/[\/\\:*?"<>|]+/g, '');
    const vn = clean(state.firstName) || 'Vorname';
    const nn = clean(state.lastName) || 'Nachname';
    const filename = `Escape-Room-Überblick_von_${vn}_${nn}.pdf`;
    const binary = atob(b64);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    // Als generischer Binärstrom (octet-stream) statt application/pdf: So kann kein Browser die Datei
    // inline anzeigen – auch Firefox/Chrome mit „PDF im Browser öffnen" müssen sie speichern. Der Name
    // (.pdf) kommt über das download-Attribut; die Datei selbst ist eine ganz normale PDF.
    const blob = new Blob([bytes], { type: 'application/octet-stream' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url; link.download = filename; link.rel = 'noopener'; link.style.display = 'none';
    document.body.appendChild(link);
    link.click();   // synchron im Klick-Handler -> gilt als vom Nutzer ausgelöst
    // Link und Object-URL erst verzögert entfernen: manche Browser brechen den Download sonst ab
    setTimeout(() => { try { document.body.removeChild(link); } catch (e) {} URL.revokeObjectURL(url); }, 5000);
  } catch (e) {
    console.error('Overview PDF generation failed:', e);
    alert('Konnte die Datei „Escape-Room-Überblick" nicht erzeugen: ' + e.message);
  }
};
